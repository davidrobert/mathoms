# docker-compose.smoke.yml — Stack de smoke test local (A6b.5)
#
# Inicia apenas o Redis (dependência externa). Backend, Celery worker
# e frontend são iniciados via Makefile como processos locais (sem Docker
# para app — Dockerfiles chegam em F7).
#
# Uso preferido:
#   make smoke-up    → Redis + backend + worker + frontend em background
#   make smoke-seed  → seed DB com usuários/workspace/fixtures
#   make smoke-down  → para tudo
#
# Ou só o Redis:
#   docker compose -f docker-compose.smoke.yml up -d
#   docker compose -f docker-compose.smoke.yml down

services:
  redis-smoke:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: mathoms-smoke-redis
    ports:
      # Host 6380 (não 6379): 6379 é a porta do redis NATIVO da stack dev, cujo
      # `dev-redis-up` "reusa" qualquer listener em 6379. Isolar o smoke aqui
      # impede que `smoke-down` derrube um redis que a nativa reusou e que o bind
      # reverso (native 6379 → smoke-up) colida. A porta INTERNA do container
      # continua 6379 — consumidores da rede compose (pipeline-service →
      # redis-smoke:6379) não mudam. Override: MATHOMS_SMOKE_REDIS_PORT.
      - "${MATHOMS_SMOKE_REDIS_PORT:-6380}:6379"
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Sem volumes nomeados — smoke data é efêmera; `make smoke-reset` limpa tudo.
