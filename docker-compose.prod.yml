# =============================================================================
# Mathoms AI — docker-compose.prod.yml (lane 7A-dev · dev.5)
# =============================================================================
# Stack mínimo para `dev.mathoms.ai` (VPS gerenciado + plataforma de
# deploy self-hosted — A34.l11: topologia de produção não nomeia fornecedor).
# Orquestra:
#   postgres + redis + api + worker + beat + frontend
#
# Decisões aceitas (vide ADR-108 e contexto 7A-dev):
#   - Sem Traefik aqui — a plataforma de deploy roda Traefik externamente e injeta TLS.
#     Portas expostas em 127.0.0.1 só para teste local (o proxy da plataforma
#     entra via rede do compose, não via host port).
#   - 1 réplica de `api` (Alembic upgrade idempotente, mas race em
#     multi-replica). `worker` e `beat` aguardam `api` healthy antes de
#     subir — evita conectar em DB pré-migração.
#   - Imagem backend é construída uma vez no service `api` (`image:` +
#     `build:`); `worker` e `beat` apenas referenciam o mesmo `image:` tag,
#     reusando a build sem rebuild triplo.
#   - Volumes persistentes: `mathoms_pgdata` (Postgres), `mathoms_redisdata`
#     (snapshots Redis) e `mathoms_storage` (uploads/artifacts montado em
#     /app/storage nos 3 modos de backend — todos podem escrever).
#   - Healthcheck só no `api` (curl /health) e no `frontend` (curl /).
#     Worker/beat não têm endpoint HTTP — `disable: true` evita ruído.
#
# Como rodar localmente (smoke do compose, sem a plataforma de deploy):
#   1. cp .env.prod.example .env.prod.local
#   2. ./dev/gen-secrets.sh >> .env.prod.local   # FERNET_KEY/SECRET_KEY/POSTGRES_PASSWORD
#   3. docker compose --env-file .env.prod.local -f docker-compose.prod.yml up --build
#
# Como a plataforma de deploy usa:
#   - Build context = repo root.
#   - Env vars do `.env.prod.local` são importadas pela UI da plataforma; valores
#     `${VAR}` abaixo são resolvidos pela plataforma no deploy.
#   - A plataforma substitui as portas 127.0.0.1:* pela rede interna dela —
#     mantemos o bind local apenas para validação humana via SSH tunnel.
#
# Não substitui `docker-compose.dev.yml` (frontend-ops local) nem
# `docker-compose.smoke.yml` (Redis efêmero pra `make smoke-up`).
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mathoms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis BROKER — Celery message queue + result backend.
  # Policy `noeviction`: cheia → comandos write retornam erro (cliente sabe).
  # `allkeys-lru` aqui evictava mensagens Celery silenciosamente sob pico —
  # jobs sumiam, run ficava em "queued" eterno. Bug crítico de produção.
  redis-broker:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - mathoms_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis CACHE — Pub/Sub (pipeline progress, eventos), cache ephemeral.
  # Policy `allkeys-lru`: pode evictar; consumidores tratam miss como recompute.
  # Pub/Sub não é afetado por maxmemory (mensagens não persistem como keys).
  redis-cache:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: mathoms-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    env_file:
      - .env.prod.local
    environment:
      # DSNs internos (rede do compose) sobrescrevem o que vier do env_file.
      # Constrói a partir das partes do .env.prod.local — evita duplicar a
      # senha em duas variáveis e mantém uma fonte única (POSTGRES_PASSWORD).
      MATHOMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MATHOMS_REDIS_URL: redis://redis-broker:6379/0
      MATHOMS_REDIS_CACHE_URL: redis://redis-cache:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mathoms_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Alembic upgrade na primeira run pode levar 30s+ — start_period
      # generoso evita marcar unhealthy enquanto a migração ainda corre.
      start_period: 60s
    restart: unless-stopped

  worker:
    # Reusa a tag construída pelo service `api` — Compose não rebuilda.
    image: mathoms-backend:dev
    command: ["worker"]
    env_file:
      - .env.prod.local
    environment:
      MATHOMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MATHOMS_REDIS_URL: redis://redis-broker:6379/0
      MATHOMS_REDIS_CACHE_URL: redis://redis-cache:6379/0
    volumes:
      - mathoms_storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      # Worker não expõe HTTP. Liveness via Celery control: `inspect ping`
      # faz round-trip pelo broker e responde `pong` se o worker está vivo
      # (A20.L3 · ADR-252 D4). timeout/start_period folgados: o reply passa
      # pela fila e o worker carrega o app + conecta no broker no boot.
      test: ["CMD-SHELL", "celery -A backend.app.worker inspect ping || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 45s
      retries: 3
    restart: unless-stopped

  beat:
    image: mathoms-backend:dev
    command: ["beat"]
    env_file:
      - .env.prod.local
    environment:
      MATHOMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MATHOMS_REDIS_URL: redis://redis-broker:6379/0
      MATHOMS_REDIS_CACHE_URL: redis://redis-cache:6379/0
    depends_on:
      api:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    # Sem healthcheck: beat é PID 1 (exec). Crash → container morre →
    # `restart: unless-stopped` reinicia. Não há liveness barato e honesto:
    # `inspect ping` é só para workers; pidfile fica stale e mascara morte
    # (A20.L3 · ADR-252 D4 — decisão sre-devops).
    restart: unless-stopped

  frontend:
    image: mathoms-frontend:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env.prod.local
    environment:
      # Rewrite server-side do Next aponta para a rede interna do compose;
      # NEXT_PUBLIC_API_URL (build-time, usado client-side) já vem do env_file.
      BACKEND_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        # `service_started` basta — frontend pode subir em paralelo ao
        # boot do api; o rewrite só é exercido quando o usuário navega.
        condition: service_started
    healthcheck:
      # Imagem `node:22-alpine` não inclui curl; usar wget (presente no busybox).
      # Next.js standalone só escuta IPv4 (HOSTNAME=0.0.0.0), mas `localhost` em
      # alpine resolve ::1 primeiro → connection refused. Endereçamos 127.0.0.1.
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  mathoms_pgdata:
  mathoms_redisdata:
  mathoms_storage:
