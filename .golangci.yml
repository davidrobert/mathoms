version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gocyclo:
      min-complexity: 15
    govet:
      enable-all: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: unused-parameter
        - name: var-naming
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - revive
        text: "unused-parameter"
      - path: _test\.go
        linters:
          - goconst
      - path: services/pipeline-service-go/internal/api/
        linters:
          - revive
        text: "should be .*APIV1"

formatters:
  enable:
    - gofmt
    - goimports
