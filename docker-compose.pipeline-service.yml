# docker-compose.pipeline-service.yml — adds pipeline-service on the smoke net
#
# Composes with docker-compose.smoke.yml:
#   docker compose -f docker-compose.smoke.yml -f docker-compose.pipeline-service.yml up -d
#
# The service mounts the repo read-only so `pipeline/` edits are picked up
# without rebuild. For production use, the Dockerfile copies the sources.
#
# Backend opt-in to HTTP boundary: set
#   MATHOMS_PIPELINE_SERVICE_URL=http://localhost:8001
# on the API + worker (Makefile targets). Unset = InProcessPipelineClient.

services:
  pipeline-service:
    build:
      context: .
      dockerfile: pipeline-service/Dockerfile
    container_name: mathoms-pipeline-service
    ports:
      - "8001:8001"
    environment:
      PIPELINE_SERVICE_HOST: 0.0.0.0
      PIPELINE_SERVICE_PORT: 8001
      REDIS_URL: redis://redis-smoke:6379/0
      MATHOMS_LOG_FORMAT: json
      MATHOMS_LOG_LEVEL: INFO
      # ADR-303/ADR-212: stages leem/gravam pipeline_artifacts — o container
      # compartilha o MESMO SQLite file do smoke stack local (make smoke-up).
      # Restrição: SQLite multi-writer cross-boundary é só para smoke
      # SEQUENCIAL (seed → execute); concorrência real exige Postgres (F2).
      MATHOMS_DATABASE_URL: sqlite+aiosqlite:////repo/mathoms-smoke.db
      MATHOMS_REDIS_URL: redis://redis-smoke:6379/0
      # Mesma key do smoke stack (SMOKE_FERNET_KEY=$(cat _smoke_pids/fernet.key));
      # o target `make smoke-pipeline-service` injeta automaticamente.
      MATHOMS_FERNET_KEY: ${SMOKE_FERNET_KEY:-}
    depends_on:
      redis-smoke:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      # Manter em sync com os COPYs do Dockerfile — mount ausente = cópia stale.
      - ./pipeline:/repo/pipeline:ro
      - ./pipeline-service:/repo/pipeline-service:ro
      - ./backend:/repo/backend:ro
      - ./scripts:/repo/scripts:ro
      - ./config:/repo/config:ro
      # DB do smoke (criado por `make smoke-up`) + workspaces visíveis no container.
      - ./mathoms-smoke.db:/repo/mathoms-smoke.db
      - ./_smoke_storage:/repo/_smoke_storage

  # Shell Go (F1 Fase 4, track f1-go-service) — convive com o Python (:8001)
  # até o decommission (F3). Porta 8002 no host p/ smoke side-by-side.
  pipeline-service-go:
    build:
      context: .
      dockerfile: services/pipeline-service-go/Dockerfile
    container_name: mathoms-pipeline-service-go
    init: true
    stop_grace_period: 45s
    ports:
      - "8002:8001"
    environment:
      PIPELINE_SERVICE_PORT: 8001
      REDIS_URL: redis://redis-smoke:6379/0
      MATHOMS_LOG_FORMAT: json
      MATHOMS_DATABASE_URL: sqlite+aiosqlite:////repo/mathoms-smoke.db
      MATHOMS_REDIS_URL: redis://redis-smoke:6379/0
      MATHOMS_FERNET_KEY: ${SMOKE_FERNET_KEY:-}
    depends_on:
      redis-smoke:
        condition: service_healthy
    volumes:
      # Em sync com os COPYs do Dockerfile Go (mount ausente = cópia stale).
      - ./pipeline:/repo/pipeline:ro
      - ./backend:/repo/backend:ro
      - ./scripts:/repo/scripts:ro
      - ./config:/repo/config:ro
      - ./mathoms-smoke.db:/repo/mathoms-smoke.db
      - ./_smoke_storage:/repo/_smoke_storage
