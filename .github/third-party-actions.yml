# Registro de TODA action externa usada em .github/workflows/ (gate:
# dev/check_required_job_actions.py). Chave = `owner/repo`; `ref` = o ref exato
# do `uses:` (tag ou SHA) — `runs_using` só descreve a versão que `ref` nomeia.
#
# ADR-320 §Emenda 2026-08-03: `runs.using: docker` é vedado em job required —
# o SHA-pin das actions de terceiro (A34.l14) cobre o CÓDIGO da action, não a
# IMAGEM BASE que uma action `runs.using: docker` builda em runtime. Achado do
# #1161: `CodelyTV/pr-size-labeler` puxava `alpine:3.15` sem digest, um timeout
# de I/O do Docker Hub bloqueou o build, e o required check "Title (Conventional
# Commits)" reprovou o repo inteiro sem nenhuma linha de diff alcançar o job.
#
# ADR-320 §Emenda 2026-10-08: o registro era chaveado só pelo nome e o gate
# descartava o `@ref`, então `runs_using` descrevia a action, não a versão em
# uso — bump de SHA para uma versão docker, ou `checkout@v4` (node20) num job
# required, passava verde. Agora todo `uses:` tem de casar com `ref`, e
# `runs.using` abaixo de node24 é vedado em QUALQUER workflow (o runner não tem
# Node 20 desde 2026-09-23; action node20 roda forçada em Node 24).
#
# Ação sem gate era convenção editorial — dívida, não garantia (mesma família da
# emenda da ADR-111). Este arquivo + o gate tornam a regra verificável.
#
# Bump ou action nova: o gate reprova até a entrada acompanhar. Rede só neste
# passo manual, nunca no gate:
#   python3 dev/check_required_job_actions.py --suggest
# imprime a entrada pronta (ref + runs.using lido do action.yml no ref novo).
# Se `runs.using` vier `docker` (ou variante `docker1`/etc.), a action NÃO pode
# entrar num job `required_jobs` — mova o job para fora do fecho, ou troque a
# action por um script inline (padrão do #1161: `gh` CLI em vez de action).

actions:
  actions/checkout:
    ref: "v5"
    runs_using: node24
    verified_at: "2026-10-08"
  actions/setup-python:
    ref: "v6"
    runs_using: node24
    verified_at: "2026-10-08"
