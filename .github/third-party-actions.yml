# Registro de actions admitidas em jobs required — POLÍTICA, à mão (gate:
# dev/check_required_job_actions.py). O FATO (`runs.using` de cada versão em uso)
# vive em .github/actions.lock.yml, gerado por `python3 dev/refresh_actions_lock.py`
# e chaveado pelo `uses:` exato. Por isso este arquivo não guarda runs_using nem
# data de verificação: um fato aqui viraria segunda fonte, que diverge do lock no
# primeiro bump. O gate reprova `actions` que não seja lista de nomes.
#
# ADR-320 §Emenda 2026-08-03: `runs.using: docker` é vedado em job required —
# o SHA-pin das actions de terceiro (A34.l14) cobre o CÓDIGO da action, não a
# IMAGEM BASE que uma action `runs.using: docker` builda em runtime. Achado do
# #1161: `CodelyTV/pr-size-labeler` puxava `alpine:3.15` sem digest, um timeout
# de I/O do Docker Hub bloqueou o build, e o required check "Title (Conventional
# Commits)" reprovou o repo inteiro sem nenhuma linha de diff alcançar o job.
# ADR-320 §Emenda 2026-10-09 (runtime pelo lock): em job required só node24 —
# composite também fica fora, porque pode embrulhar uma action docker ou rodar
# `docker run` num step, e o lock só lê o action.yml de topo.
#
# Admitir action nova num job `required_jobs`: use-a no workflow, rode o refresh
# e leia o `runs_using` dela no lock. Só node24 entra aqui. Docker ou composite:
# mova o job para fora do fecho, ou troque a action por script inline (padrão do
# #1161: `gh` CLI em vez de action).

actions:
  - actions/checkout
  - actions/setup-python
  - actions/cache
  - actions/upload-artifact
  - actions/setup-node
  - actions/github-script
  - actions/labeler
  - actions/setup-go
  - gitleaks/gitleaks-action
  - tj-actions/changed-files
  - astral-sh/setup-uv
  - golangci/golangci-lint-action
  - amannn/action-semantic-pull-request

# Fecho de jobs required — não é o mesmo que "todo job do workflow". A
# Repository Ruleset `main-protection` exige dois status checks: "All checks
# green" (job `all-green` de ci.yml + o fecho do `needs:` dele) e "Title
# (Conventional Commits)" (job `title-lint` de pr-quality.yml). Job fora
# desta lista pode usar action Docker livremente — não é required.
# A lista é conferida contra o fecho real de `needs:` do agregador
# (`check_closure_declared`): `frontend-visual` e `frontend-print-visual`
# entraram no `all-green` em 2026-08-12 e ficaram fora daqui até 2026-10-08 —
# o gate não conferia as actions deles e passava calado.
required_jobs:
  ci.yml:
    - changes
    - lint-all
    - pipeline-tests
    - backend-tests
    - migrations-postgres
    - frontend-checks
    - frontend-ops-checks
    - frontend-visual
    - frontend-print-visual
    - go-lint
    - go-test
    - all-green
  pr-quality.yml:
    - title-lint
