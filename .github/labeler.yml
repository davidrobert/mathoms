# Auto-label de PR por path. Consumido por .github/workflows/pr-quality.yml
# (job `auto-label`) via actions/labeler@v5.
#
# Sintaxe v5: cada label tem uma lista de matchers. Cada matcher é um
# objeto `changed-files` com `any-glob-to-any-file` (ANY arquivo bate)
# ou `all-globs-to-all-files` (TODOS os arquivos batem).
#
# Glob negativo (`!…`) NÃO vale sob chave `any-*` — ali ele é só mais um
# padrão, e todo arquivo que não seja o excluído já satisfaz o "any".
# Exclusão vive em `all-globs-to-all-files`. Gate: dev/check_labeler_config.py.
#
# `**` só cruza `/` quando é o segmento INTEIRO. `config/**.yaml` compila para
# `config/[^/]*\.yaml` e ignora `config/prompts/*.yaml`; a forma que desce em
# subpasta é `config/**/*.yaml`. Idem `**/*.go` (não `**.go`, que casava 0
# arquivo no minimatch do labeler — medido 2026-08-03). Mesmo gate.
#
# Glob que aponta para um SHIM não é detectável por gate — o arquivo existe e
# é rastreado, mas o conteúdo migrou. Ao mover conteúdo canônico de lugar,
# revise este arquivo: `area:adr` ficou ~3 meses casando só docs/DECISIONS.md
# (shim pós-ADR-182) enquanto as 352 ADRs viviam em docs/adr/.
#
# Manter alinhado com a matriz `changes` em ci.yml para coerência.

'area:backend':
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/**'
          - 'requirements.in'
          - 'requirements.lock'

'area:frontend':
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**'

'area:pipeline':
  - changed-files:
      - any-glob-to-any-file:
          - 'pipeline/**'
          - 'scripts/**'
          - 'tests/**'
          - 'config/**/*.json'
          - 'config/**/*.yaml'
          - 'config/**/*.yml'
          - 'config/schemas/**'

# Não reintroduza `!**/CHANGELOG.md` aqui: sob `any-glob-to-any-file` o
# negativo é avaliado como padrão próprio, e QUALQUER arquivo que não seja
# um CHANGELOG.md satisfaz o "any" — a label casava em todo PR (medido
# 2026-08-03: #1161 tocou só .github/workflows/pr-quality.yml e recebeu
# `area:docs`). Gate: dev/check_labeler_config.py. A exclusão também já era
# inerte de intenção: pós-ADR-182/F5 o churn de changelog vive em
# docs/sprint/<X>/changelog/CHG-*.md, e docs/CHANGELOG.md é shim (último
# toque 2026-05-16) coberto de propósito por 'docs/**'.
'area:docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'

'area:db':
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/alembic/**'
          - 'backend/app/models/**'

'area:ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.pre-commit-config.yaml'
          - 'dev/**'

'area:design-system':
  - changed-files:
      - any-glob-to-any-file:
          - 'design-tokens/**'
          - 'config/report_layout.yaml'
          - 'frontend/src/styles/**'

# docs/adr/** é onde as ADRs vivem desde a F2 do DOC_REORG ([[ADR-182]]).
# docs/DECISIONS.md fica só pelo caso raro de editar o shim de âncoras.
'area:adr':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/adr/**'
          - 'docs/DECISIONS.md'

'area:go':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.go'
          - 'go.work'
          - 'go.work.sum'
          - 'services/**'
          - '.golangci.yml'

'area:tests':
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
          - 'backend/tests/**'
          - 'frontend/tests/**'

# `sync-labels: true` (pr-quality.yml) remove toda label DECLARADA aqui que não
# case com o PR, inclusive a que o Dependabot aplicou via `labels:`. Só por path,
# `dependency` saía dos PRs de workflow, Docker e frontend-ops (5 de 10 abertos
# em 2026-10-09). O `head-branch` entra no mesmo `any` que o `changed-files`
# (OR) e mantém a label em todo PR do Dependabot.
# Nenhum workflow lê `dependency` hoje. Auto-merge futuro por esta label pegaria
# bump de Docker, que a ADR-249 deixa só para review manual.
dependency:
  - changed-files:
      - any-glob-to-any-file:
          - 'requirements.in'
          - 'requirements.lock'
          - 'backend/requirements.in'
          - 'frontend/package.json'
          - 'frontend/package-lock.json'
          - 'go.work'
          - 'go.work.sum'
  - head-branch: ['^dependabot/']

# Isenção do stale.yml (`exempt-pr-labels`): o actions/stale não filtra por
# autor, e fechar PR do Dependabot vira ignore da release. A label existe só por
# branch, nunca por path. Se viesse por path, PR humano que mexe em manifest
# ficaria isento para sempre. Fonte única: o labeler (não o `labels:` do
# dependabot.yml). Gate: tests/dev/test_stale_dependabot_exemption.py.
dependabot:
  - head-branch: ['^dependabot/']
