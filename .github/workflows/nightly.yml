# Nightly CI — checks que não bloqueiam merge mas precisam rodar regularmente.
#
# Tirado de `ci.yml` para reduzir custo de Actions em PR-time. Roda diário às
# 06:00 UTC (03:00 BRT) e on-demand via workflow_dispatch ou labels.
#
# Jobs aqui:
# - main-smoke: safety net diário pós-remoção do trigger `push: main` do
#   ci.yml (ADR-210 §camada 2). Re-roda lint+pipeline+backend+frontend
#   contra HEAD de main para pegar drift cross-cutting que tenha
#   escapado pelo gate de PR. Janela máx de detecção ~24h.
# - frontend-lighthouse: perf/a11y/best-practices/SEO contra build production.
#   Métrica de qualidade, não correctness — regressão detectada em até 24h é OK.
#   Opt-in PR via label `lighthouse`.
# - frontend-e2e-cross-browser: Playwright em Firefox + WebKit (Chromium roda
#   no PR via ci.yml). Regressões cross-browser são raras; cobertura diária
#   pega antes de release.
#   Opt-in PR via label `cross-browser`.
# - frontend-visual-full: snapshots Playwright em modo full (light+dark+
#   todas seções). Movido de PR-time auto-trigger para nightly (ADR-210
#   follow-up) porque o custo era ~$4/mês × frequência alta de PRs que
#   tocam relatório. Em PR-time agora roda APENAS com label `visual` —
#   regressões visuais escaparem para main é OK aqui se o nightly pegar
#   em ≤24h (single-dev project; release não vai para prod sem nightly
#   verde). Se a label estiver presente no PR, ci.yml cobre.

name: Nightly

on:
  schedule:
    # Cron 1: main-smoke diário às 05:30 UTC (= 02:30 BRT). Safety net
    # após remoção do `push: main` em ci.yml (ADR-210 §camada 2). 30 min
    # antes do bloco pesado para escalonar carga do runner pool.
    - cron: "30 5 * * *"
    # Cron 2: jobs pesados (lighthouse, cross-browser, visual) seg/qua/sex
    # 06:00 UTC = 03:00 BRT. Cache do GH quente do main-smoke logo antes.
    # Frequência 3×/sem (em vez de daily) corta ~57% das execuções pesadas
    # sem comprometer detecção: regressão visual/perf cabe em janela de
    # 2-3 dias. Gates por `github.event.schedule` abaixo em cada job.
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-smoke:
    # Safety net diário após remoção do trigger `push: main` de ci.yml
    # (ADR-210 §camada 2, 2026-05-19). Re-roda os 4 gates de PR contra
    # HEAD de main para pegar drift cross-cutting que tenha escapado do
    # gate de PR (ex.: race de merge sequencial, hook dependency rot,
    # secret rotacionado fora do CI).
    #
    # Consolidado em 1 job (vs. 4 jobs paralelos) para reduzir overhead
    # de runner setup — total wall-clock ~10 min, mas só roda 1×/dia,
    # off-hours, sem humano esperando. Falha abre Issue auto-mergeável.
    #
    # Dispara via:
    # - schedule cron `30 5 * * *` (diário 05:30 UTC = 02:30 BRT)
    # - workflow_dispatch (debug manual)
    # - label `main-smoke` em PR (escape hatch p/ testar a config)
    name: Main smoke (safety net pós push-trigger removido)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '30 5 * * *') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'main-smoke')
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv (SHA-pinned v8.1.0)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.x"

      - name: Restore venv cache
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          # Mesma key dos jobs de ci.yml — reusa cache populado pelo
          # último PR mergeado. Hit típico em main-smoke noturno.
          key: venv-${{ runner.os }}-py313-${{ hashFiles('requirements.in', 'backend/requirements.in') }}-v3
          restore-keys: |
            venv-${{ runner.os }}-py313-

      - name: Install Python deps (cache miss, via uv)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          [ -d .venv ] || uv venv .venv
          uv pip install -r requirements.in -r backend/requirements.in
          uv pip install reportlab pytest pytest-asyncio pytest-cov pytest-xdist fakeredis
          uv pip install --system pre-commit ruff==0.6.0 jsonschema pyyaml

      - name: Activate venv (PATH)
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Restore pre-commit cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py313-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py313-

      - name: Lint gate (pre-commit + style + PII + tenancy)
        run: |
          pre-commit run --all-files
          python3 dev/check_code_style_regression.py
          python tests/utils/lint_no_real_pii.py --verbose
          python scripts/lint/check_workspace_scoping.py --verbose
          python -m pytest scripts/lint/test_check_workspace_scoping.py -q

      - name: Pipeline tests
        run: |
          pytest tests/ -q --tb=short
          MATHOMS_PIPELINE_SCHEMA_MODE=strict pytest tests/test_schema_validation.py -q --tb=short
          python dev/check_pipeline_boundaries.py --verbose

      - name: Backend tests
        env:
          REDIS_URL: redis://localhost:6379/0
          MATHOMS_USE_DB_ARTIFACTS: "true"
        run: |
          # Smoke = main em estado conhecido; sempre roda suite completa
          # (sem `-m "not migration"` filter) para pegar drift em migration
          # one-shot, schema model↔DB e seed.
          pytest backend/tests/ -q --tb=short -n auto --dist loadgroup

      - name: Frontend ESLint + Vitest
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --reporter=default

      - name: Open issue on smoke failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            // Procura issue aberta com label `main-smoke-fail` p/ evitar dupes.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'main-smoke-fail',
              per_page: 5,
            });
            if (existing.data.length > 0) {
              core.notice(`Issue main-smoke-fail já aberta: #${existing.data[0].number}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[main-smoke] Drift detectado em main — ${today}`,
              body: [
                `**Main smoke noturno falhou.** Algum gate quebrou em \`main\` após o último merge verde.`,
                ``,
                `Run: ${runUrl}`,
                ``,
                `## Possíveis causas`,
                `1. Race de merge sequencial entre 2 PRs (cobertura era exatamente esse caso)`,
                `2. Hook ou dependência externa rotou (LLM API, redis, fonte de schema)`,
                `3. Drift de codegen (\`design-tokens\`, \`report-layout\`) não detectado em PR`,
                ``,
                `## Próximos passos`,
                `1. Identifique o step que falhou no log do run.`,
                `2. Reproduza local em \`main\`: \`git checkout main && git pull && <comando que falhou>\`.`,
                `3. Abra PR de fix labelado \`hotfix\` para destravar o gate.`,
                ``,
                `Política: [ADR-210](../docs/adr/210-saude-do-test-suite-do-ci.md) §camada 2.`,
              ].join('\n'),
              labels: ['main-smoke-fail', 'ops'],
            });

  frontend-lighthouse:
    name: Frontend Lighthouse (relatório nativo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR opt-in via label `lighthouse`; dispatch sempre roda.
    # Schedule: apenas no cron pesado 3×/sem (06:00 UTC) — NÃO no main-smoke
    # diário (05:30 UTC), que é safety net leve.
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,3,5') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'lighthouse')
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome (lhci usa chrome-launcher)
        # ubuntu-24.04 (novo default de ubuntu-latest) não traz mais Chrome
        # pré-instalado. @lhci/cli 0.14 → chrome-launcher só probes caminhos
        # canônicos (/usr/bin/google-chrome, /opt/google/chrome/chrome).
        # `browser-actions/setup-chrome` instala em /opt/hostedtoolcache, fora
        # desses paths — exporta `chrome-path` que injetamos como CHROME_PATH
        # no step LHCI (env honrada por chrome-launcher).
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: false

      - name: Build Next (production preset)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Start Next
        run: |
          npm run start -- -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000 > /dev/null; then echo "next up"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000 > /dev/null || (tail -50 /tmp/next.log && exit 1)

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/
          retention-days: 7

  frontend-e2e-cross-browser:
    name: Frontend E2E cross-browser (Firefox + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR opt-in via label `cross-browser`; dispatch sempre roda.
    # Schedule: apenas no cron pesado 3×/sem (06:00 UTC) — NÃO no main-smoke
    # diário (05:30 UTC).
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,3,5') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'cross-browser')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fin_test
          POSTGRES_PASSWORD: fin_test
          POSTGRES_DB: fin_test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          pip install -r requirements.in -r backend/requirements.in
          pip install asyncpg reportlab

      - name: Run alembic migrations
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
        run: |
          cd backend && alembic upgrade head

      - name: Start backend (uvicorn + celery worker)
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
          MATHOMS_REDIS_URL: redis://localhost:6380/0
          MATHOMS_LLM_MOCK: "1"
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          celery -A backend.app.worker worker --loglevel=INFO --concurrency=2 \
            > /tmp/celery.log 2>&1 &
          sleep 5
          curl -sf http://127.0.0.1:8000/health \
            || (echo "backend não subiu" && tail -50 /tmp/uvicorn.log && exit 1)

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Cache Playwright Firefox + WebKit
        # Cache key dedicado (3 browsers reduzido para 2 em nightly: Chromium
        # já é exercitado pelo ci.yml E2E gate; aqui só Firefox + WebKit).
        id: pw-cache-cb
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-webkit-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw-cache-cb.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps firefox webkit

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache-cb.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps firefox webkit

      - name: Run Playwright E2E (Firefox + WebKit)
        env:
          PW_CROSS_BROWSER: "1"
          MATHOMS_LLM_MOCK: "1"
        run: |
          cd frontend
          npm run test:e2e -- --project=firefox --project=webkit

      - name: Upload backend + celery logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-backend-logs
          path: |
            /tmp/uvicorn.log
            /tmp/celery.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright report (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-playwright-report
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
          retention-days: 7

  frontend-visual-full:
    # Scan completo de snapshots visuais — light+dark, todas as seções.
    # Movido de PR-time (auto-trigger por `report` path filter) para nightly
    # em ADR-210 §camada 1: o gate em PR custava ~3.5 min × frequência alta
    # de PRs que tocam relatório. Em PR, label `visual` reativa via ci.yml.
    name: Frontend visual snapshots — scan completo (light+dark)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR opt-in via label `visual-full`; dispatch sempre roda.
    # Schedule: apenas no cron pesado 3×/sem (06:00 UTC) — NÃO no main-smoke
    # diário (05:30 UTC).
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,3,5') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'visual-full')
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Cache Playwright Chromium
        id: pw-cache-visual-night
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache-visual-night.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache-visual-night.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright visual project (full)
        env:
          PW_VISUAL: "1"
        # Grep `sections\.` cobre snapshots + smoke (mesmo que ci.yml usa).
        # Em nightly não rodamos --update-snapshots — baselines só mudam
        # via dispatch deliberado no ci.yml workflow.
        run: npm run test:e2e -- --project=visual --grep "sections\."

      - name: Upload visual diffs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-visual-diffs
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
          retention-days: 14

      - name: Open issue on failure (regressão visual escapou para main)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[Nightly visual] Regressão visual em \`main\` — ${new Date().toISOString().slice(0,10)}`;
            // Procura issue aberta com mesma label para evitar dupes
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'visual-regression',
              per_page: 5,
            });
            if (existing.data.length > 0) {
              core.notice(`Issue de regressão visual já aberta: #${existing.data[0].number}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `**Nightly visual diff falhou em \`main\`.**`,
                ``,
                `Run: ${runUrl}`,
                `Artifact: \`nightly-visual-diffs\` (14 dias).`,
                ``,
                `**Próximos passos:**`,
                `1. Baixe o artifact e abra o diff PNG.`,
                `2. Se for regressão real → fix com PR labeled \`visual\`.`,
                `3. Se for mudança de design intencional → \`gh workflow run CI -f run_visual=true -f update_visual_baselines=true\` para refazer baseline.`,
                ``,
                `Política: ADR-210 §camada 1 (visual em nightly + label \`visual\` no PR).`,
              ].join('\n'),
              labels: ['visual-regression', 'ops'],
            });
