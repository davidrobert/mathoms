# Budget alert — FinOps guard para GH Actions (ADR-210 follow-up).
#
# Roda diariamente. Consome `/users/<owner>/settings/billing/actions` e
# abre/atualiza uma issue de tracking quando o consumo de minutos passa
# de 70% / 85% / 100% do budget mensal definido em vars do repo.
#
# Não bloqueia merges — é early-warning system. A intenção é dar ao owner
# 2 semanas de aviso ANTES de exceder o free tier, tempo suficiente para
# investigar regressão (PR que adicionou job caro, bot pushing demais)
# antes de pagar overage.
#
# Configuração (via gh CLI ou Settings → Variables):
#   - vars.MATHOMS_CI_BUDGET_MIN: budget mensal em minutos (default 2000 = Free tier)
#   - vars.MATHOMS_CI_BUDGET_OWNER: usuário a notificar via @-mention (default = owner do repo)
#
# Permissões:
#   - issues:write (criar/atualizar issue)
#   - actions:read (não usado direto, mas reservado p/ futura inspeção de runs)
#
# Por que CRON 02:00 UTC: GH faz reset do billing no início do mês UTC;
# a leitura matinal pega o snapshot mais recente sem competir com janela
# de uso pesado (PRs durante horário comercial BR).

name: Budget alert

on:
  schedule:
    # Diário às 02:00 UTC (23:00 BRT). Cron único — sem fim-de-semana exception
    # porque agentes/Dependabot rodam 7 dias/sem.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      simulate_pct:
        description: "Simular percentual de uso (0-100; vazio = leitura real)"
        type: string
        required: false

permissions:
  issues: write
  actions: read
  contents: read

concurrency:
  group: budget-alert
  cancel-in-progress: false

jobs:
  check-budget:
    name: "Verifica consumo vs budget mensal"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "Lê billing + abre/atualiza issue"
        uses: actions/github-script@v7
        env:
          BUDGET_MIN: ${{ vars.MATHOMS_CI_BUDGET_MIN || '2000' }}
          BUDGET_OWNER: ${{ vars.MATHOMS_CI_BUDGET_OWNER || github.repository_owner }}
          SIMULATE: ${{ inputs.simulate_pct || '' }}
        with:
          # `GITHUB_TOKEN` não tem escopo `user:read_billing`. Em repo
          # privado, o billing fica no scope do owner — precisaríamos de
          # um PAT em secret p/ ler de fato. Implementação: se a leitura
          # falhar (403), o workflow degrada para usar `--paginate` em
          # /actions/runs e somar duração dos jobs do mês atual.
          script: |
            const fs = require('fs');
            const budgetMin = parseInt(process.env.BUDGET_MIN, 10);
            const simulate = process.env.SIMULATE;
            let usedMin = 0;
            let source = '';

            // Modo simulação (manual dispatch)
            if (simulate) {
              usedMin = Math.round(budgetMin * (parseFloat(simulate) / 100));
              source = `simulated (${simulate}%)`;
            } else {
              // Tenta API de billing primeiro
              try {
                const owner = context.repo.owner;
                const resp = await github.request('GET /users/{username}/settings/billing/actions', {
                  username: owner,
                });
                usedMin = resp.data.total_minutes_used || 0;
                source = 'billing API';
              } catch (e) {
                // Fallback: soma duração dos jobs do mês corrente
                core.warning(`Billing API falhou (${e.status}); fallback para soma de jobs.`);
                const now = new Date();
                const monthStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1));
                const since = monthStart.toISOString();
                const runs = await github.paginate(
                  'GET /repos/{owner}/{repo}/actions/runs',
                  { owner: context.repo.owner, repo: context.repo.repo,
                    per_page: 100, created: `>=${since.slice(0,10)}`, status: 'completed' }
                );
                let totalSec = 0;
                // Limita a 200 runs para não estourar rate limit
                for (const run of runs.slice(0, 200)) {
                  try {
                    const jobsResp = await github.request(
                      'GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs',
                      { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id }
                    );
                    for (const j of (jobsResp.data.jobs || [])) {
                      if (j.started_at && j.completed_at) {
                        const d = (new Date(j.completed_at) - new Date(j.started_at)) / 1000;
                        if (d > 0) totalSec += d;
                      }
                    }
                  } catch (err) { /* ignora job individual com erro */ }
                }
                usedMin = Math.round(totalSec / 60);
                source = `jobs sum (${runs.length} runs, primeiro de cada mês)`;
              }
            }

            const pct = budgetMin > 0 ? (usedMin / budgetMin) * 100 : 0;
            core.notice(`Used: ${usedMin} / ${budgetMin} min (${pct.toFixed(1)}%) — fonte: ${source}`);

            // Threshold de alerta
            let severity = null;
            if (pct >= 100) severity = '🔴 100% — OVERAGE';
            else if (pct >= 85) severity = '🟠 85% — atenção alta';
            else if (pct >= 70) severity = '🟡 70% — atenção';

            if (!severity) {
              core.info(`Abaixo do threshold (70%). Sem ação.`);
              return;
            }

            const title = `[CI budget] ${severity} — ${pct.toFixed(0)}% do orçamento mensal`;
            const body = [
              `**Consumo atual:** ${usedMin} / ${budgetMin} min (${pct.toFixed(1)}%)`,
              `**Fonte:** ${source}`,
              `**Data da medição:** ${new Date().toISOString()}`,
              ``,
              `## Trigger`,
              `Workflow [\`budget-alert\`](.github/workflows/budget-alert.yml) detectou que o consumo de`,
              `minutos do GH Actions ultrapassou ${severity.match(/(\d+)%/)[1]}% do budget mensal.`,
              ``,
              `## Próximos passos`,
              `1. Verifique [Insights → Actions usage](https://github.com/${context.repo.owner}/${context.repo.repo}/settings/billing) para detalhar.`,
              `2. Investigue runs recentes — [actions](https://github.com/${context.repo.owner}/${context.repo.repo}/actions) — procure jobs novos/lentos.`,
              `3. Considere voltar para opt-in tags pesadas (\`visual\`, \`e2e\`, \`lighthouse\`).`,
              `4. Política em [ADR-210](docs/adr/210-saude-do-test-suite-do-ci.md).`,
              ``,
              `cc @${process.env.BUDGET_OWNER}`,
            ].join('\n');

            // Procura issue aberta com o mesmo prefixo de título
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-budget',
              per_page: 5,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title,
                body,
              });
              core.notice(`Atualizada issue existente #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-budget', 'ops'],
              });
              core.notice(`Issue criada #${created.data.number}`);
            }
