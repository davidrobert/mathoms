# Stale bot — fecha PR/issue abandonado.
#
# PR sem atividade >14d → label `stale`, comentário avisando.
# PR ainda parado +7d → fechado (re-abrir é trivial).
# Issue sem atividade >60d → label `stale`. Issue stale +14d → fechada.
#
# Excluir labels que indicam pausa intencional: blocked, pinned. PR do
# Dependabot fica fora pela label `dependabot` (ver `exempt-pr-labels`).

name: Stale

on:
  schedule:
    # 06:30 UTC = 03:30 BRT diário. Após o nightly.yml (06:00 UTC) para
    # não sobrepor execução.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      # Dispatch nasce sem efeito: só loga o que faria. A v11 nem grava o cache
      # `_state` em debug ("The state is not persisted in the debug mode", run
      # 37929689938). `-f debug-only=false` age sobre PRs e issues reais, igual
      # ao run agendado.
      debug-only:
        description: "Só loga o que faria (false = marca e fecha de verdade)"
        type: boolean
        default: true

# A34.l13 (ADR-320): default read; marcação/fechamento vive no job.
permissions:
  contents: read

jobs:
  stale:
    name: Mark/close stale PRs and issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull-requests/issues: write — marca e fecha PRs/issues stale.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ----- PRs -----
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: |
            Este PR não tem atividade há 14 dias. Para mantê-lo aberto:
            - Faça push de novos commits, **ou**
            - Comente explicando o bloqueio (e considere o label `blocked`).

            Caso contrário, será fechado em 7 dias. Re-abrir depois é simples.
          close-pr-message: |
            Fechado por inatividade. Re-abra quando quiser retomar — comentários
            e diff ficam preservados.
          # `dependabot`: fechar PR do Dependabot vira ignore implícito da
          # release ("OK, I won't notify you again" — #2006–#2015, 2026-09-29).
          # O actions/stale não filtra por autor; a label é o proxy, e o
          # labeler a aplica por `head-branch`, então o sync-labels nunca a tira.
          exempt-pr-labels: "blocked,pinned,security,dependabot"

          # ----- Issues -----
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: |
            Esta issue não tem atividade há 60 dias. Será fechada em 14 dias se
            não houver novos comentários. Adicione `pinned` para evitar.
          close-issue-message: |
            Fechada por inatividade. Re-abra ou crie issue nova se ainda for relevante.
          exempt-issue-labels: "blocked,pinned,security,tech-debt"

          # `schedule` não tem `inputs` → false; o dispatch liga por default.
          debug-only: ${{ inputs.debug-only == true }}

          # Limita # de operações por run (rate-limit safety).
          operations-per-run: 60

      # Checkout condicional: o script do canal vive no repo, mas este job não
      # precisa da árvore no caminho feliz — pagar ~2s em todo run agendado
      # para cobrir o run que falha seria custo sem contrapartida.
      - uses: actions/checkout@v7
        if: failure()

      # Canal de falha do compensador (ADR-210 §camada 4, KR-F do PLAN-ci-trust).
      # O `S2` do watchdog mede run INICIADO, não bem-sucedido: sem este step,
      # um compensador que inicia e falha todo run é invisível.
      # LIMITE declarado: `if: failure()` só dispara se um step ANTERIOR deste
      # job falhou — job que nao recebe runner (budget, outage) nao passa por
      # aqui, e essa classe continua coberta so pelo `S2`.
      - name: Canal de falha — registra em Issue rotulada
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 dev/ci_report_workflow_failure.py \
            --workflow stale.yml --label ops-hygiene
