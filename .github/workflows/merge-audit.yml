# Auditoria da proteção de main (ADR-415)
#
# Por que existe: entre 2026-08-05 e 08-25, 64 merges (16% dos pushes em
# `main`) entraram por bypass do Ruleset e NENHUM deixou registro. O backfill
# mediu 53 deles sem gate — 46 com o required check concluindo DEPOIS do
# merge e 7 com ele VERMELHO, incluindo o #1508, que quebrou a main.
#
# O que ele mede: o veredito do required check NO MOMENTO DO MERGE, para o
# SHA que entrou. Verde que chega depois não protegeu nada — ler só
# `conclusion` diria "ok" em 46 dos 53 casos.
#
# Por que não é um step em workflow existente: a auditoria precisa rodar
# justamente nos dias em que a infra falha, e acoplá-la ao trem
# (`auto-update-prs`, único outro workflow em `push: main`) a mataria junto
# com ele — o 403 do PAT o derrubou 10× em ~5h em 2026-08-17. O custo é ~10s
# por merge e Actions em repo público não fatura (ADR-210 §Emenda 2026-08-25).
#
# Ressalva declarada: ler `rulesets/rule-suites` exige permissão de
# administração, que o `GITHUB_TOKEN` não tem. O braço de enriquecimento
# (quem deu o bypass) degrada com a lacuna DITA na issue; o veredito do SHA,
# que é o instrumento primário, não depende dele.
#
# Registro (ADR-448): cada SHA fora do gate abre UMA issue própria, com o SHA
# curto e o PR no título e um marcador do SHA completo no corpo, que torna o
# re-run idempotente. A issue única (#1728) acumulou 56 comentários e ninguém
# reagiu — formato encerrado na aplicação da ADR-448.

# SEM `schedule:` de propósito, nesta primeira versão. O gate de liveness
# exige que todo workflow agendado esteja no manifesto (S0) E que o Actions já
# conheça o arquivo (S1) — e o Actions só o conhece depois do merge, então um
# PR que nasça agendado não consegue mergear a si mesmo. É o mesmo bootstrap
# que a ADR-210 §Adendo 2026-08-21b registrou para a entrada `ops-watchdog`.
# O braço `push: main` cobre todos os merges; o sweep agendado (retenção curta
# da API + `rulesets/{id}/history`) entra na leva da Onda 1, com o arquivo já
# em `main`. Rodável à mão enquanto isso: `--sweep --period month`.
name: Merge audit

on:
  push:
    branches: [main]
  # ⚠️ O braço de sweep NÃO funciona com o `github.token`: `rule-suites`, o
  # `history` do ruleset e o campo `bypass_actors` exigem `Administration:
  # read`, permissão que não existe na chave `permissions:` do Actions.
  # Disparado assim, ele aborta com rc=2 ("não medido") — que é o
  # comportamento correto, e não um bug. Ele passa a valer quando a Onda 1
  # trouxer um token de admin (PR 4 do track `ci-trust-onda1-workflows`).
  workflow_dispatch:
    inputs:
      period:
        description: "Janela do índice de bypass (day|week|month)"
        default: week

permissions:
  contents: read

concurrency:
  # Não cancela: cada merge é um SHA distinto a auditar, e cancelar o
  # anterior perderia o veredito dele para sempre.
  group: merge-audit-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: SHA mergeado foi gateado?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # commits/{sha}/pulls
      checks: read # commits/{sha}/check-runs
      pull-requests: read # PR do SHA
      issues: write # issue por incidente
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # A label é PRÉ-REQUISITO do detector, não decoração: `gh issue create
      # --label X` aborta com "could not add label: 'X' not found" e o gh não
      # a cria sozinho. Como o caminho de escrita só é alcançado quando há
      # merge sem gate, a ausência ficaria latente por semanas e explodiria
      # exatamente no primeiro incidente — foi o que aconteceu no run
      # 32887693308. `--force` torna o step idempotente.
      - name: Garantir a label da auditoria
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create merge-protection --force \
            --description "Proteção de main: merge fora do gate ou ruleset fora da ADR-448" \
            --color B60205

      - name: Auditar o SHA que entrou em main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev/ci_audit_merge_protection.py --sha "${{ github.sha }}"

      - name: Sweep de bypasses do período
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 dev/ci_audit_merge_protection.py --sweep \
            --period "${{ inputs.period || 'week' }}"

  # Tripwire do ruleset (ADR-448), sem admin. O `GITHUB_TOKEN` não vê
  # `bypass_actors` (a API OMITE a chave para quem não administra — ler a
  # ausência como `0` seria o alarme mudo), mas vê `enforcement`, `rules` e
  # `updated_at`: gate enfraquecido vira alarme vivo, e mudança nova
  # (concessão de break-glass, toggle de enforcement, que não deixa
  # rule-suite) vira issue a explicar com o `--sweep` de admin.
  ruleset:
    name: Ruleset de main de pé?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A chave do tripwire é a MESMA em todo push até o ruleset mudar: dois
    # merges seguidos, em paralelo, abririam a mesma issue duas vezes. Fila
    # global; o pendente que for cancelado não leva nada — o próximo run lê o
    # mesmo estado.
    concurrency:
      group: merge-audit-ruleset
      cancel-in-progress: false
    permissions:
      contents: read # GET rulesets/{id}
      issues: write # issue de alarme
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Garantir a label da auditoria
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create merge-protection --force \
            --description "Proteção de main: merge fora do gate ou ruleset fora da ADR-448" \
            --color B60205

      - name: Tripwire do ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev/ci_audit_merge_protection.py --ruleset
