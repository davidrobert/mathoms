# F6.5C.11 — GH Actions CI
#
# Pipeline de validação que roda em cada PR + push para main:
# 1. Lint + format checks
# 2. Pipeline tests (pytest em tests/)
# 3. Backend tests (pytest em backend/tests/) com SQLite in-memory
# 4. Frontend unit + integration tests (Vitest)
# 5. Lint anti-PII (tests/utils/lint_no_real_pii.py)
# 6. Alembic guardrails (drift + idempotency)
# 7. Frontend E2E (Playwright) contra backend REAL subido via services
#    — apenas sob demanda: PR com label `e2e` OU workflow_dispatch manual
#    (não roda automaticamente em push para main)
#
# Gates de merge:
# - Lint green
# - Pipeline + backend + frontend tests green
# - PII lint green
# - Alembic guardrails green
# - E2E green (quando rodar)
#
# F7C estende para: Docker CVE scan, coverage ≥85%, deploy automático
#
# P1 (motor canônico): após pipeline-tests — schema strict + boundaries em pipeline/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Rodar Frontend E2E (Playwright)"
        type: boolean
        default: true
      run_visual:
        description: "Rodar Visual snapshots (lento, baselines OS-específicas)"
        type: boolean
        default: false
      update_visual_baselines:
        description: "Re-gerar baselines visuais (--update-snapshots; só com run_visual=true)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MATHOMS_FERNET_KEY: "NwHpLJlLGSeC7NIS6gfVdVSYh_pObKqY4G_CwkQ1kuA="
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Detecta o que mudou para condicionar jobs subsequentes. PRs docs-only
  # rodam só `changes` + `all-green` (no-op). PRs backend-only não disparam
  # frontend-* e Lighthouse; PRs frontend-only não disparam pipeline/backend
  # tests. CLAUDE.md §"Concluído" linha 64–68 declara docs-only fora do gate.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      any_code: ${{ steps.filter.outputs.any_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Mudança no próprio workflow → roda tudo (sanity contra
          # regressão na config de filtros).
          filters: |
            backend:
              - 'backend/**'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'design-tokens/**'
              - 'config/report_layout.yaml'
              - '.github/workflows/ci.yml'
            pipeline:
              - 'pipeline/**'
              - 'scripts/**'
              - 'tests/**'
              - 'config/**'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'
            any_code:
              - '!docs/**'
              - '!**.md'
              - '!.claude/**'
              - '!_archive/**'
              - '!_scratch/**'

  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

  ruff:
    # Gate dedicado de ruff check (A6g.6 slice 1, ADR-114). Redundante com
    # o job `lint` (via pre-commit hook), mas dá feedback explícito se ruff
    # quebra sem depender da matrix de pre-commit. ruff-format fica fora —
    # sweep dedicado em A6g.6b.
    name: Ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.6.0
      - name: Ruff check
        run: ruff check .

  code-style-regression:
    # A6g.6 slice 5, ADR-114: compara audit atual com baseline; falha se
    # qualquer categoria piorar (legado decresce, nunca cresce).
    name: Code style baseline regression
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check regression vs baseline
        run: python3 dev/check_code_style_regression.py

  lint-pii:
    name: Lint anti-PII em fixtures (F6.5D.7)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run PII lint
        run: python tests/utils/lint_no_real_pii.py --verbose

  tenancy-lint:
    name: Tenancy scoping lint (ADR-072)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest for lint tests
        run: pip install pytest
      - name: Run lint on services + api
        run: python scripts/lint/check_workspace_scoping.py --verbose
      - name: Run lint unit tests
        run: python -m pytest scripts/lint/test_check_workspace_scoping.py -q

  pipeline-tests:
    name: Pipeline tests (tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # `pipeline` cobre mudança em tests/, scripts/, pipeline/, config/.
    # backend/ também porque importa pipeline/** e tem guardrail próprio.
    if: needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install reportlab pytest pytest-asyncio pytest-cov fakeredis

      - name: Run pipeline tests
        run: pytest tests/ -q --tb=short

      - name: Pipeline JSON schema strict (MATHOMS_PIPELINE_SCHEMA_MODE)
        env:
          MATHOMS_PIPELINE_SCHEMA_MODE: strict
        run: pytest tests/test_schema_validation.py -q --tb=short

      - name: Pipeline package import boundaries (P1)
        run: python dev/check_pipeline_boundaries.py --verbose

  backend-tests:
    name: Backend tests (backend/tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # backend/ importa pipeline/**; mudança em pipeline pode quebrar backend.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.pipeline == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install reportlab pytest pytest-asyncio pytest-cov fakeredis

      - name: Run backend tests + alembic guardrails
        env:
          REDIS_URL: redis://localhost:6379/0
          # Default do projeto: USE_DB_ARTIFACTS=true (cutover concluído).
          # Suíte backend roda apenas no caminho-alvo — bloqueia merge se quebrar.
          MATHOMS_USE_DB_ARTIFACTS: "true"
        run: |
          pytest backend/tests/ -q --tb=short

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  frontend-lint:
    # A6g.6 slice 2, ADR-114: gate @typescript-eslint/no-explicit-any +
    # no-unused-vars bloqueantes; max-lines/-per-function progressivos.
    name: Frontend ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  frontend-tests:
    name: Frontend unit + integration (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile=./vitest-results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-results
          path: frontend/vitest-results.xml
          retention-days: 14

  frontend-e2e:
    name: Frontend E2E (Playwright + backend real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Opt-in via label `e2e` ou workflow_dispatch — preserva
    # comportamento prévio. Filtro de área não se aplica (label é gate).
    if: |
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fin_test
          POSTGRES_PASSWORD: fin_test
          POSTGRES_DB: fin_test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          pip install -r requirements.txt -r backend/requirements.txt
          pip install asyncpg reportlab

      - name: Run alembic migrations
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
        run: |
          cd backend && alembic upgrade head

      - name: Start backend (uvicorn + celery worker)
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
          # Pydantic-settings usa env_prefix="MATHOMS_" — `REDIS_URL` puro é
          # ignorado e o default (localhost:6379) cai fora do Redis do CI
          # (exposto em 6380). Celery worker ficava em retry loop eterno.
          MATHOMS_REDIS_URL: redis://localhost:6380/0
          MATHOMS_LLM_MOCK: "1"
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          # Worker Celery consome a fila do PipelineRun. Sem ele a task
          # fica "pending" indefinido (ADR-074 — pipeline assíncrono).
          celery -A backend.app.worker worker --loglevel=INFO --concurrency=2 \
            > /tmp/celery.log 2>&1 &
          sleep 5
          curl -sf http://127.0.0.1:8000/health \
            || (echo "backend não subiu" && tail -50 /tmp/uvicorn.log && exit 1)

      - name: Install frontend deps + Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E (cross-browser em fluxos @critical)
        env:
          PW_CROSS_BROWSER: "1"
          # F6.5F.11 (ADR-070): mock LLM em CI default; PW_REAL_LLM=1 no nightly
          MATHOMS_LLM_MOCK: "1"
        run: |
          cd frontend
          # Visual regression project é isolado (baseline OS/font-specific);
          # roda em job dedicado (PW_VISUAL=1), não no gate cross-browser.
          npm run test:e2e -- --project=chromium --project=firefox --project=webkit

      - name: Upload backend + celery logs (diagnóstico E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            /tmp/uvicorn.log
            /tmp/celery.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report + trace + vídeo (F6.5F.9)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
          retention-days: 30

      - name: Comment PR com link do report (F6.5F.9)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### E2E Report\n\n` +
              `Status: ${{ job.status }}\n` +
              `[📊 Ver report + vídeo + trace](${artifactUrl})\n\n` +
              `Artifacts retidos por 30 dias.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  frontend-lighthouse:
    # Lane report-a11y-finalize item 4 — D2: PR-time, fixture medium,
    # 3 runs, gate perf 0.85 / a11y 0.95 / bp 0.95 / seo 0.90 (warn).
    # Não depende de backend — `tests/lighthouse/lighthouse-mock.cjs`
    # injeta token + intercepta /api/v1/** com fixture sintética.
    name: Frontend Lighthouse (relatório nativo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome (lhci usa chrome-launcher)
        # ubuntu-24.04 (novo default de ubuntu-latest) não traz mais Chrome
        # pré-instalado. @lhci/cli 0.14 → chrome-launcher só probes caminhos
        # canônicos (/usr/bin/google-chrome, /opt/google/chrome/chrome).
        # `browser-actions/setup-chrome` instala em /opt/hostedtoolcache, fora
        # desses paths — exporta `chrome-path` que injetamos como CHROME_PATH
        # no step LHCI (env honrada por chrome-launcher).
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: false

      - name: Build Next (production preset)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Start Next
        run: |
          npm run start -- -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000 > /dev/null; then echo "next up"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000 > /dev/null || (tail -50 /tmp/next.log && exit 1)

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/
          retention-days: 30

  frontend-visual:
    # Lane report-a11y-finalize item 3 — snapshots por seção (light+dark),
    # ~50 baselines no projeto `visual` do Playwright. Opt-in via label
    # `visual` ou workflow_dispatch (lento + baselines OS-específicas).
    # Decisão D3: spec mobile fica fora desta lane (lane futura).
    name: Frontend visual snapshots (relatório nativo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # Opt-in via label `visual` ou workflow_dispatch — preserva
    # comportamento prévio. Filtro de área não se aplica (label é gate).
    if: |
      contains(github.event.pull_request.labels.*.name, 'visual') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_visual)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps + Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright visual project
        env:
          PW_VISUAL: "1"
          # `mock-report.ts` cobre /api/v1/** sem precisar de backend real;
          # webServer ainda precisa subir Next em :3000 (default do Playwright).
          UPDATE_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines && '--update-snapshots' || '' }}
        run: npm run test:e2e -- --project=visual --grep sections.snapshots $UPDATE_FLAG

      - name: Upload generated baselines (quando --update-snapshots foi passado)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: report-visual-baselines-generated
          path: frontend/tests/e2e/reports/__snapshots__/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload visual diffs + baselines (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-visual-snapshots
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
            frontend/tests/e2e/reports/__snapshots__/
          retention-days: 30

  all-green:
    # Meta-job: aceita success OU skipped (paths-filter pula jobs por área).
    # Falha apenas se algum job upstream falhou ou foi cancelado.
    # Único required check candidato — demais ficam informativos.
    name: All checks green
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - ruff
      - code-style-regression
      - lint-pii
      - tenancy-lint
      - pipeline-tests
      - backend-tests
      - frontend-lint
      - frontend-tests
      - frontend-lighthouse
    if: always()
    steps:
      - name: Verify all required jobs passed or were skipped
        run: |
          fail=0
          for job in lint ruff code-style-regression lint-pii tenancy-lint \
                     pipeline-tests backend-tests frontend-lint frontend-tests \
                     frontend-lighthouse; do
            case "$job" in
              lint) result="${{ needs.lint.result }}" ;;
              ruff) result="${{ needs.ruff.result }}" ;;
              code-style-regression) result="${{ needs.code-style-regression.result }}" ;;
              lint-pii) result="${{ needs.lint-pii.result }}" ;;
              tenancy-lint) result="${{ needs.tenancy-lint.result }}" ;;
              pipeline-tests) result="${{ needs.pipeline-tests.result }}" ;;
              backend-tests) result="${{ needs.backend-tests.result }}" ;;
              frontend-lint) result="${{ needs.frontend-lint.result }}" ;;
              frontend-tests) result="${{ needs.frontend-tests.result }}" ;;
              frontend-lighthouse) result="${{ needs.frontend-lighthouse.result }}" ;;
            esac
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "✗ $job: $result"
              fail=1
            else
              echo "✓ $job: $result"
            fi
          done
          # `changes` job sempre roda — exigir success.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "✗ changes: ${{ needs.changes.result }}"
            fail=1
          fi
          exit $fail
