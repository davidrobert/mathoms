# F6.5C.11 — GH Actions CI
#
# Pipeline de validação que roda em cada PR + push para main:
# 1. lint-all  — pre-commit + ruff + style baseline + PII + tenancy (1 job)
# 2. pipeline-tests (pytest em tests/) com venv cache
# 3. backend-tests (pytest em backend/tests/) com Redis service + venv cache
# 4. frontend-lint + frontend-tests (ESLint + Vitest)
# 5. frontend-e2e (Playwright + backend real) — opt-in via label `e2e`
# 6. frontend-visual (Playwright snapshots) — opt-in via label `visual`
#
# Movido para nightly.yml (não bloqueia merge):
# - frontend-lighthouse — perf/a11y/bp/seo é métrica, não correctness.
#   Roda diário 06:00 UTC + workflow_dispatch + label `lighthouse` em PR.
#
# Gates de merge (all-green):
# - lint-all green
# - pipeline-tests + backend-tests + frontend-lint + frontend-tests green
# - E2E/visual green (quando rodam, opt-in)
#
# F7C estende para: Docker CVE scan, coverage ≥85%, deploy automático
#
# P1 (motor canônico): após pipeline-tests — schema strict + boundaries em pipeline/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` substitui o default que dispara em draft. Drafts
    # só rodam CI quando promovidos a "ready". Economiza ~50% dos triggers
    # se você usa drafts (que é o pattern recomendado para WIP em PR).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Rodar Frontend E2E (Playwright)"
        type: boolean
        default: true
      run_visual:
        description: "Rodar Visual snapshots (lento, baselines OS-específicas)"
        type: boolean
        default: false
      update_visual_baselines:
        description: "Re-gerar baselines visuais (--update-snapshots; só com run_visual=true)"
        type: boolean
        default: false
      run_print:
        description: "Rodar PDF visual diff (v2.10; lento, baseline OS-específica)"
        type: boolean
        default: false
      update_print_baseline:
        description: "Re-gerar baseline do PDF visual diff (UPDATE_PRINT_BASELINE=1; só com run_print=true)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MATHOMS_FERNET_KEY: "NwHpLJlLGSeC7NIS6gfVdVSYh_pObKqY4G_CwkQ1kuA="
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Detecta o que mudou para condicionar jobs subsequentes. PRs docs-only
  # rodam só `changes` + `all-green` (no-op). PRs backend-only não disparam
  # frontend-* e Lighthouse; PRs frontend-only não disparam pipeline/backend
  # tests. CLAUDE.md §"Concluído" linha 64–68 declara docs-only fora do gate.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # tj-actions/changed-files SHA-pinned (não tag) por causa do incidente
    # CVE-2025-30066 (mar/2025) que comprometeu tags v1-v45. v47.0.6
    # (abr/2026) é pós-fix e SHA explícito impede tag-rewrite. files_yaml
    # replica o pattern de filter-groups do dorny/paths-filter@v3.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend_any_changed }}
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
      pipeline: ${{ steps.filter.outputs.pipeline_any_changed }}
      any_code: ${{ steps.filter.outputs.any_code_any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed files (SHA-pinned v47.0.6)
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          # Mudança no próprio workflow → roda tudo (sanity contra
          # regressão na config de filtros).
          files_yaml: |
            backend:
              - 'backend/**'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'design-tokens/**'
              - 'config/report_layout.yaml'
              - '.github/workflows/ci.yml'
            pipeline:
              - 'pipeline/**'
              - 'scripts/**'
              - 'tests/**'
              # `config/**` era amplo demais — casava com config/*.md
              # (definitions.md, report_spec.md, etc — docs do produto).
              # Limita aos formatos de runtime config que o pipeline lê.
              - 'config/**.json'
              - 'config/**.yaml'
              - 'config/**.yml'
              - 'config/schemas/**'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'
            any_code:
              - '**'
              - '!docs/**'
              - '!**.md'
              - '!.claude/**'
              - '!_archive/**'
              - '!_scratch/**'

  lint-all:
    # Job consolidado (era 5 jobs separados: lint, ruff, code-style-regression,
    # lint-pii, tenancy-lint). Cada um pagava ~30-60s de boot+checkout+
    # setup-python; juntar reaproveita o setup. Steps independentes — pre-commit
    # cobre ruff via hook, mas o `ruff check` explícito permanece como gate
    # dedicado (A6g.6 slice 1, ADR-114) sem depender da matrix de pre-commit.
    # Fail-fast por step: lint quebra rápido, fixar um por vez é OK.
    name: Lint (pre-commit + ruff + style baseline + PII + tenancy)
    runs-on: ubuntu-latest
    # Tighten 8→4min: observado 44s; 4min dá ~5× buffer e detecta hangs cedo.
    timeout-minutes: 4
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (SHA-pinned v8.1.0)
        # uv é resolver/installer 5-10x mais rápido que pip para deps Python.
        # SHA pin previne tag-rewrite; v8.1.0 é a release mais recente.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.x"

      - name: Install lint deps (via uv)
        run: uv pip install --system pre-commit ruff==0.6.0 pytest

      - name: pre-commit (all files)
        run: pre-commit run --all-files

      - name: ruff check
        run: ruff check .

      - name: code style baseline regression
        run: python3 dev/check_code_style_regression.py

      - name: PII lint (F6.5D.7)
        run: python tests/utils/lint_no_real_pii.py --verbose

      - name: tenancy scoping lint (ADR-072) — services + api
        run: python scripts/lint/check_workspace_scoping.py --verbose

      - name: tenancy scoping lint — unit tests
        run: python -m pytest scripts/lint/test_check_workspace_scoping.py -q

  pipeline-tests:
    name: Pipeline tests (tests/)
    runs-on: ubuntu-latest
    # Tighten 10→5min: observado 54s; 5min dá ~5× buffer.
    timeout-minutes: 5
    needs: changes
    # `pipeline` cobre mudança em tests/, scripts/, pipeline/, config/.
    # backend/ também porque importa pipeline/** e tem guardrail próprio.
    if: needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (SHA-pinned v8.1.0)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.x"

      - name: Restore venv cache
        # Venv cache pula install na hit (ganho ~60-90s). Com uv (instala
        # via prebuilt wheels paralelo), miss também fica ~10-15s. Bumped
        # key v2→v3 porque migrei venv creation de `python -m venv` para
        # `uv venv` (layout diferente em alguns pacotes binários).
        # `restore-keys`: fallback partial-match para reuso quando hash muda.
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py313-${{ hashFiles('requirements.txt', 'backend/requirements.txt') }}-v3
          restore-keys: |
            venv-${{ runner.os }}-py313-

      - name: Install dependencies (cache miss, via uv)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          [ -d .venv ] || uv venv .venv
          uv pip install -r requirements.txt -r backend/requirements.txt
          # pytest-xdist habilita paralelismo (-n auto) em backend-tests.
          uv pip install reportlab pytest pytest-asyncio pytest-cov pytest-xdist fakeredis

      - name: Activate venv (PATH)
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run pipeline tests
        run: pytest tests/ -q --tb=short

      - name: Pipeline JSON schema strict (MATHOMS_PIPELINE_SCHEMA_MODE)
        env:
          MATHOMS_PIPELINE_SCHEMA_MODE: strict
        run: pytest tests/test_schema_validation.py -q --tb=short

      - name: Pipeline package import boundaries (P1)
        run: python dev/check_pipeline_boundaries.py --verbose

  backend-tests:
    name: Backend tests (backend/tests/)
    runs-on: ubuntu-latest
    # Tighten 15→8min: observado 4m04s com xdist; 8min dá ~2× buffer.
    timeout-minutes: 8
    needs: changes
    # backend/ importa pipeline/**; mudança em pipeline pode quebrar backend.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.pipeline == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (SHA-pinned v8.1.0)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.x"

      - name: Restore venv cache
        # Mesmo cache key que pipeline-tests — mesma combinação de
        # requirements.txt + backend/requirements.txt. Ambos jobs compartilham
        # cache; quem executar primeiro popula, o segundo só restaura.
        # restore-keys: fallback partial-match para reuso quando hash muda.
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py313-${{ hashFiles('requirements.txt', 'backend/requirements.txt') }}-v3
          restore-keys: |
            venv-${{ runner.os }}-py313-

      - name: Install dependencies (cache miss, via uv)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          [ -d .venv ] || uv venv .venv
          uv pip install -r requirements.txt -r backend/requirements.txt
          # pytest-xdist habilita paralelismo (-n auto) em backend-tests.
          uv pip install reportlab pytest pytest-asyncio pytest-cov pytest-xdist fakeredis

      - name: Activate venv (PATH)
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run backend tests + alembic guardrails
        env:
          REDIS_URL: redis://localhost:6379/0
          # Default do projeto: USE_DB_ARTIFACTS=true (cutover concluído).
          # Suíte backend roda apenas no caminho-alvo — bloqueia merge se quebrar.
          MATHOMS_USE_DB_ARTIFACTS: "true"
        run: |
          # `-n auto` (pytest-xdist) paraleliza por CPU. SQLite in-memory +
          # recreate-per-test (ver backend/tests/conftest.py) é xdist-safe:
          # cada worker process tem engine próprio. Ganho ~50% (15→7-10min).
          # `--dist loadgroup` mantém tests do mesmo file no mesmo worker —
          # reduz overhead de fixture setup compartilhado dentro de classe.
          pytest backend/tests/ -q --tb=short -n auto --dist loadgroup

      - name: Upload coverage (artifact only on failure)
        # Coverage XML só interessa quando CI quebra — em verde, ninguém
        # baixa. Reduz upload + storage de retention.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  frontend-lint:
    # A6g.6 slice 2, ADR-114: gate @typescript-eslint/no-explicit-any +
    # no-unused-vars bloqueantes; max-lines/-per-function progressivos.
    name: Frontend ESLint
    runs-on: ubuntu-latest
    # Tighten 5→3min: observado 43s; 3min dá ~4× buffer.
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  frontend-tests:
    name: Frontend unit + integration (Vitest)
    runs-on: ubuntu-latest
    # Tighten 10→5min: observado 1m49s pós mock global de react-chartjs-2;
    # 5min dá ~3× buffer. Mock vive em frontend/tests/setup.ts; sem ele
    # suíte hangea (run 24999684508 ficou 22m54s antes do timeout de 25min).
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile=./vitest-results.xml

      - name: Upload results (only on failure)
        # Vitest junit XML só interessa em falha — em verde ninguém baixa.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-results
          path: frontend/vitest-results.xml
          retention-days: 7

  frontend-e2e:
    name: Frontend E2E (Playwright + backend real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Opt-in via label `e2e` ou workflow_dispatch — preserva
    # comportamento prévio. Filtro de área não se aplica (label é gate).
    if: |
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fin_test
          POSTGRES_PASSWORD: fin_test
          POSTGRES_DB: fin_test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          pip install -r requirements.txt -r backend/requirements.txt
          pip install asyncpg reportlab

      - name: Run alembic migrations
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
        run: |
          cd backend && alembic upgrade head

      - name: Start backend (uvicorn + celery worker)
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
          # Pydantic-settings usa env_prefix="MATHOMS_" — `REDIS_URL` puro é
          # ignorado e o default (localhost:6379) cai fora do Redis do CI
          # (exposto em 6380). Celery worker ficava em retry loop eterno.
          MATHOMS_REDIS_URL: redis://localhost:6380/0
          MATHOMS_LLM_MOCK: "1"
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          # Worker Celery consome a fila do PipelineRun. Sem ele a task
          # fica "pending" indefinido (ADR-074 — pipeline assíncrono).
          celery -A backend.app.worker worker --loglevel=INFO --concurrency=2 \
            > /tmp/celery.log 2>&1 &
          sleep 5
          curl -sf http://127.0.0.1:8000/health \
            || (echo "backend não subiu" && tail -50 /tmp/uvicorn.log && exit 1)

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Cache Playwright Chromium
        # Em PR só Chromium é instalado — Firefox/WebKit ficam para o
        # nightly (ver nightly.yml > frontend-e2e-cross-browser). Cache
        # key dedicado evita poluir o cache 3-browsers do nightly.
        id: pw-cache-e2e
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache-e2e.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache-e2e.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E (Chromium em fluxos @critical)
        env:
          # F6.5F.11 (ADR-070): mock LLM em CI default; PW_REAL_LLM=1 no nightly
          MATHOMS_LLM_MOCK: "1"
        run: |
          cd frontend
          # Cross-browser (Firefox + WebKit) movido para nightly.yml.
          # Regressões cross-browser são raras; rodar só Chromium em PR
          # corta ~50% do runtime do gate E2E quando label `e2e` ativo.
          npm run test:e2e -- --project=chromium

      - name: Upload backend + celery logs (diagnóstico E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            /tmp/uvicorn.log
            /tmp/celery.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright report + trace + vídeo (F6.5F.9)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
          retention-days: 7

      - name: Comment PR com link do report (F6.5F.9)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### E2E Report\n\n` +
              `Status: ${{ job.status }}\n` +
              `[📊 Ver report + vídeo + trace](${artifactUrl})\n\n` +
              `Artifacts retidos por 30 dias.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # frontend-lighthouse → movido para .github/workflows/nightly.yml.
  # Métrica de qualidade (perf/a11y/bp/seo), não correctness — não bloqueia
  # merge. Roda diário às 06:00 UTC + on-demand via workflow_dispatch + label
  # `lighthouse` em PR.

  frontend-visual:
    # Lane report-a11y-finalize item 3 — snapshots por seção (light+dark),
    # ~50 baselines no projeto `visual` do Playwright. Opt-in via label
    # `visual` ou workflow_dispatch (lento + baselines OS-específicas).
    # Decisão D3: spec mobile fica fora desta lane (lane futura).
    name: Frontend visual snapshots (relatório nativo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # Opt-in via label `visual` ou workflow_dispatch — preserva
    # comportamento prévio. Filtro de área não se aplica (label é gate).
    if: |
      contains(github.event.pull_request.labels.*.name, 'visual') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_visual)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Cache Playwright Chromium
        id: pw-cache-visual
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Cache key separado de e2e: aqui só Chromium é instalado.
          # Chave compartilhada poluiria (sem Firefox/WebKit faltando) ou
          # forçaria reinstall no e2e.
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache-visual.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache-visual.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright visual project
        env:
          PW_VISUAL: "1"
          # `mock-report.ts` cobre /api/v1/** sem precisar de backend real;
          # webServer ainda precisa subir Next em :3000 (default do Playwright).
          UPDATE_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines && '--update-snapshots' || '' }}
        run: npm run test:e2e -- --project=visual --grep sections.snapshots $UPDATE_FLAG

      - name: Locate generated baselines (debug)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        run: |
          echo "=== PNGs em tests/ que parecem snapshot ==="
          find frontend/tests -name "*.png" 2>/dev/null | head -100
          echo "=== diretórios -snapshots ou __snapshots__ ==="
          find frontend/tests -type d \( -name "*-snapshots" -o -name "__snapshots__" \) 2>/dev/null

      - name: Upload generated baselines (quando --update-snapshots foi passado)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: report-visual-baselines-generated
          path: |
            frontend/tests/e2e/reports/sections.snapshots.visual.spec.ts-snapshots/
            frontend/tests/e2e/reports/sections.snapshots.visual.spec-snapshots/
            frontend/tests/e2e/reports/__snapshots__/
            frontend/tests/**/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload visual diffs + baselines (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-visual-snapshots
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
            frontend/tests/e2e/reports/__snapshots__/
          retention-days: 30

  frontend-print-visual:
    # Lane v2.10 — PDF visual diff em Playwright. Renderiza /reports/[id]?print=1
    # via CDP `Page.printToPDF()`, converte primeira página com
    # `pdf-to-png-converter` e compara contra baseline em
    # `frontend/tests/e2e/reports/__snapshots__/report.print.pdf.png` com
    # tolerância 500px (PDF→PNG é mais barulhento que screenshot DOM).
    #
    # Opt-in via label `print` (PR) ou workflow_dispatch + `run_print=true`.
    # Mock-report cobre /api/v1/** sem precisar de backend real (Next em :3000).
    #
    # Baseline OS-específica (font rendering Chromium difere por OS); rode SÓ
    # em runner Linux (este job). Atualizar baseline:
    #   `gh workflow run CI -f run_print=true -f update_print_baseline=true`
    # depois baixar artefato `report-print-baseline-generated` e commitar
    # o PNG no path canônico.
    name: Frontend print visual diff (PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: |
      contains(github.event.pull_request.labels.*.name, 'print') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_print)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Cache Playwright Chromium
        id: pw-cache-print
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache-print.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache-print.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright print spec (chromium)
        env:
          # `mock-report.ts` cobre /api/v1/** sem precisar de backend real;
          # webServer ainda precisa subir Next em :3000 (default Playwright).
          UPDATE_PRINT_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_print_baseline && '1' || '' }}
        run: npm run test:e2e -- --project=chromium --grep "PDF visual diff"

      - name: Upload generated baseline (quando UPDATE_PRINT_BASELINE=1)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_print_baseline
        uses: actions/upload-artifact@v4
        with:
          name: report-print-baseline-generated
          path: frontend/tests/e2e/reports/__snapshots__/report.print.pdf.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload print diff artefatos (actual + diff em falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-print-visual-diffs
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
            frontend/tests/e2e/reports/__snapshots__/
          retention-days: 30

  all-green:
    # Meta-job: aceita success OU skipped (paths-filter pula jobs por área).
    # Falha apenas se algum job upstream falhou ou foi cancelado.
    # Único required check candidato — demais ficam informativos.
    #
    # `frontend-lighthouse` movido para nightly.yml — não é gate de merge.
    # `lint-all` consolida lint+ruff+code-style+pii+tenancy num único job.
    name: All checks green
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint-all
      - pipeline-tests
      - backend-tests
      - frontend-lint
      - frontend-tests
    if: always()
    steps:
      - name: Verify all required jobs passed or were skipped
        run: |
          fail=0
          for job in lint-all pipeline-tests backend-tests frontend-lint frontend-tests; do
            case "$job" in
              lint-all) result="${{ needs.lint-all.result }}" ;;
              pipeline-tests) result="${{ needs.pipeline-tests.result }}" ;;
              backend-tests) result="${{ needs.backend-tests.result }}" ;;
              frontend-lint) result="${{ needs.frontend-lint.result }}" ;;
              frontend-tests) result="${{ needs.frontend-tests.result }}" ;;
            esac
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "✗ $job: $result"
              fail=1
            else
              echo "✓ $job: $result"
            fi
          done
          # `changes` job sempre roda — exigir success.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "✗ changes: ${{ needs.changes.result }}"
            fail=1
          fi
          exit $fail
