# F6.5C.11 — GH Actions CI
#
# Pipeline de validação que roda em cada PR + push para main:
# 1. Lint + format checks
# 2. Pipeline tests (pytest em tests/)
# 3. Backend tests (pytest em backend/tests/) com SQLite in-memory
# 4. Frontend unit + integration tests (Vitest)
# 5. Lint anti-PII (tests/utils/lint_no_real_pii.py)
# 6. Alembic guardrails (drift + idempotency)
# 7. Frontend E2E (Playwright) contra backend REAL subido via services
#    — apenas quando PR marca label `e2e` OU no push para main
#
# Gates de merge:
# - Lint green
# - Pipeline + backend + frontend tests green
# - PII lint green
# - Alembic guardrails green
# - E2E green (quando rodar)
#
# F7C estende para: Docker CVE scan, coverage ≥85%, deploy automático
#
# P1 (motor canônico): após pipeline-tests — schema strict + boundaries em pipeline/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MATHOMS_FERNET_KEY: "NwHpLJlLGSeC7NIS6gfVdVSYh_pObKqY4G_CwkQ1kuA="
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

  lint-pii:
    name: Lint anti-PII em fixtures (F6.5D.7)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run PII lint
        run: python tests/utils/lint_no_real_pii.py --verbose

  tenancy-lint:
    name: Tenancy scoping lint (ADR-072)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest for lint tests
        run: pip install pytest
      - name: Run lint on services + api
        run: python scripts/lint/check_workspace_scoping.py --verbose
      - name: Run lint unit tests
        run: python -m pytest scripts/lint/test_check_workspace_scoping.py -q

  pipeline-tests:
    name: Pipeline tests (tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install reportlab pytest pytest-asyncio pytest-cov fakeredis

      - name: Run pipeline tests
        run: pytest tests/ -q --tb=short

      - name: Pipeline JSON schema strict (MATHOMS_PIPELINE_SCHEMA_MODE)
        env:
          MATHOMS_PIPELINE_SCHEMA_MODE: strict
        run: pytest tests/test_schema_validation.py -q --tb=short

      - name: Pipeline package import boundaries (P1)
        run: python dev/check_pipeline_boundaries.py --verbose

  backend-tests:
    name: Backend tests (backend/tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install reportlab pytest pytest-asyncio pytest-cov fakeredis

      - name: Run backend tests + alembic guardrails
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests/ -q --tb=short

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  frontend-tests:
    name: Frontend unit + integration (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile=./vitest-results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-results
          path: frontend/vitest-results.xml
          retention-days: 14

  frontend-e2e:
    name: Frontend E2E (Playwright + backend real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fin_test
          POSTGRES_PASSWORD: fin_test
          POSTGRES_DB: fin_test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          pip install -r requirements.txt -r backend/requirements.txt
          pip install asyncpg

      - name: Run alembic migrations
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
        run: |
          cd backend && alembic upgrade head

      - name: Start backend (uvicorn)
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
          REDIS_URL: redis://localhost:6380/0
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl -sf http://127.0.0.1:8000/health || (echo "backend não subiu" && exit 1)

      - name: Install frontend deps + Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E (cross-browser em fluxos @critical)
        env:
          PW_CROSS_BROWSER: "1"
          # F6.5F.11 (ADR-070): mock LLM em CI default; PW_REAL_LLM=1 no nightly
          MATHOMS_LLM_MOCK: "1"
        run: |
          cd frontend
          npm run test:e2e

      - name: Upload Playwright report + trace + vídeo (F6.5F.9)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
          retention-days: 30

      - name: Comment PR com link do report (F6.5F.9)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### E2E Report\n\n` +
              `Status: ${{ job.status }}\n` +
              `[📊 Ver report + vídeo + trace](${artifactUrl})\n\n` +
              `Artifacts retidos por 30 dias.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  all-green:
    name: All checks green
    runs-on: ubuntu-latest
    needs:
      - lint
      - lint-pii
      - tenancy-lint
      - pipeline-tests
      - backend-tests
      - frontend-tests
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.lint-pii.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.tenancy-lint.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.pipeline-tests.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then exit 1; fi
          echo "✓ Todos os checks obrigatórios passaram"
