# F6.5C.11 — GH Actions CI
#
# Pipeline de validação que roda em cada PR + push para main:
# 1. lint-all  — pre-commit + ruff + style baseline + PII + tenancy (1 job)
# 2. pipeline-tests (pytest em tests/) com venv cache
# 3. backend-tests (pytest em backend/tests/) com Redis service + venv cache
# 4. frontend-checks (ESLint + tsc --noEmit + Vitest, setup compartilhado)
# 5. frontend-e2e (Playwright + backend real) — opt-in via label `e2e`
# 6. frontend-visual (Playwright snapshots) — opt-in via label `visual`
#    ou workflow_dispatch; scan completo fica no nightly.
# 7. gitleaks — secrets nos commits do PR (A34.l6 · ADR-319). Full-history
#    semanal + Issue automática ficam em security.yml (schedule).
#
# Movido para nightly.yml (não bloqueia merge):
# - frontend-lighthouse — perf/a11y/bp/seo é métrica, não correctness.
#   Roda diário 06:00 UTC + workflow_dispatch + label `lighthouse` em PR.
#
# Gates de merge (all-green):
# - lint-all green
# - pipeline-tests + backend-tests + frontend-checks green
# - gitleaks green (sempre roda — secret pode entrar por PR docs-only)
# - E2E/visual green (quando rodam, opt-in)
#
# F7C estende para: Docker CVE scan, coverage ≥85%, deploy automático
#
# P1 (motor canônico): após pipeline-tests — schema strict + boundaries em pipeline/

name: CI

on:
  # `push: branches: [main]` REMOVIDO (ADR-210 §camada 2, 2026-05-19).
  #
  # Por quê: Ruleset `main-protection` exige `All checks green` pré-merge;
  # squash-merge linear de PR verde **não pode** introduzir resultado
  # diferente do que o PR já testou. Re-rodar em push:main custava ~50%
  # dos minutos do CI (cada merge = 2 runs full). Drift cross-cutting que
  # passa pelo PR é coberto pelo job `main-smoke` em nightly.yml
  # (diário 06:00 UTC; janela máx ~24h, aceitável p/ solo-dev project).
  #
  # Se reabilitar virar necessidade (ex.: deploy automático em main), use
  # `workflow_call` e dispare via release.yml em vez de push:main full.
  pull_request:
    branches: [main]
    # `ready_for_review` substitui o default que dispara em draft. Drafts
    # só rodam CI quando promovidos a "ready". Economiza ~50% dos triggers
    # se você usa drafts (que é o pattern recomendado para WIP em PR).
    types: [opened, synchronize, reopened, ready_for_review]
  # Trigger DORMENTE — Merge Queue do GitHub não está disponível neste repo
  # (private + conta User pessoal; precisaria de Organization + Enterprise
  # Cloud). Substituído por `.github/workflows/auto-update-prs.yml` que
  # mantém branches de PR sincronizadas com main via endpoint update-branch.
  # Mantemos o trigger aqui (custo zero) para que, se algum dia o repo
  # migrar para Organization e a rule `merge_queue` for ativada no Ruleset,
  # o gate `All checks green` continue funcionando sem novo PR.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Rodar Frontend E2E (Playwright)"
        type: boolean
        default: true
      run_visual:
        description: "Rodar Visual snapshots (lento, baselines OS-específicas)"
        type: boolean
        default: false
      update_visual_baselines:
        description: "Re-gerar baselines visuais (--update-snapshots; só com run_visual=true)"
        type: boolean
        default: false
      run_print:
        description: "Rodar PDF visual diff (v2.10; lento, baseline OS-específica)"
        type: boolean
        default: false
      update_print_baseline:
        description: "Re-gerar baseline do PDF visual diff (UPDATE_PRINT_BASELINE=1; só com run_print=true)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A34.l13 (ADR-320): menor privilégio por default; jobs que precisam de mais
# (changes/gitleaks: pull-requests read) elevam no próprio job.
permissions:
  contents: read

env:
  # TODO(cicd-onda-3): mover para `${{ secrets.MATHOMS_FERNET_KEY }}` após
  # owner gerar nova key e rodar:
  #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  #   gh secret set MATHOMS_FERNET_KEY --body "<nova-key>"
  # Migração é ADR-109-sensitive (auth portability) — exige decisão humana.
  MATHOMS_FERNET_KEY: "NwHpLJlLGSeC7NIS6gfVdVSYh_pObKqY4G_CwkQ1kuA="
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Detecta o que mudou para condicionar jobs subsequentes. PRs docs-only
  # rodam só `changes` + `all-green` (no-op). PRs backend-only não disparam
  # frontend-* e Lighthouse; PRs frontend-only não disparam pipeline/backend
  # tests. CLAUDE.md §"Concluído" linha 64–68 declara docs-only fora do gate.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # tj-actions/changed-files SHA-pinned (não tag) por causa do incidente
    # CVE-2025-30066 (mar/2025) que comprometeu tags v1-v45. v47.0.6
    # (abr/2026) é pós-fix e SHA explícito impede tag-rewrite. files_yaml
    # replica o pattern de filter-groups do dorny/paths-filter@v3.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend_any_changed }}
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
      pipeline: ${{ steps.filter.outputs.pipeline_any_changed }}
      any_code: ${{ steps.filter.outputs.any_code_any_changed }}
      report: ${{ steps.filter.outputs.report_any_changed }}
      migration: ${{ steps.filter.outputs.migration_any_changed }}
      go: ${{ steps.filter.outputs.go_any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed files (SHA-pinned v47.0.6)
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          # Mudança no próprio workflow → roda tudo (sanity contra
          # regressão na config de filtros).
          files_yaml: |
            backend:
              - 'backend/**'
              - 'requirements.in'
              - 'requirements.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'design-tokens/**'
              - 'config/report_layout.yaml'
              - '.github/workflows/ci.yml'
            pipeline:
              - 'pipeline/**'
              - 'pipeline-service/**'
              - 'scripts/**'
              - 'tests/**'
              # `config/**` era amplo demais — casava com config/*.md
              # (definitions.md, report_spec.md, etc — docs do produto).
              # Limita aos formatos de runtime config que o pipeline lê.
              - 'config/**.json'
              - 'config/**.yaml'
              - 'config/**.yml'
              - 'config/schemas/**'
              - 'requirements.in'
              - 'requirements.lock'
              - '.github/workflows/ci.yml'
            go:
              - '**.go'
              - 'go.work'
              - 'go.work.sum'
              - 'services/**'
              - '.golangci.yml'
              # Fontes dos codegens Go — mudanças exigem re-check de sync.
              - 'pipeline/stage_spec.py'
              - 'docs/reference/api/v1/pipeline-service.openapi.json'
              - 'dev/codegen_stage_registry_go.py'
              - 'dev/convert_openapi_31_to_30.py'
              - '.github/workflows/ci.yml'
            any_code:
              - '**'
              - '!docs/**'
              - '!**.md'
              - '!.claude/**'
              - '!_archive/**'
              - '!_scratch/**'
            # `report` é subset de `frontend` para gating do job
            # frontend-visual (snapshots ~50 PNGs). Auto-trigger aqui
            # substitui label manual `visual` para PRs que efetivamente
            # tocam superfície do relatório — captura regressões antes
            # do merge sem custo em PRs de outras áreas.
            # Mudança no próprio workflow → roda tudo (mesma lógica de backend/frontend).
            report:
              - 'frontend/src/components/report/**'
              - 'frontend/src/app/reports/**'
              - 'frontend/src/lib/api/reports*.ts'
              - 'frontend/src/types/report*.ts'
              - 'frontend/src/generated/report-layout.ts'
              - 'frontend/tests/e2e/reports/**'
              - 'frontend/tests/e2e/fixtures/reports/**'
              - 'frontend/tests/e2e/helpers/mock-report.ts'
              - 'config/report_layout.yaml'
              - 'design-tokens/**'
              - '.github/workflows/ci.yml'
            # `migration` filtra PRs que tocam migrations Alembic. Testes
            # marcados com `@pytest.mark.migration` validam o código de uma
            # migration one-shot específica — uma vez mergeado e aplicado em
            # prod, esse código não muda mais, então re-rodar em PR que só
            # toca código de aplicação queima ~15-20 s sem ganho. Em PR que
            # toca o diretório, `MATHOMS_RUN_MIGRATION_TESTS=1` reativa.
            # `test_alembic_guardrails.py` (drift schema↔model + idempotência)
            # **continua sempre rodando** — não usa o marker.
            migration:
              - 'backend/alembic/versions/**'
              - 'backend/alembic/env.py'
              - 'backend/tests/test_*_migration.py'
              - 'backend/tests/test_a*_seed_migrations.py'
              - 'backend/app/models/**'
              - '.github/workflows/ci.yml'

  lint-all:
    # Job consolidado (era 5 jobs separados: lint, ruff, code-style-regression,
    # lint-pii, tenancy-lint). Cada um pagava ~30-60s de boot+checkout+
    # setup-python; juntar reaproveita o setup. Steps independentes — pre-commit
    # cobre ruff via hook, mas o `ruff check` explícito permanece como gate
    # dedicado (A6g.6 slice 1, ADR-114) sem depender da matrix de pre-commit.
    # Fail-fast por step: lint quebra rápido, fixar um por vez é OK.
    name: Lint (pre-commit + ruff + style baseline + PII + tenancy)
    runs-on: ubuntu-latest
    # Tighten 8→4min: observado 44s; 4min dá ~5× buffer e detecta hangs cedo.
    timeout-minutes: 4
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (SHA-pinned v8.1.0)
        # uv é resolver/installer 5-10x mais rápido que pip para deps Python.
        # SHA pin previne tag-rewrite; v8.1.0 é a release mais recente.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.x"

      - name: Install lint deps (via uv)
        # ADR-182: jsonschema + pyyaml para os hooks doc-* da vault Obsidian
        # (validate_frontmatter, check_doc_links, check_doc_filename_id,
        # build_doc_index, benchmark_doc_token_cost).
        run: uv pip install --system pre-commit ruff==0.6.0 pytest jsonschema pyyaml

      - name: Restore pre-commit cache
        # ADR-210 §camada 2 (2026-05-19): cacheia hooks instalados em
        # ~/.cache/pre-commit (ruff, eslint, etc). Hit economiza ~25-30s
        # do `pre-commit install` implícito + clone de cada repo de hook.
        # Key derivada do .pre-commit-config.yaml — invalida na atualização
        # de qualquer hook. restore-keys permite reuso parcial enquanto
        # apenas 1 hook bumpa de versão.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py313-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py313-

      - name: pre-commit (all files)
        # `ruff check .` explícito removido (ADR-210 §camada 2): pre-commit
        # já roda `ruff` e `ruff-format` como hooks. Reduz duplicação de
        # ~3-5s por PR sem perder cobertura.
        # SKIP lineage-refs: o hook importa pipeline/ de verdade (numpy etc.)
        # e o env deste job é só lint; o gate roda com venv completo no job
        # de pipeline (step "Lineage rule_refs", ci.yml §pipeline-tests).
        env:
          SKIP: lineage-refs
        run: pre-commit run --all-files

      - name: code style baseline regression
        run: python3 dev/check_code_style_regression.py

      - name: PII lint (F6.5D.7)
        run: python tests/utils/lint_no_real_pii.py --verbose

      - name: tenancy scoping lint (ADR-072) — services + api
        run: python scripts/lint/check_workspace_scoping.py --verbose

      - name: tenancy scoping lint — unit tests
        run: python -m pytest scripts/lint/test_check_workspace_scoping.py -q

  pipeline-tests:
    name: Pipeline tests (tests/)
    runs-on: ubuntu-latest
    # Tighten 10→5min: observado 54s; 5min dá ~5× buffer.
    timeout-minutes: 5
    needs: changes
    # `pipeline` cobre mudança em tests/, scripts/, pipeline/, config/.
    # backend/ também porque importa pipeline/** e tem guardrail próprio.
    if: needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (SHA-pinned v8.1.0)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.x"

      - name: Restore venv cache
        # Key no hash do requirements.lock (pinado + hashes, ADR-254) — paridade
        # com o Dockerfile (`pip install --require-hashes`). SEM restore-keys: o
        # fallback de prefixo restaurava venv de lock divergente e mascarava drift
        # de transitiva (incidente 2026-06-18: install do .in loose pegou release
        # nova que quebrou registro de routers). Miss → rebuild do lock ~10-15s (uv).
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py313-lock-${{ hashFiles('requirements.lock') }}-v7

      - name: Install dependencies (cache miss, via uv)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          [ -d .venv ] || uv venv .venv
          uv pip install --require-hashes -r requirements.lock
          # pytest-xdist habilita paralelismo (-n auto) em backend-tests.
          uv pip install reportlab xlwt pytest-cov pytest-xdist fakeredis "schemathesis<4"

      - name: Garante test-deps no venv (sempre — cache pode não tê-los)
        # O venv cache (key v5) é compartilhado entre pipeline-tests,
        # backend-tests e o main-smoke do nightly. Em cache HIT o step acima
        # é pulado; se o venv foi populado antes de xlwt entrar (#596), os
        # tests quebram com ModuleNotFoundError (ex.: xlwt em
        # test_e2_schema_strict_corpus). uv pip install é idempotente e
        # rápido quando já satisfeito. Mesma classe do fix do nightly (#647).
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          [ -d .venv ] || uv venv .venv
          uv pip install reportlab xlwt pytest-cov pytest-xdist fakeredis "schemathesis<4"

      - name: Activate venv (PATH)
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run pipeline tests
        env:
          # W6-T03/F9.5 (ADR-093): hard-fail se identificador de stage legado
          # vazar como string literal fora das ilhas permitidas.
          MATHOMS_ENFORCE_STAGE_RENAME: "1"
        run: pytest tests/ -q --tb=short

      - name: Run pipeline-service tests (ADR-303)
        # Suíte não rodava em nenhum workflow — foi assim que o modo HTTP
        # quebrou em silêncio pós-ADR-212 (ver ADR-303 D5).
        run: pytest pipeline-service/tests -q --tb=short

      - name: Pipeline JSON schema strict (MATHOMS_PIPELINE_SCHEMA_MODE)
        env:
          MATHOMS_PIPELINE_SCHEMA_MODE: strict
        run: pytest tests/test_schema_validation.py -q --tb=short

      - name: Pipeline package import boundaries (P1)
        run: python dev/check_pipeline_boundaries.py --verbose

      - name: Extract purity — no domain imports (ADR-280)
        run: python dev/check_extract_no_domain_imports.py --verbose

      - name: No leak-field consumers (F2 de-leak guard · ADR-280)
        run: python dev/check_no_leak_field_consumers.py --verbose

      - name: Lineage rule_refs resolvem por import real (ADR-281 · A24.l5)
        run: python dev/check_lineage_refs.py

      - name: Lineage eval gate — superfície bloqueada com Issue lineage-eval-fail aberta (ADR-281 · A25.l4)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python dev/check_lineage_eval_gate.py

      - name: Golden rebaseline isolation per-commit (G-c · F2-DB5)
        if: github.event_name == 'pull_request'
        # Por COMMIT (não PR-diff): permite PR misto com commit de rebaseline
        # isolado (fluxo G-c). Deepen: checkout é shallow (depth 1).
        run: |
          git fetch --no-tags --deepen=500 origin
          python dev/check_golden_rebaseline_isolation.py \
            --commit-range "${{ github.event.pull_request.base.sha }}..HEAD"

  backend-tests:
    name: Backend tests (backend/tests/)
    runs-on: ubuntu-latest
    # Tighten 15→8min: observado 4m04s com xdist; 8min dá ~2× buffer.
    # 2026-05-14: +Atos 5/6 do PLANNER_REVIEW adicionaram ~40 testes
    # (planner_field_requests + planner_review_persistence + endpoint admin
    # + tier filter + check_orphan); pytest agora roda em ~7:30-7:40 sem
    # margem. Bumped para 12min (2× tempo observado).
    timeout-minutes: 12
    needs: changes
    # backend/ importa pipeline/**; mudança em pipeline pode quebrar backend.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.pipeline == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (SHA-pinned v8.1.0)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.x"

      - name: Restore venv cache
        # Mesma key que pipeline-tests (hash do requirements.lock). Ambos jobs
        # compartilham cache; quem executar primeiro popula. SEM restore-keys —
        # ver pipeline-tests (evita restaurar venv de lock divergente).
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py313-lock-${{ hashFiles('requirements.lock') }}-v7

      - name: Install dependencies (cache miss, via uv)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          [ -d .venv ] || uv venv .venv
          uv pip install --require-hashes -r requirements.lock
          # pytest-xdist habilita paralelismo (-n auto) em backend-tests.
          uv pip install reportlab xlwt pytest-cov pytest-xdist fakeredis "schemathesis<4"

      - name: Garante test-deps no venv (sempre — cache pode não tê-los)
        # Ver pipeline-tests: cache HIT pula o install acima; venv populado
        # antes de xlwt (#596) quebra com ModuleNotFoundError. Idempotente.
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          [ -d .venv ] || uv venv .venv
          uv pip install reportlab xlwt pytest-cov pytest-xdist fakeredis "schemathesis<4"

      - name: Activate venv (PATH)
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run backend tests + alembic guardrails
        env:
          REDIS_URL: redis://localhost:6379/0
          # Default do projeto: USE_DB_ARTIFACTS=true (cutover concluído).
          # Suíte backend roda apenas no caminho-alvo — bloqueia merge se quebrar.
          MATHOMS_USE_DB_ARTIFACTS: "true"
        run: |
          # `-n auto` (pytest-xdist) paraleliza por CPU. SQLite in-memory +
          # recreate-per-test (ver backend/tests/conftest.py) é xdist-safe:
          # cada worker process tem engine próprio. Ganho ~50% (15→7-10min).
          # `--dist loadgroup` mantém tests do mesmo file no mesmo worker —
          # reduz overhead de fixture setup compartilhado dentro de classe.
          #
          # `-m "not migration"` exclui testes de migration one-shot quando
          # backend/alembic/versions/ não foi tocado (ver job `changes` +
          # pyproject.toml §markers). PR que toca migration habilita o step
          # condicional abaixo. `test_alembic_guardrails.py` (drift/idempot.)
          # NÃO é gated — sempre roda.
          MARKER_FILTER='-m "not migration"'
          if [ "${{ needs.changes.outputs.migration }}" = "true" ]; then
            MARKER_FILTER=""
            echo "::notice::Migration paths tocados; rodando suíte completa (sem deselect)."
          fi
          eval pytest backend/tests/ -q --tb=short -n auto --dist loadgroup $MARKER_FILTER

      - name: Upload coverage (artifact only on failure)
        # Coverage XML só interessa quando CI quebra — em verde, ninguém
        # baixa. Reduz upload + storage de retention.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  frontend-checks:
    # A6g.6 slice 2, ADR-114: gate @typescript-eslint/no-explicit-any +
    # no-unused-vars bloqueantes; max-lines/-per-function progressivos.
    # Consolida ESLint + tsc + Vitest para pagar checkout/setup-node/npm ci
    # uma vez por PR frontend. Trade-off aceito: fail-fast por step (se lint
    # falha, type-check/Vitest não rodam).
    name: Frontend checks (ESLint + tsc + Vitest)
    runs-on: ubuntu-latest
    # ESLint observado ~43s; Vitest observado ~1m49s. 7min dá buffer sem
    # esconder hang real em npm/Vitest.
    timeout-minutes: 7
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        # Fecha buraco: ESLint (no-explicit-any) não pega type errors; antes
        # só o nightly lighthouse (next build) os pegava — depois de chegar
        # em main. tsc roda aqui pois npm ci já instalou TypeScript (~30s).
        run: npm run type-check

      - name: Run Vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile=./vitest-results.xml

      - name: Upload results (only on failure)
        # Vitest junit XML só interessa em falha — em verde ninguém baixa.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-results
          path: frontend/vitest-results.xml
          retention-days: 7

  frontend-e2e:
    name: Frontend E2E (Playwright + backend real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Opt-in via label `e2e` ou workflow_dispatch — preserva
    # comportamento prévio. Filtro de área não se aplica (label é gate).
    if: |
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fin_test
          POSTGRES_PASSWORD: fin_test
          POSTGRES_DB: fin_test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          pip install --require-hashes -r requirements.lock
          pip install reportlab

      - name: Run alembic migrations
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
        run: |
          cd backend && alembic upgrade head

      - name: Start backend (uvicorn + celery worker)
        env:
          MATHOMS_DATABASE_URL: "postgresql+asyncpg://fin_test:fin_test@localhost:5433/fin_test"
          # Pydantic-settings usa env_prefix="MATHOMS_" — `REDIS_URL` puro é
          # ignorado e o default (localhost:6379) cai fora do Redis do CI
          # (exposto em 6380). Celery worker ficava em retry loop eterno.
          MATHOMS_REDIS_URL: redis://localhost:6380/0
          MATHOMS_LLM_MOCK: "1"
          # E2E registra usuários do único IP do runner; o default 10/hora
          # estoura à medida que o set @critical cresce → login 401 em
          # cascata (#644). Desabilita o throttle no backend de teste, como
          # backend/tests/conftest.py (_disable_register_rate_limit).
          MATHOMS_REGISTER_RATE_LIMIT_PER_HOUR: "0"
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          # Worker Celery consome a fila do PipelineRun. Sem ele a task
          # fica "pending" indefinido (ADR-074 — pipeline assíncrono).
          celery -A backend.app.worker worker --loglevel=INFO --concurrency=2 \
            > /tmp/celery.log 2>&1 &
          sleep 5
          curl -sf http://127.0.0.1:8000/health \
            || (echo "backend não subiu" && tail -50 /tmp/uvicorn.log && exit 1)

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Cache Playwright Chromium
        # Em PR só Chromium é instalado — Firefox/WebKit ficam para o
        # nightly (ver nightly.yml > frontend-e2e-cross-browser). Cache
        # key dedicado evita poluir o cache 3-browsers do nightly.
        id: pw-cache-e2e
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache-e2e.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache-e2e.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E (Chromium em fluxos @critical)
        env:
          # F6.5F.11 (ADR-070): mock LLM em CI default; PW_REAL_LLM=1 no nightly
          MATHOMS_LLM_MOCK: "1"
          # Stamp único por run para o auth helper (e2e-w${idx}-${stamp}); sem
          # isso o fallback Date.now() roda por worker e infla registros (#644).
          PW_RUN_STAMP: "${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          cd frontend
          # Cross-browser (Firefox + WebKit) movido para nightly.yml.
          # Regressões cross-browser são raras; rodar só Chromium em PR
          # corta ~50% do runtime do gate E2E quando label `e2e` ativo.
          npm run test:e2e -- --project=chromium

      - name: Upload backend + celery logs (diagnóstico E2E)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            /tmp/uvicorn.log
            /tmp/celery.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright report + trace + vídeo (F6.5F.9)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
          retention-days: 7

      - name: Comment PR com link do report em falha (F6.5F.9)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### E2E falhou\n\n` +
              `[Ver report, vídeo, trace e logs](${artifactUrl})\n\n` +
              `Artifacts retidos por 7 dias.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # frontend-lighthouse → movido para .github/workflows/nightly.yml.
  # Métrica de qualidade (perf/a11y/bp/seo), não correctness — não bloqueia
  # merge. Roda diário às 06:00 UTC + on-demand via workflow_dispatch + label
  # `lighthouse` em PR.

  frontend-visual:
    # Lane report-a11y-finalize item 3 — snapshots por seção (light+dark),
    # ~50 baselines no projeto `visual` do Playwright. Baselines OS-
    # específicas → roda só em runner Linux.
    #
    # **Mudança ADR-210 §camada 1 (2026-05-14):** auto-trigger por path
    # filter REMOVIDO; agora roda só com label `visual` ou
    # workflow_dispatch. Motivação: custo era ~3.5 min × ~30% dos PRs ≈
    # ~$4/mês no overage. Cobertura de regressão preservada em nightly
    # (`frontend-visual-full` em .github/workflows/nightly.yml) com
    # janela de detecção ≤24h e issue auto-aberta em falha.
    #
    # Trade-off vs história: regressões visuais #147, #148, #150, #151
    # escaparam em 2026-04 quando o gate era opt-in via label. Hoje a
    # cobertura é diferente: nightly em main + issue auto + retenção 14d
    # do diff artifact. Para mudanças deliberadas no relatório, adicione
    # label `visual` no PR — gate volta a ser bloqueante.
    name: Frontend visual snapshots (relatório nativo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      contains(github.event.pull_request.labels.*.name, 'visual') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_visual)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Cache Playwright Chromium
        id: pw-cache-visual
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Cache key separado de e2e: aqui só Chromium é instalado.
          # Chave compartilhada poluiria (sem Firefox/WebKit faltando) ou
          # forçaria reinstall no e2e.
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache-visual.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache-visual.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright visual project
        env:
          PW_VISUAL: "1"
          # `mock-report.ts` cobre /api/v1/** sem precisar de backend real;
          # webServer ainda precisa subir Next em :3000 (default do Playwright).
          # Grep `sections\.` casa `sections.snapshots.visual.spec.ts` (snapshots
          # com baselines) + `sections.fixtures.smoke.visual.spec.ts` (smoke
          # sem baseline, fixture variants). Atualizar baselines só faz
          # sentido para o spec de snapshots — `--update-snapshots` é noop
          # no smoke spec.
          UPDATE_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines && '--update-snapshots' || '' }}
        run: npm run test:e2e -- --project=visual --grep "sections\." $UPDATE_FLAG

      - name: Locate generated baselines (debug)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        run: |
          echo "=== PNGs em tests/ que parecem snapshot ==="
          find frontend/tests -name "*.png" 2>/dev/null | head -100
          echo "=== diretórios -snapshots ou __snapshots__ ==="
          find frontend/tests -type d \( -name "*-snapshots" -o -name "__snapshots__" \) 2>/dev/null

      - name: Upload generated baselines (quando --update-snapshots foi passado)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: report-visual-baselines-generated
          path: |
            frontend/tests/e2e/reports/sections.snapshots.visual.spec.ts-snapshots/
            frontend/tests/e2e/reports/sections.snapshots.visual.spec-snapshots/
            frontend/tests/e2e/reports/__snapshots__/
            frontend/tests/**/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload visual diffs + baselines (artefato)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-visual-snapshots
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
            frontend/tests/e2e/reports/__snapshots__/
          retention-days: 30

  frontend-print-visual:
    # Lane v2.10 — PDF visual diff em Playwright. Renderiza /reports/[id]?print=1
    # via CDP `Page.printToPDF()`, converte primeira página com
    # `pdf-to-png-converter` e compara contra baseline em
    # `frontend/tests/e2e/reports/__snapshots__/report.print.pdf.png` com
    # tolerância 500px (PDF→PNG é mais barulhento que screenshot DOM).
    #
    # Opt-in via label `print` (PR) ou workflow_dispatch + `run_print=true`.
    # Mock-report cobre /api/v1/** sem precisar de backend real (Next em :3000).
    #
    # Baseline OS-específica (font rendering Chromium difere por OS); rode SÓ
    # em runner Linux (este job). Atualizar baseline:
    #   `gh workflow run CI -f run_print=true -f update_print_baseline=true`
    # depois baixar artefato `report-print-baseline-generated` e commitar
    # o PNG no path canônico.
    name: Frontend print visual diff (PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: |
      contains(github.event.pull_request.labels.*.name, 'print') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_print)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Cache Playwright Chromium
        id: pw-cache-print
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache-print.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache-print.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright print spec (chromium)
        env:
          # `mock-report.ts` cobre /api/v1/** sem precisar de backend real;
          # webServer ainda precisa subir Next em :3000 (default Playwright).
          UPDATE_PRINT_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_print_baseline && '1' || '' }}
        run: npm run test:e2e -- --project=chromium --grep "PDF visual diff"

      - name: Upload generated baseline (quando UPDATE_PRINT_BASELINE=1)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_print_baseline
        uses: actions/upload-artifact@v4
        with:
          name: report-print-baseline-generated
          path: frontend/tests/e2e/reports/__snapshots__/report.print.pdf.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload print diff artefatos (actual + diff em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-print-visual-diffs
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
            frontend/tests/e2e/reports/__snapshots__/
          retention-days: 30

  go-lint:
    name: Go lint (golangci v2 + gofmt + vet)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: services/pipeline-service-go/go.sum
      - name: gofmt check
        run: |
          unformatted=$(gofmt -s -l services/ 2>/dev/null || true)
          if [ -n "$unformatted" ]; then echo "✗ gofmt:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        working-directory: services/pipeline-service-go
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9  # v8
        with:
          # Binário precisa ser buildado com go >= go.work (v2.1 era go1.24
          # e falhou com "targeted Go version 1.26"); manter par com o local.
          version: v2.12.2
          working-directory: services/pipeline-service-go
          args: --timeout=3m

  go-test:
    name: Go test -race + codegen sync
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: services/pipeline-service-go/go.sum
      - name: "Codegen sync — stage registry (fonte: pipeline/stage_spec.py)"
        run: python3 dev/codegen_stage_registry_go.py --check
      - name: Codegen sync — OpenAPI 3.0 derivado
        run: python3 dev/convert_openapi_31_to_30.py --check
      - name: Contracts regen limpo (oapi-codegen)
        working-directory: services/pipeline-service-go
        run: |
          go tool oapi-codegen --config codegen.yaml ../../docs/reference/api/v1/pipeline-service.openapi.3_0.json
          git diff --exit-code internal/contracts/ || { echo "✗ contracts_gen.go dessincronizado"; exit 1; }
      - name: Tests with race detector
        working-directory: services/pipeline-service-go
        run: go test ./... -race -count=1 -timeout=5m
      - name: Build
        working-directory: services/pipeline-service-go
        run: go build ./...
      - name: govulncheck (CVE alcançável na stdlib/deps — A36.l4/SEC-07)
        # Gate contínuo: pega a próxima vuln alcançável no CI, não na próxima
        # auditoria manual. O piso `toolchain go1.26.5` (go.mod) garante que a
        # análise use a stdlib corrigida (fecha GO-2026-5856). Scanner pinado.
        working-directory: services/pipeline-service-go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  gitleaks:
    # A34.l6 (ADR-319 · PLAN-public-release W2): gate de merge anti-secret.
    # Sem path-gating: secret pode entrar por PR docs-only, então roda em
    # TODO PR (~30s). Varre os commits do PR; a varredura full-history
    # semanal + Issue automática permanecem em security.yml (schedule).
    name: gitleaks (PR commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Só eventos de PR: em workflow_dispatch (runs manuais de e2e/visual) a
    # action cairia em full-history scan — cobertura que pertence ao
    # schedule de security.yml, não ao gate de merge.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    # gitleaks-action lê PR commits via API — exige pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (.gitleaks.toml)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pin explícito = paridade com o rev do pre-commit
          # (.pre-commit-config.yaml) — ver ADR-230 §D3.
          GITLEAKS_VERSION: "8.24.3"

  all-green:
    # Meta-job: aceita success OU skipped (paths-filter pula jobs por área).
    # Falha apenas se algum job upstream falhou ou foi cancelado.
    # Único required check candidato — demais ficam informativos.
    #
    # `frontend-lighthouse` movido para nightly.yml — não é gate de merge.
    # `lint-all` consolida lint+ruff+code-style+pii+tenancy num único job.
    name: All checks green
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint-all
      - pipeline-tests
      - backend-tests
      - frontend-checks
      - go-lint
      - go-test
      - gitleaks
    if: always()
    steps:
      - name: Verify all required jobs passed or were skipped
        run: |
          fail=0
          for job in lint-all pipeline-tests backend-tests frontend-checks go-lint go-test gitleaks; do
            case "$job" in
              lint-all) result="${{ needs.lint-all.result }}" ;;
              pipeline-tests) result="${{ needs.pipeline-tests.result }}" ;;
              backend-tests) result="${{ needs.backend-tests.result }}" ;;
              frontend-checks) result="${{ needs.frontend-checks.result }}" ;;
              go-lint) result="${{ needs.go-lint.result }}" ;;
              go-test) result="${{ needs.go-test.result }}" ;;
              gitleaks) result="${{ needs.gitleaks.result }}" ;;
            esac
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "✗ $job: $result"
              fail=1
            else
              echo "✓ $job: $result"
            fi
          done
          # `changes` job sempre roda — exigir success.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "✗ changes: ${{ needs.changes.result }}"
            fail=1
          fi
          exit $fail
