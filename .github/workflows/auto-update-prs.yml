# Auto-update PR branches — trem serializado (ADR-322)
#
# O Ruleset `main-protection` exige branch up-to-date com main
# (`strict_required_status_checks_policy: true`), então cada merge em main
# invalida os demais PRs abertos. Este workflow avança o trem de auto-merge:
# faz update-branch em EXATAMENTE 1 PR por run (o mais antigo elegível com
# auto-merge), via `dev/ci_advance_automerge_train.py`.
#
# Por que 1 por vez e não todos (comportamento antigo, autoupdate-action):
# atualizar N PRs a cada merge custa O(N²) runs de CI por dia e só o
# primeiro merge aproveita — os demais ficam BEHIND de novo. O strict do
# Ruleset já serializa o merge final; atualizar em lote é puro desperdício.
#
# Por que AUTOUPDATE_PAT e nunca GITHUB_TOKEN: push/update-branch feito com
# GITHUB_TOKEN é atribuído a github-actions[bot] e os runs `pull_request`
# resultantes nascem `action_required` (0 jobs) — o CI nunca roda e o PR
# congela. Sem o secret, este workflow NÃO faz fallback: loga warning e sai
# (regressão ruidosa > orfãos silenciosos). Criação/rotação do PAT:
# docs/reference/runbooks/automerge_train.md.
#
# Triggers:
#   - push em main → avança o trem após cada merge
#   - schedule → rede de segurança quando o merge não gera push "humano"
#     (merge executado por bot não dispara workflows) ou quando a cabeça
#     destravou por outro caminho
#   - workflow_dispatch → kick manual

name: Auto-update PR branches

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

# A34.l13 (ADR-320): default de menor privilégio no workflow; a escrita
# vive só no job que a justifica (update-branch requer push).
permissions:
  contents: read

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  advance:
    name: Advance auto-merge train (1 PR/run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: write + pull-requests: write — o update-branch faz merge de
    # main na branch do PR (push) e lê metadados do PR (A34.l13). O trabalho
    # real usa AUTOUPDATE_PAT; estas permissions limitam o GITHUB_TOKEN.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTOUPDATE_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Guard — exige AUTOUPDATE_PAT (identidade real)
        if: env.GH_TOKEN == ''
        run: |
          echo "::warning title=AUTOUPDATE_PAT ausente::Trem parado de propósito. Update-branch com GITHUB_TOKEN nasce action_required e congela o PR. Crie fine-grained PAT (Contents+Pull requests write, só este repo, expiração <=90d) e salve como secret AUTOUPDATE_PAT. Runbook: docs/reference/runbooks/automerge_train.md"

      - uses: actions/checkout@v4
        if: env.GH_TOKEN != ''

      - name: Advance train
        if: env.GH_TOKEN != ''
        run: python3 dev/ci_advance_automerge_train.py
