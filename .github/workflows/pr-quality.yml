# PR Quality — gates de padronização visual de PR.
#
# Roda em todo PR contra main e enforça:
# 1. title-lint  — título do PR segue Conventional Commits (espelha
#                  dev/validate_commit_msg.py). Vira commit message no
#                  squash-merge, então tem que ser limpo.
# 2. auto-label  — adiciona labels `area:*` e `dependency` por path
#                  alterado (config: .github/labeler.yml).
# 3. size-label  — adiciona label `size:XS|S|M|L|XL` baseado em linhas
#                  modificadas. Comenta quando >XL pedindo split.
#
# `Title (Conventional Commits)` é required check no ruleset `main-protection`
# (id 15884038) — reprovar aqui bloqueia merge de qualquer PR. Por isso os dois
# passos de label carregam `continue-on-error: true`: label é cosmética e nunca
# deve gatear merge; a única razão legítima de o job reprovar é título inválido.
#
# O size-label é script `gh` inline, não action de terceiro, por causa de um
# incidente medido (2026-08-03, PR #1157, run 30816509828 attempt 1): a action
# Docker `CodelyTV/pr-size-labeler` faz `FROM alpine:3.15` sem digest, o
# runner buildava a imagem dela num passo sintetizado ANTES dos passos do job,
# e um timeout do Docker Hub reprovou o check com `Validate PR title` marcado
# `skipped` — nunca chegou a rodar. `continue-on-error` não cobre esse passo
# de build (ele não é declarado aqui), então a única correção real foi tirar
# Docker Hub do caminho de merge. Nota: o hook `docker-sha-pin` (ADR-249)
# escaneia via `git ls-files` e por construção não alcança o Dockerfile de
# action de terceiro — o pin por SHA da action pina o código dela, não a base
# da imagem que ela builda.
#
# Permissions: declaração no workflow level. Em repo privado pessoal não
# há fork PR (só branches do mesmo repo), então `pull_request` (não
# `pull_request_target`) é seguro.

name: PR Quality

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  # Trigger DORMENTE — Merge Queue indisponível neste repo (ver comentário
  # equivalente em ci.yml). Mantemos por simetria; se a rule `merge_queue`
  # for ativada no futuro, `title-lint` aqui já reporta no-op success no
  # contexto `merge_group` (steps `if: github.event_name == 'pull_request'`
  # abaixo).
  merge_group:
    types: [checks_requested]

# A34.l13 (ADR-320): default read; a escrita (labels) vive no job.
permissions:
  contents: read

concurrency:
  # Em `pull_request`, agrupa por PR. Em `merge_group`, `pull_request` é
  # null e cairia tudo no mesmo grupo `pr-quality-` — usa `github.ref`
  # (ex.: refs/heads/gh-readonly-queue/main/pr-N-SHA) para isolar entradas.
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title-lint:
    name: Title (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull-requests: write — labeler/size-labeler aplicam labels no PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Skip in merge_group (já validado no pull_request)
        if: github.event_name == 'merge_group'
        run: echo "Título já validado quando o PR entrou na fila."
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        # amannn/action-semantic-pull-request@v5.5.3
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Espelha prefixos aceitos por dev/validate_commit_msg.py.
          # `update` e os legacy `pipeline|config|E*|pre-reset` ficam de
          # fora aqui — quem quiser legacy commita direto e o squash usa
          # o título do PR (sempre conventional). Janela de transição
          # natural sem quebrar histórico.
          types: |
            feat
            fix
            refactor
            perf
            test
            chore
            backend
            frontend
            api
            db
            infra
            ci
            docs
          # Escopo opcional: feat(api): ... ou apenas feat: ...
          requireScope: false
          # Bloqueia subjects vazios ou muito curtos como "fix" ou "Update X".
          subjectPattern: ^[A-Za-z0-9].{4,}$
          subjectPatternError: |
            O subject do PR deve começar com letra/dígito e ter pelo menos 5 caracteres.

            Exemplos válidos:
              feat(api): adiciona endpoint /v1/reports/export
              fix(pipeline): aborta E3 quando saldo inicial vem como NaN

            Exemplos inválidos:
              fix: bug                  ← muito curto
              feat: !@#                 ← não começa com letra/dígito

      - name: Apply area:* + dependency labels
        if: github.event_name == 'pull_request'
        # Label cosmética nunca reprova required check — ver §continue-on-error
        # no cabeçalho.
        continue-on-error: true
        # Labeler precisa de pull-requests: write (já no workflow level).
        # actions/labeler@v5.0.0
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9  # v5
        with:
          configuration-path: .github/labeler.yml
          # sync-labels=true remove labels obsoletas quando o PR não
          # bate mais o glob (ex.: revisor remove arquivos de uma área).
          sync-labels: true

      - name: Apply size label
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Codegen e snapshot inflam o diff sem custo de review — ficam fora
          # da conta. `*` casa `/` em `case`, então cobre subárvore inteira.
          ignored() {
            case "$1" in
              frontend/package-lock.json|\
              frontend/src/generated/*|\
              backend/app/generated/*|\
              docs/reference/DB_SCHEMA_REFERENCE.md|\
              backend/app/openapi_snapshot.json|\
              frontend/openapi-snapshot.json|\
              *.snap|\
              *__snapshots__/*|\
              dev/code_style_baseline.json) return 0 ;;
            esac
            return 1
          }

          # REST paginado (não `gh pr view --json files`, que trunca em 100).
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                    --jq '.[] | [.filename, .additions, .deletions] | @tsv')

          changed=0
          while IFS=$'\t' read -r path adds dels; do
            [ -n "$path" ] || continue
            ignored "$path" && continue
            changed=$(( changed + adds + dels ))
          done <<< "$files"

          if   [ "$changed" -le 20  ]; then size='size:XS'
          elif [ "$changed" -le 100 ]; then size='size:S'
          elif [ "$changed" -le 300 ]; then size='size:M'
          elif [ "$changed" -le 600 ]; then size='size:L'
          else                              size='size:XL'
          fi
          echo "$changed linhas modificadas (fora do ignore) → $size"

          # Size label é exclusiva: remove as outras antes de aplicar a atual.
          for stale in $(gh pr view "$PR" --repo "$REPO" --json labels \
                           --jq '.labels[].name | select(startswith("size:"))'); do
            [ "$stale" = "$size" ] && continue
            gh pr edit "$PR" --repo "$REPO" --remove-label "$stale"
          done
          gh pr edit "$PR" --repo "$REPO" --add-label "$size"

          # Não falha o job em XL — só comenta. Decisão de aceitar PR grande
          # é humana. Marcador HTML evita recomentar a cada `synchronize`.
          MARKER='<!-- pr-size-labeler:xl -->'
          if [ "$size" = 'size:XL' ] && ! gh pr view "$PR" --repo "$REPO" \
               --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
            gh pr comment "$PR" --repo "$REPO" --body "$MARKER
          ## ⚠️ PR grande (>600 linhas modificadas)

          PRs grandes são mais difíceis de revisar e arriscados de reverter.
          Se possível, considere quebrar em commits/PRs menores
          (CLAUDE.md §Git e commits: \"Diff >300 linhas ou 3+ camadas → quebre em commits sequenciais\").

          Se o tamanho é justificado (refactor cross-cutting, codegen, migração de schema),
          adicione um comentário explicando o porquê para acelerar o review."
          fi
