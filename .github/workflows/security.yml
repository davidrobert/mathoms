# Security gates — Sprint A11 W2-T03 ([[ADR-230]])
#
# Jobs paralelos:
#   1. trivy-fs       — CVE em dependências (filesystem-scan). SARIF upload.
#   2. trivy-config   — IaC misconfig em Dockerfile + compose + workflows.
#   3. pip-audit      — CVE em deps Python (backend + raiz).
#   4. npm-audit-prod — CVE em deps JS de prod (bloqueia).
#   5. npm-audit-dev  — CVE em deps JS dev (informativo, continue-on-error).
#   6. gitleaks       — secrets em git history full (--log-opts="--all").
#
# Image scan (`trivy image`) é diferido para W4-T02 (GHCR + Coolify).
# GH secret scanning é configurado fora do repo (gh api). Ver
# docs/reference/runbooks/security_gates.md.
#
# Triggers:
#   - pull_request em main: bloqueia merge se algum scan falhar.
#   - schedule sábado 03:00 UTC: detecta CVE divulgada entre PRs;
#     failure abre Issue em vez de bloquear (não há PR para bloquear).
#   - workflow_dispatch: rerun manual.

name: Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Trivy roda como check **informativo** enquanto repo for privado sem
  # GitHub Advanced Security (SARIF upload exige `security-events: write`
  # + code scanning habilitado, ambos GHAS-gated). Output em `table`
  # mantém visibilidade em logs. Quando GHAS chegar, voltar a SARIF +
  # remover `continue-on-error` ([[ADR-230]] §"GHAS license follow-up").
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Trivy (filesystem, HIGH+CRITICAL)
        # TODO(security-trivy-fs-2026-05-20): remover continue-on-error
        # quando (a) GHAS chegar (SARIF blocking) ou (b) todas as vulns
        # npm/python listadas no runbook §Diferimentos forem fixadas.
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          format: table
          skip-dirs: "_archive,docs/archive,frontend/.next,frontend/node_modules,storage"

  trivy-config:
    name: Trivy IaC config scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy config (Dockerfile, compose, workflows)
        # TODO(security-trivy-config-2026-05-20): remover continue-on-error
        # após review/triagem dos 4 IaC misconfigs detectados no primeiro
        # run e fix em PR(s) dedicado(s).
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: table
          skip-dirs: "_archive,docs/archive,frontend/.next,frontend/node_modules,storage"

  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # PYSEC-2025-185 (python-jose 3.5.0, DoS via JWE token):
      # sem fix version publicada upstream; allowlist temporário até
      # python-jose >=4.x. SLO HIGH ≤14d ([[ADR-230]] §D5). Issue de
      # rastreio: davidrobert/mathoms#security-pysec-2025-185.
      - name: Run pip-audit on backend/requirements.txt
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt
          ignore-vulns: "PYSEC-2025-185"
      - name: Run pip-audit on requirements.txt (pipeline)
        if: hashFiles('requirements.txt') != ''
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
          ignore-vulns: "PYSEC-2025-185"

  # npm audit não suporta ignore-by-CVE — para vulns conhecidas que
  # exigem upgrade breaking (next, next-intl, postcss em 2026-05-20),
  # job fica em continue-on-error step-level até PRs de upgrade
  # mergearem. SLO HIGH ≤14d; rastreio em Issue dedicada por dep.
  # Quando uma vuln é fixada, job volta a ser blocking.
  npm-audit-prod:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (prod, HIGH+)
        # TODO(security-npm-prod-2026-05-20): remover continue-on-error
        # após PRs de upgrade de next/next-intl/postcss. Issue: TBD.
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  npm-audit-dev:
    name: npm audit (dev deps — informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (incluindo dev, informativo)
        # continue-on-error step-level — dev deps raramente exploitable,
        # job nunca bloqueia.
        continue-on-error: true
        run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # gitleaks-action lê PR commits via API — exige pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (full history + .gitleaks.toml)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  open-issue-on-schedule-failure:
    name: Open Security Issue (schedule only)
    runs-on: ubuntu-latest
    needs: [trivy-fs, trivy-config, pip-audit, npm-audit-prod, gitleaks]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open Issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security schedule failure ${new Date().toISOString().slice(0,10)}`,
              labels: ['security'],
              body: [
                'Schedule run de `.github/workflows/security.yml` falhou.',
                '',
                `Run: ${run}`,
                '',
                'Triagem em `docs/reference/runbooks/security_gates.md` §"Como triar Issue de schedule".',
                '',
                'SLO: CRITICAL ≤72h, HIGH ≤14d ([[ADR-230]] §D5).'
              ].join('\n')
            });
