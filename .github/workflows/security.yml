# Security gates — Sprint A11 W2-T03 ([[ADR-230]])
#
# Jobs paralelos:
#   1. trivy-fs       — CVE em dependências (filesystem-scan). SARIF upload.
#   2. trivy-config   — IaC misconfig em Dockerfile + compose + workflows.
#   3. pip-audit      — CVE em deps Python (backend + raiz).
#   4. npm-audit-prod — CVE em deps JS de prod (bloqueia).
#   5. npm-audit-dev  — CVE em deps JS dev (informativo, continue-on-error).
#   6. gitleaks       — secrets em git history full (--log-opts="--all").
#
# Image scan (`trivy image`) é diferido para W4-T02 (GHCR + Coolify).
# GH secret scanning é configurado fora do repo (gh api). Ver
# docs/reference/runbooks/security_gates.md.
#
# Triggers:
#   - pull_request em main: bloqueia merge se algum scan falhar.
#   - schedule sábado 03:00 UTC: detecta CVE divulgada entre PRs;
#     failure abre Issue em vez de bloquear (não há PR para bloquear).
#   - workflow_dispatch: rerun manual.

name: Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Trivy (filesystem, HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: "_archive,docs/archive,frontend/.next,frontend/node_modules,storage"
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy IaC config scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy config (Dockerfile, compose, workflows)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: sarif
          output: trivy-config.sarif
          skip-dirs: "_archive,docs/archive,frontend/.next,frontend/node_modules,storage"
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run pip-audit on backend/requirements.txt
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt
          ignore-vulns: ""
      - name: Run pip-audit on requirements.txt (pipeline)
        if: hashFiles('requirements.txt') != ''
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
          ignore-vulns: ""

  npm-audit-prod:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (prod, HIGH+)
        run: npm audit --audit-level=high --omit=dev

  npm-audit-dev:
    name: npm audit (dev deps — informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (incluindo dev, informativo)
        run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (full history + .gitleaks.toml)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  open-issue-on-schedule-failure:
    name: Open Security Issue (schedule only)
    runs-on: ubuntu-latest
    needs: [trivy-fs, trivy-config, pip-audit, npm-audit-prod, gitleaks]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open Issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security schedule failure ${new Date().toISOString().slice(0,10)}`,
              labels: ['security'],
              body: [
                'Schedule run de `.github/workflows/security.yml` falhou.',
                '',
                `Run: ${run}`,
                '',
                'Triagem em `docs/reference/runbooks/security_gates.md` §"Como triar Issue de schedule".',
                '',
                'SLO: CRITICAL ≤72h, HIGH ≤14d ([[ADR-230]] §D5).'
              ].join('\n')
            });
