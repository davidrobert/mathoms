# Security gates — Sprint A11 W2-T03 ([[ADR-230]])
#
# Jobs paralelos:
#   1. trivy-fs       — CVE em dependências (filesystem-scan). SARIF upload.
#   2. trivy-config   — IaC misconfig em Dockerfile + compose + workflows.
#   3. pip-audit      — CVE em deps Python (backend + raiz).
#   4. npm-audit-prod — CVE em deps JS de prod (bloqueia).
#   5. npm-audit-dev  — CVE em deps JS dev (informativo, continue-on-error).
#   6. gitleaks       — secrets em git history full (--log-opts="--all").
#                       Só schedule/dispatch: o gate de PR vive em ci.yml
#                       (job `gitleaks`, agregado em All checks green — A34.l6).
#
# Image scan (`trivy image`) é diferido para W4-T02 (GHCR + Coolify).
# GH secret scanning é configurado fora do repo (gh api). Ver
# docs/reference/runbooks/security_gates.md.
#
# Triggers:
#   - pull_request em main: bloqueia merge se algum scan falhar.
#     Gating por path-filter (changes job) — docs-only / area-only pula
#     scans irrelevantes (cobertura preservada pelo schedule semanal).
#   - schedule sábado 03:00 UTC: roda TODOS os scans (sem gating).
#     Detecta CVE divulgada entre PRs; failure abre Issue.
#   - workflow_dispatch: rerun manual (também sem gating — escolha
#     manual implica intent de rodar full scan).

name: Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detecta o que mudou para condicionar scans. Mesma estratégia do
  # ci.yml (tj-actions/changed-files SHA-pinned por CVE-2025-30066).
  # Em schedule / workflow_dispatch força `force_all=true` — todo scan
  # roda (cobertura semanal + manual override). Em PR, gate por path.
  changes:
    name: Detect changed paths (security gating)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python_deps: ${{ steps.set.outputs.python_deps }}
      npm_deps: ${{ steps.set.outputs.npm_deps }}
      iac: ${{ steps.set.outputs.iac }}
      any_code: ${{ steps.set.outputs.any_code }}
      force_all: ${{ steps.set.outputs.force_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Schedule + workflow_dispatch: força todos os scans (cobertura semanal).
      # PR: usa filter para skip scans irrelevantes (docs-only ⇒ 0 scans).
      - name: Determine if force-all (schedule/dispatch)
        id: force
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed files (PR only; SHA-pinned v47.0.6)
        id: filter
        if: steps.force.outputs.force == 'false'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files_yaml: |
            python_deps:
              - 'backend/requirements.in'
              - 'requirements.in'
              - 'requirements.lock'
              - 'pipeline-service/requirements*.txt'
              - '.github/workflows/security.yml'
            npm_deps:
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - '.github/workflows/security.yml'
            iac:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
              - 'frontend/Dockerfile*'
              - 'backend/Dockerfile*'
            any_code:
              - '**'
              - '!docs/**'
              # `!*.md` (raiz) e não `!**/*.md` — mesmo motivo do any_code em
              # ci.yml: excluir .md aninhado tiraria config/*.md e READMEs de
              # fixture do trivy-fs. Comportamento idêntico ao `!**.md` antigo.
              - '!*.md'
              - '!.claude/**'
              - '!_archive/**'
              - '!_scratch/**'

      - name: Set outputs
        id: set
        run: |
          force="${{ steps.force.outputs.force }}"
          echo "force_all=$force" >> "$GITHUB_OUTPUT"
          if [[ "$force" == "true" ]]; then
            echo "python_deps=true" >> "$GITHUB_OUTPUT"
            echo "npm_deps=true" >> "$GITHUB_OUTPUT"
            echo "iac=true" >> "$GITHUB_OUTPUT"
            echo "any_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_deps=${{ steps.filter.outputs.python_deps_any_changed }}" >> "$GITHUB_OUTPUT"
            echo "npm_deps=${{ steps.filter.outputs.npm_deps_any_changed }}" >> "$GITHUB_OUTPUT"
            echo "iac=${{ steps.filter.outputs.iac_any_changed }}" >> "$GITHUB_OUTPUT"
            echo "any_code=${{ steps.filter.outputs.any_code_any_changed }}" >> "$GITHUB_OUTPUT"
          fi

  # Trivy roda como check **informativo** enquanto repo for privado sem
  # GitHub Advanced Security (SARIF upload exige `security-events: write`
  # + code scanning habilitado, ambos GHAS-gated). Output em `table`
  # mantém visibilidade em logs. Quando GHAS chegar, voltar a SARIF +
  # remover `continue-on-error` ([[ADR-230]] §"GHAS license follow-up").
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Trivy (filesystem, HIGH+CRITICAL)
        # TODO(security-trivy-fs-2026-05-20): remover continue-on-error
        # quando (a) GHAS chegar (SARIF blocking) ou (b) todas as vulns
        # npm/python listadas no runbook §Diferimentos forem fixadas.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          format: table
          skip-dirs: "_archive,docs/archive,frontend/.next,frontend/node_modules,storage"

  trivy-config:
    name: Trivy IaC config scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy config (Dockerfile, compose, workflows)
        # TODO(security-trivy-config-2026-05-20): remover continue-on-error
        # após review/triagem dos 4 IaC misconfigs detectados no primeiro
        # run e fix em PR(s) dedicado(s).
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: table
          skip-dirs: "_archive,docs/archive,frontend/.next,frontend/node_modules,storage"

  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: changes
    if: needs.changes.outputs.python_deps == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pip-audit é gate blocking (HIGH+ via --strict).
      #
      # PYSEC-2025-185 (python-jose) removido do allowlist em PR de
      # reativação — resolvido por PR #357 (migração para PyJWT).
      #
      # PYSEC-2025-183 (PyJWT, "weak encryption"): DISPUTADA pelo PyPA.
      # Vuln é sobre key length escolhido pela app, não bug de código.
      # Mitigado em Mathoms: `MATHOMS_SECRET_KEY` (32 bytes) gerado via
      # `dev/gen-secrets.sh --init-env`; PyJWT 2.12.1+ emite
      # `InsecureKeyLengthWarning` em runtime — defesa em profundidade.
      # Permanente até upstream publicar patch ou substituirmos PyJWT.
      # Tracking em runbook §Diferimentos vigentes.
      # pip-audit roda sobre o lock combinado pinado (ADR-254): versões exatas,
      # zero ambiguidade transitiva — o audit reporta CVE da árvore inteira que
      # de fato vai pra imagem, não só das ~40 deps diretas.
      - name: Run pip-audit on requirements.lock (combined, pinned)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: requirements.lock
          ignore-vulns: "PYSEC-2025-183"

  # npm-audit-prod é gate blocking (HIGH+). Vulns deferidas exigem
  # `overrides` no package.json com justificativa + Issue de tracking
  # (runbook §"Ignorar CVE em npm audit").
  #
  # O diferimento de postcss (#354) FECHOU: as advisories novas
  # (GHSA-r28c-9q8g-f849 / GHSA-fxqj-rqcc-2cmp) escalaram para HIGH e
  # passaram a tripar o threshold — "permanece moderate" deixou de valer.
  # postcss é devDependency, mas o override `"postcss": "$postcss"` a
  # promove pra árvore de prod do next, então o floor do `.in` de dev é
  # que governa o que o gate vê: bumpar só o next NÃO resolve (o override
  # puxaria a versão da raiz de volta pra baixo). Ver runbook §Diferimentos.
  npm-audit-prod:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.npm_deps == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (prod, HIGH+)
        run: npm audit --audit-level=high --omit=dev

  npm-audit-dev:
    name: npm audit (dev deps — informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.npm_deps == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (incluindo dev, informativo)
        # continue-on-error step-level — dev deps raramente exploitable,
        # job nunca bloqueia.
        continue-on-error: true
        run: npm audit --audit-level=high

  gitleaks:
    # A34.l6 (ADR-319): o gate de PR migrou para ci.yml (job `gitleaks`,
    # agregado em "All checks green" — bloqueante de merge). Aqui fica só a
    # varredura full-history semanal/manual + Issue automática em falha.
    name: gitleaks (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: changes
    if: needs.changes.outputs.force_all == 'true'
    # gitleaks-action lê PR commits via API — exige pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (full history + .gitleaks.toml)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pin explícito = paridade com o rev do pre-commit (.pre-commit-config.yaml).
          # v2.3.9 já hardcoda 8.24.3, mas fixar aqui blinda contra drift do default
          # do action em bump futuro (ver ADR-230 §D3 — paridade local↔CI).
          GITLEAKS_VERSION: "8.24.3"

  open-issue-on-schedule-failure:
    name: Open Security Issue (schedule only)
    runs-on: ubuntu-latest
    needs: [trivy-fs, trivy-config, pip-audit, npm-audit-prod, gitleaks]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open Issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security schedule failure ${new Date().toISOString().slice(0,10)}`,
              labels: ['security'],
              body: [
                'Schedule run de `.github/workflows/security.yml` falhou.',
                '',
                `Run: ${run}`,
                '',
                'Triagem em `docs/reference/runbooks/security_gates.md` §"Como triar Issue de schedule".',
                '',
                'SLO: CRITICAL ≤72h, HIGH ≤14d ([[ADR-230]] §D5).'
              ].join('\n')
            });
