# Auto-merge watchdog (ADR-322)
#
# Remedia os 3 estados presos que exigiam intervenção manual do owner:
#   (a) auto-merge desabilitado silenciosamente pelo GitHub quando o
#       agregador "All checks green" de um run superseded falha → re-habilita
#       se o head atual está verde (opt-out humano: label wip/do-not-merge/blocked)
#   (b) runs órfãos `action_required` (push atribuído a bot) → empty commit
#       via Git Data API re-dispara o CI — só com AUTOUPDATE_PAT (com
#       GITHUB_TOKEN o kick geraria novo órfão)
#   (c) cabeça do trem parada >60min → mantém issue de sinalização
#       (fecha sozinha quando o trem anda)
#
# Roda com AUTOUPDATE_PAT quando disponível (merge/re-enable atribuídos ao
# owner mantêm a cadeia push→trigger viva); degrada para GITHUB_TOKEN nas
# funções que não dependem de atribuição (re-enable, issue).

name: Auto-merge watchdog

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch: {}

# A34.l13 (ADR-320): default de menor privilégio; escrita só no job.
permissions:
  contents: read

concurrency:
  group: automerge-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Watchdog (re-enable + kick + stall signal)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write (kick via Git Data API) + pull-requests: write
    # (re-enable auto-merge) + issues: write (issue de stall) + actions:
    # read (runs por commit) + checks/statuses: read (statusCheckRollup —
    # sem eles o gh pr list falha e o run fica vermelho a cada schedule).
    # Trabalho real usa AUTOUPDATE_PAT quando disponível; estas
    # permissions limitam o GITHUB_TOKEN de fallback.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.AUTOUPDATE_PAT || github.token }}
      AUTOMERGE_KICK: ${{ secrets.AUTOUPDATE_PAT != '' && '1' || '0' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Run watchdog
        run: python3 dev/ci_automerge_watchdog.py

      # Canal de falha do compensador (ADR-210 §camada 4, KR-F do PLAN-ci-trust).
      # O `S2` do watchdog mede run INICIADO, não bem-sucedido: sem este step,
      # um compensador que inicia e falha todo run é invisível. Em 2026-08-17 o
      # `auto-update-prs` falhou 10x em ~5h, a fila parou, e nada percebeu.
      # LIMITE declarado: `if: failure()` só dispara se um step ANTERIOR deste
      # job falhou — job que nao recebe runner (budget, outage) nao passa por
      # aqui, e essa classe continua coberta so pelo `S2`.
      - name: Canal de falha — registra em Issue rotulada
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 dev/ci_report_workflow_failure.py \
            --workflow automerge-watchdog.yml --label ops-train
