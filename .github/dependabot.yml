# Dependabot — atualização automática de dependências.
#
# Estratégia: agressivo em patch/minor (auto-mergeable quando CI verde),
# manual em major (PR fica open para review).
#
# Updates abrem PR contra `main` com label `dependency` (já criada via
# Onda 2) e prefixo `chore(deps):` no commit. O labeler do pr-quality.yml roda
# com `sync-labels: true` e é quem decide as labels que declara: ele mantém
# `dependency` e `dependabot` em todo branch `dependabot/…` por `head-branch`.
# `dependabot` é a isenção do stale.yml e não entra aqui em `labels:`, porque
# a fonte é uma só (.github/labeler.yml).

version: 2
updates:
  # ----------------------------------------------------------------------
  # Python — pipeline + backend (ADR-254)
  #
  # Sources são requirements.in (/) + backend/requirements.in. O lock de prod
  # é combinado cross-dir (requirements.lock único) e NÃO é auto-regenerado
  # pelo Dependabot — ele sobe o piso no .in; quando o piso novo fica acima do
  # pin do lock, o hook check_lockfile_sync reprova o Lint até alguém regenerar
  # o .lock (runbook python_dependencies.md). Até 2026-10-09 o hook só conferia
  # presença e esses PRs passavam verdes (ADR-254 §Emenda 2026-10-09).
  # Gate intencional: upgrade nunca entra sem revalidação amd64.
  #
  # UMA entrada só: a `/` cobre os dois .in (o log do updater roda
  # `pip-compile ... backend/requirements.in`). A `/backend` saiu em 2026-10-09:
  # ficou sem job de 07-28 a 10-09 e, no primeiro job, duplicou os PRs da `/`
  # (#2103≡#2104, #2105≡#2108) e partiu a família opentelemetry entre as duas
  # (#2101/#2102). Não a recrie.
  # ----------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    # 8 e não 5: esta entrada passou a cobrir os dois .in (eram 5 + 5).
    open-pull-requests-limit: 8
    labels: ["dependency", "area:pipeline"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Sem grupo nomeado: até 2026-10-09 havia `pytest` (`pytest*`) e
    # `ruff-and-types`. O primeiro perdia todo membro para o catch-all abaixo
    # (curinga vale ~100, grupo sem `patterns` vale 500; ver o comentário da
    # entrada /frontend) e o segundo não casava nenhuma dep dos `.in`.
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
        # Excluir dos grupos as deps que historicamente quebram (LLM SDKs,
        # SQLAlchemy, Pydantic) — major e minor ficam em PR isolado para
        # review caso-a-caso.
        exclude-patterns:
          - "anthropic"
          - "openai"
          - "sqlalchemy"
          - "pydantic"
          - "alembic"
          - "celery"
          - "fastapi"
    ignore:
      # redis acima do teto do kombu[redis] (celery[redis] → kombu 5.6.x pede
      # redis<6.5). O updater pergunta se `redis==<último>` resolve; a resposta
      # é não, mas o pip 26 dele não a prova: desce o wrapt até o sdist 1.13.3,
      # cujo build quebra, e o job inteiro sai `failure` (08-31 → 10-09). O
      # `versions` espelha o teto do kombu instalado pelo lock —
      # tests/dev/test_dependabot_redis_ceiling.py reprova quando ele mudar.
      - dependency-name: "redis"
        versions: [">=6.5"]
      # litellm congelado em 1.97 por decisão de produto (2026-10-09, #2135). É o
      # gateway de TODAS as chamadas LLM do pipeline (extrações E1.5/E1.6/E2 e
      # parecer), e o CI só as exercita com mock, então um bump muda o
      # comportamento sem sinal. A partir de 1.98 ele traz boto3/botocore (~100 MB,
      # AWS) sem uso no produto. `update-types`, e não regra nua: security updates
      # seguem abrindo. Retomar quando houver advisory, quando faltar um provider ou
      # feature, ou num upgrade deliberado validado com run real (pipeline-review).
      - dependency-name: "litellm"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # instructor: mesmo caminho do litellm (é ele que o litellm_client usa
      # para o structured output de toda chamada LLM). Mesma regra e mesma
      # condição de retomada.
      - dependency-name: "instructor"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # numpy: o bump é evento de rebaseline do cone Monte Carlo (ADR-360 item 6
      # — o bit stream do Generator só é garantido no mesmo X.Y), não upgrade
      # silencioso. E o numpy ≥2.5 exige Python ≥3.12, enquanto o updater resolve
      # em 3.11 (pyproject `requires-python >=3.11`): um piso 2.5 quebraria a
      # entrada. Security updates seguem abrindo.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # Família opentelemetry-*: sem grupo que a pegasse, cada release abria até
      # 7 PRs de piso, um por membro (#2101/#2102 subiam um cada), e a família é
      # acoplada por `==` — um membro sozinho não resolve contra o lock. Um grupo
      # `opentelemetry-*` perderia os membros para o catch-all (ver o comentário
      # da entrada /frontend), e o lock combinado é regenerado à mão de qualquer
      # jeito. Só as sentinelas api (core 1.x) e
      # instrumentation-fastapi (contrib 0.Xb) recebem version update; o PR delas
      # sobe a família inteira (runbook python_dependencies.md §Uma entrada pip e
      # a família opentelemetry). `update-types`, e não regra nua: security
      # updates seguem abrindo. tests/dev/test_dependabot_otel_sentinels.py
      # amarra esta lista ao .in.
      - dependency-name: "opentelemetry-sdk"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "opentelemetry-exporter-otlp-proto-http"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "opentelemetry-instrumentation-sqlalchemy"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "opentelemetry-instrumentation-celery"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "opentelemetry-instrumentation-logging"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # playwright: sobe junto com o @playwright/test do /frontend, no mesmo PR
      # (hook playwright-parity: o PDF de prod sai do Chromium do playwright
      # Python, e o print-visual valida com o do frontend). A sentinela é o PR
      # npm, que sai avulso; aqui, um PR pip sozinho só nasceria vermelho e
      # ocuparia vaga. `update-types`: security updates seguem abrindo.
      # tests/dev/test_check_playwright_parity.py amarra os dois lados.
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # ----------------------------------------------------------------------
  # npm — frontend
  # ----------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependency", "area:frontend"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Dep que casa dois grupos fica só no "mais específico" (dependabot-core,
    # PatternSpecificityCalculator): nome exato vale 1000, grupo sem `patterns`
    # (o catch-all) vale 500 e padrão com curinga vale ~100. Grupo com
    # `update-types` disjunto não compete. Até 2026-10-09 os grupos
    # `eslint-and-types` e `vitest-and-test` tinham só curinga e nunca
    # receberam nada: o patch/minor caía no catch-all e o major saía avulso. O
    # #2129 subiu o vitest 3→5 sem o @vitest/coverage-v8, e os dois PRs ficaram
    # vermelhos até o #2060 humano. O hook `dependabot-groups` reprova o grupo
    # que não recebe o que promete.
    groups:
      # Patch, minor e major, num PR só: React major pede @types/react major.
      # Disjunto do catch-all pelo `exclude-patterns` dele.
      next-and-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      # Famílias que sobem na mesma versão saem juntas no major. São
      # `update-types: [major]`, disjunto do catch-all, e por isso não competem
      # com ele (modelo do actions-first-party-major). O patch/minor delas segue
      # no catch-all. Limite: família resolve pacote que sobe junto, não peer
      # atrasado. O eslint 10 segue vermelho enquanto os plugins não aceitarem
      # o eslint 10 no peer, e o minor que traz esse suporte cai no catch-all,
      # então a ordem de merge importa. O major de @types/node (node-version-
      # parity) não casa nenhuma família e sai avulso, vermelho até o .nvmrc
      # subir.
      vitest-family:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]
      # #2182: o @vitejs/plugin-react 6 pede vite ^8 (ERESOLVE com o vite 6).
      vite-family:
        patterns: ["vite", "@vitejs/*"]
        update-types: ["major"]
      eslint-core:
        patterns: ["eslint", "@eslint/js"]
        update-types: ["major"]
      typescript-eslint:
        patterns: ["@typescript-eslint/*"]
        update-types: ["major"]
      patch-and-minor:
        update-types: ["patch", "minor"]
        exclude-patterns:
          # next-and-react leva os três tipos destes.
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          # tailwindcss sai em PR próprio, inclusive no patch/minor.
          - "tailwindcss"
          # Sentinela do par com o `playwright` do pip (hook playwright-parity).
          # No catch-all, o minor dele fica vermelho até o lado pip subir e
          # prende o PR de patch/minor inteiro. Avulso, o PR é completado à mão
          # com o lado pip (runbook python_dependencies.md).
          - "@playwright/test"
    # Majors pausados (ADR-449). O peer de um vizinho no lock barra o major, e o
    # PR do Dependabot só ficaria vermelho, ocupando vaga. `versions`, e não
    # `update-types`, para segurar só o major travado. Os quatro são
    # devDependencies fora do bundle, e o `npm audit` do security.yml segue
    # vendo CVE neles (a doc não diz se o `ignore` por `versions` segura
    # security update). Cada pausa tem linha em
    # dev/check_dependabot_major_pauses.py, que reprova quando o peer libera o
    # major (gatilho) ou o prazo vence.
    ignore:
      # eslint 10 (#2232, 2026-10-09): o eslint-plugin-react@7.37.5 aceita até
      # ^9.7 e não tem release desde 2025-04. O ESLint 9 é EOL desde 2026-08-06,
      # então esperar não é plano: decidido trocar pelo @eslint-react, em PR
      # próprio. Prazo: 2026-11-30.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      # typescript 7 (#2132, 2026-10-09): o @typescript-eslint/*@8.71.1 pede
      # typescript <6.1.0. Gatilho: o typescript-eslint aceitar o 7. A migração
      # valida o `next build` com o 7. Prazo: 2027-01-31.
      - dependency-name: "typescript"
        versions: [">=7"]
      # msw 3 (#2187, 2026-10-09): o @vitest/mocker@5.0.3 declara peer opcional
      # msw ^2.4.9. O npm 11 instala assim mesmo, mas a combinação fica fora do
      # suporte do Vitest. Gatilho: o Vitest aceitar o msw 3. A migração troca
      # `onUnhandledRequest` por `onUnhandledFrame` (tests/setup.ts) e revalida
      # o golden do msw-lint.mjs (ADR-069). Prazo: 2027-01-31.
      - dependency-name: "msw"
        versions: [">=3"]

  # ----------------------------------------------------------------------
  # npm — frontend-ops (console interno, ADR-116)
  #
  # Até 2026-10-08 o diretório só tinha a entrada `docker` abaixo, e diretório
  # sem entrada npm cai no agrupamento de security updates do NÍVEL DO REPO —
  # por isso o #2057 veio como um grupo "npm_and_yarn" que amarrou o fix de
  # `next` (RCE CRITICAL) ao major `tailwindcss` 3→4 e quebrou o build
  # (consertado no #2066). Com entrada própria, este bloco governa.
  #
  # `ops-security` agrupa SÓ o que precisa subir junto (next + react). Todo o
  # resto vira PR de segurança isolado — errar para o lado do PR a mais, não do
  # pacote amarrado. Lista de patterns e não `["*"]` + exclude porque exclude
  # depende de alguém lembrar do próximo major problemático.
  #
  # Até 2026-10-09 havia aqui um `ignore` do major de `tailwindcss`, que segurava
  # o 3→4 até a migração v4 (#2082). Saiu com ela: major de tailwind volta a
  # abrir PR próprio — os grupos abaixo só cobrem patch/minor. Se um major
  # precisar de pausa de novo, `ignore` COM `update-types`: ele vale só para
  # VERSION updates ("Security updates will always be created regardless of the
  # update-types setting"); sem `update-types`, o security update some também.
  # ----------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend-ops"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    labels: ["dependency", "area:frontend"]
    # `prefix: "chore(deps)"` + `include: "scope"` gera `chore(deps)(deps):`
    # (ver bfddc5d0); aqui o escopo vem só do `include`.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      ops-security:
        applies-to: security-updates
        patterns: ["next", "react", "react-dom"]
      ops-next-and-react:
        applies-to: version-updates
        patterns: ["next", "react", "react-dom", "@types/react*"]
        update-types: ["patch", "minor"]
      # Famílias de major, como no /frontend (o #2181 sobe o eslint 10 sozinho).
      ops-eslint-core:
        applies-to: version-updates
        patterns: ["eslint", "@eslint/js"]
        update-types: ["major"]
      ops-typescript-eslint:
        applies-to: version-updates
        patterns: ["@typescript-eslint/*"]
        update-types: ["major"]
      ops-patch-and-minor:
        applies-to: version-updates
        update-types: ["patch", "minor"]
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
    # Majors pausados (ADR-449), como no /frontend; mesmo motivo e mesmo prazo.
    # `versions: [">=7"]`, e não `semver-major`, no typescript: o 5.9→6.0 segue
    # abrindo, para o ops alcançar o 6.0 do frontend.
    ignore:
      # eslint 10 (#2230/#2181, 2026-10-09): eslint-plugin-react@7.37.5 ≤ ^9.7.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      # typescript 7 (#2180, 2026-10-09): @typescript-eslint/*@8.71.1 < 6.1.0.
      - dependency-name: "typescript"
        versions: [">=7"]

  # ----------------------------------------------------------------------
  # Docker — imagens base pinadas por @sha256 (ADR-249 · A20.L2)
  #
  # Re-pina o digest quando sai versão nova da tag. `groups` separa
  # security-updates de version-updates (cadência/SLA distintos):
  #   - security-updates: bump <72h, label `security`, review prioritário.
  #   - version-updates: cadência semanal, agrupado por diretório.
  #
  # AUTO-MERGE: NENHUM bump Docker entra por auto-merge enquanto L5 (Trivy
  # image scan blocking, ADR-251) não estiver em CI. Re-pin de digest do
  # MESMO tag NÃO é auditável só pelo diff (tag é mutável; digest novo pode
  # trazer CVE novo) → sem scan, todo bump é review manual. Pós-L5:
  # auto-merge só para version-update:semver-patch + digest, com Trivy
  # retornando 0 HIGH/CRITICAL no PR. Detalhe em ADR-249.
  # ----------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependency", "area:docker"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-version:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/pipeline-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependency", "area:docker"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-version:
        applies-to: version-updates
        patterns: ["*"]

  # Major do `node` (aqui e em /frontend-ops): sem `ignore: semver-major` de
  # propósito — vira estagnação muda. O hook `node-version-parity` deixa o PR
  # vermelho até `<app>/.nvmrc` (lido pelo setup-node do CI) e o compose de dev
  # subirem junto. NÃO comite no branch do Dependabot (ele para de rebasear e
  # `@dependabot recreate` apaga o commit): abra PR humano com Dockerfile +
  # .nvmrc + compose; o Dependabot fecha o dele sozinho.
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependency", "area:docker"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-version:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/frontend-ops"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependency", "area:docker"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-version:
        applies-to: version-updates
        patterns: ["*"]

  # Imagem dual do shell Go (ADR-150 F1 · ADR-303) — dois FROMs pinados:
  # golang:1.26 (build) + python:3.12-slim (runtime do subprocess). O digest
  # do python DEVE ficar em sync com pipeline-service/Dockerfile (constraint no
  # próprio Dockerfile); Dependabot bumpa por diretório, então re-alinhe os dois
  # PRs no review. Dockerfile criado pós-ADR-249 (#792), ficou sem esta entry.
  - package-ecosystem: "docker"
    directory: "/services/pipeline-service-go"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependency", "area:docker"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-version:
        applies-to: version-updates
        patterns: ["*"]

  # ----------------------------------------------------------------------
  # GitHub Actions — pin updates
  # ----------------------------------------------------------------------
  # CRÍTICO: ci.yml usa SHA-pin para tj-actions e astral-sh/setup-uv
  # (CVE-2025-30066 / mar/2025). Dependabot atualiza esses SHAs quando
  # nova versão sai, e o PR mostra changelog para review.
  #
  # Todo PR desta entrada troca um `uses:` e nasce vermelho no hook
  # `action-inputs` (ADR-320 §Emenda 2026-10-09), porque o ref novo ainda não
  # está em .github/actions.lock.yml. Na branch do PR, rode
  # `python3 dev/refresh_actions_lock.py` e commite o lock: o diff mostra os
  # inputs que a versão nova ganhou e perdeu. Depois desse commit,
  # `@dependabot rebase`/`recreate` fazem force-push e apagam o lock, e o PR
  # BEHIND passa a ser atualizado à mão. `gh pr update-branch` e o trem são
  # recusados quando os commits novos da main tocam `.github/workflows/**`,
  # porque os tokens não têm scope `workflow`. Nesse caso use
  # `git merge origin/main` + push por SSH, ou "Update branch" na UI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependency", "area:ci"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions-patch-and-minor:
        update-types: ["patch", "minor"]
      # Major de actions/* sai num PR só, como o #2084: com PR por major, 9
      # majors pendentes ocupavam o limite de 5 e as de terceiro ficavam sem
      # vaga. Terceiros seguem individuais, porque cada um pede leitura de
      # breaking change e update do registro (ADR-320). Major que quebrar no
      # grupo sai por `ignore:` aqui, com motivo e data, e não por
      # `@dependabot ignore`, que guarda a supressão fora do git.
      actions-first-party-major:
        patterns: ["actions/*"]
        update-types: ["major"]
