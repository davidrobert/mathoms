# Compose de desenvolvimento local — apenas serviços complementares que o dev
# sobe sob demanda (console interno, futuros add-ons). Backend FastAPI e
# frontend cliente continuam rodando via `uvicorn`/`npm run dev` fora do compose.
#
# F7F-Local · ADR-116. Quando F7A.3 consolidar o compose dev completo,
# este arquivo pode ser mesclado ou referenciado via `include:` (Compose v2.20+).

services:
  frontend-ops:
    build:
      context: ./frontend-ops
      dockerfile: Dockerfile
    image: mathoms-frontend-ops:dev
    environment:
      # Backend de ops roda em :8001 por default para não colidir com o
      # backend principal do dev (:8000). Override via env se necessário:
      # INTERNAL_OPS_API_BASE=http://host.docker.internal:8000 docker compose up ...
      INTERNAL_OPS_API_BASE: "${INTERNAL_OPS_API_BASE:-http://host.docker.internal:8001}"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3100:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
