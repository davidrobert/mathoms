# ==============================================================================
# Chart conclusions — templates determinísticos (ADR-117 · ADR-122 · Fase 6)
# ==============================================================================
# Para cada chart_id, define um template de texto curto (1-2 frases) que
# descreve a leitura principal do gráfico. Variáveis `{...}` são interpoladas
# a partir do snapshot E5.
#
# Campos disponíveis por chart:
#   - chart_id: ID do chart (patrimonio_doughnut, etc.)
#   - template: Texto com placeholders {placeholder_name}
#   - fallback: Texto de fallback quando dados insuficientes
#   - required_keys: Lista de chaves (dot-notation) que precisam existir em
#                    data para o template ser aplicado. Se alguma faltar,
#                    usa fallback.
#
# Formatter helpers (aplicáveis em qualquer placeholder):
#   {valor|brl}  → formata como R$ 1.234,56
#   {valor|pct}  → formata como 12%
#   {valor|int}  → formata como inteiro
#   {valor|num}  → formata como número com até 1 casa decimal (ex.: score_gauge)
#
# PARIDADE YAML ↔ TS (ADR-122): o consumidor real é
# frontend/src/components/report/utils/conclusionUtils.ts (BUILDERS + FALLBACKS).
# 8 charts têm builder (interpolam placeholders): patrimonio_doughnut,
# score_gauge, fluxo_mensal, receita_bar, despesas_doughnut, impostos_pj,
# alocacao_atual, alocacao_alvo. Desses, 2 não têm call site vivo via
# deriveChartConclusion (audit-vault r4): score_gauge (S1 lê
# narrativas.score_gauge.conclusion direto) e impostos_pj (S8 substituiu o
# chart por CascataFiscalCard). Os demais caem sempre no FALLBACK — estão
# marcados abaixo com "# fallback-only (Fase 6 — sem builder)". Paridade
# enforçada por dev/check_chart_conclusion_parity.py (pre-commit), incluindo
# a regra 4: id literal em sections/*.tsx ∈ BUILDERS ∪ FALLBACKS.
# ==============================================================================

version: "1.1"

templates:

  # ---- S1 Patrimônio -----------------------------------------------------
  patrimonio_doughnut:
    # A37.l9: base explícita — composicao.pct é relativo ao patrimônio BRUTO
    # (soma das 6 categorias = 100% do bruto), não ao líquido. Paridade com o
    # builder TS (conclusionUtils.ts, C11-F1).
    template: "{top_categoria} representa {top_pct|pct} do patrimônio bruto ({top_valor|brl})."
    fallback: "Distribuição patrimonial por categoria."
    required_keys: ["patrimonio.composicao"]

  waterfall_if:  # fallback-only (Fase 6 — sem builder); placeholders não interpolam
    template: "Desde o início até hoje, o patrimônio acumulou {acumulado|brl} — {progresso_if|pct} do objetivo de independência financeira."
    fallback: "Progresso acumulado rumo à independência financeira."
    required_keys: ["patrimonio.liquido"]

  score_gauge:
    # score.classificacao é opcional — o builder só a adiciona em parêntese
    # condicional quando presente: "... / {max} ({classe})" vs "... / {max}".
    template: "Score atual: {score_valor|num} / {score_max|int} ({score_classe})."
    fallback: "Indicador consolidado da saúde financeira."
    required_keys: ["score.valor", "score.max"]

  # ---- S2 Fluxo de Caixa -------------------------------------------------
  # A40.l3 (ADR-306 D1): mensalização lê `fluxo_caixa.janela_12m`; o bloco
  # `full` só entra com o rótulo que `{janela_escopo}` carrega. Este é o ÚNICO
  # texto de S2 que mensaliza — o chart irmão (`receita_despesa_mensal`)
  # totaliza a janela exibida, sem mensalizar.
  # Dois números, não três: `despesa_mensal_media` é BRUTA (inclui o aporte por
  # ADR-333), logo `receita − despesa` NÃO é "quanto sobra" e não fecha com a
  # taxa de poupança ex-aporte exibida no hero. "Quanto sobra" vive num lugar
  # só, o KPI de folga do card de Consumo Consciente. Emitir capacidade/aporte/
  # sobra aqui exige co-change no E5 — lane A40.l15.
  fluxo_mensal:
    template: "Sobre {janela_escopo}: receita recorrente de {receita_recorrente|brl}/mês e despesa média de {despesa_mensal|brl}/mês."
    fallback: "Receita vs despesa mês a mês."
    required_keys:
      - "fluxo_caixa.janela_12m.receita_recorrente_mensal"
      - "fluxo_caixa.janela_12m.despesa_mensal_media"

  # A40.l3: `janela_12m` não contém `por_fonte` — composição é agregado
  # histórico, que ADR-306 D1 permite full **apenas rotulado**.
  receita_bar:
    template: "{receita_principal_fonte} lidera as receitas ({receita_principal_pct|pct} do total de todo o período analisado)."
    fallback: "Composição das receitas por fonte."
    required_keys: ["fluxo_caixa.por_fonte"]

  # A40.l3: o texto de conclusão do donut e do `receita_despesa_mensal` NÃO foi
  # tocado por esta lane. Os dois citam bases legitimamente distintas (janela
  # ex-aporte por ADR-333 vs bruto de todo o período) e escolher qual base cada
  # texto declara é decisão de DOMÍNIO — lane A40.l15, que detém a base do
  # Consumo Consciente. Defeito medido e herdado por ela: a rosca desenha 50,0%
  # (Moradia, ex-aporte da janela) e a conclusão do MESMO card imprime 43%
  # (base full).
  despesas_doughnut:
    template: "{despesa_top_categoria} concentra {despesa_top_pct|pct} do gasto recorrente."
    fallback: "Distribuição das despesas por categoria."
    required_keys: ["fluxo_caixa.despesas_por_categoria"]

  receita_despesa_mensal:  # fallback-only (Fase 6 — sem builder); placeholders não interpolam
    template: "Ao longo do período analisado, fluxo líquido médio foi {fluxo_medio|brl}/mês."
    fallback: "Receita vs despesa ao longo do tempo."
    required_keys: ["fluxo_caixa.receita_despesa_mensal_detalhado"]

  viagens:  # fallback-only (Fase 6 — sem builder); placeholders não interpolam
    template: "Gasto total com viagens: {viagens_total|brl}."
    fallback: "Orçamento e gastos de viagem no período."

  # ---- S3 Investimentos --------------------------------------------------
  # A11 — consumidos como footer do card alocacao_atual_vs_alvo. Lógica
  # dinâmica em frontend/src/components/report/utils/conclusionUtils.ts
  # (buildDeterministicFooter). Formato imperativo, cap ≤200 chars, cita
  # maior desvio + classe para próximo aporte. Banidos: "recomenda-se",
  # "gradualmente", "sugere-se", "considerar", "talvez", "idealmente".
  alocacao_atual:
    template: "Próximo aporte → <classe subalocada> (<desvio> pp vs alvo)."
    fallback: "Defina sua alocação-alvo em /plano/alocacao para acompanhar desvio."

  # F09 — texto real emitido por buildAlocacaoFooter(data, "aderente"): apenas
  # "Maior desvio: <desvio> pp em <classe>." (sem prefixo "Carteira aderente ao
  # alvo."). Não há branch de aderência — o builder retorna essa string ou null
  # (→ fallback). <desvio> vem formatado com sinal e 1 casa (ex.: "+2,3").
  alocacao_alvo:
    template: "Maior desvio: <desvio> pp em <classe>."
    fallback: "Defina sua alocação-alvo em /plano/alocacao para acompanhar desvio."

  top15_ativos:  # fallback-only (Fase 6 — sem builder); template estático
    template: "Top 15 ativos concentram a maior parte dos investimentos financeiros."
    fallback: "Ativos de maior exposição na carteira."

  cenarios_conjuge:  # fallback-only (Fase 6 — sem builder); template estático
    template: "Cenário de estresse: ausência da renda do cônjuge afeta o prazo até a IF."
    fallback: "Cenário de estresse — sem renda do cônjuge."

  # ---- S4 Real Estate ----------------------------------------------------
  yield_imoveis:  # fallback-only (Fase 6 — sem builder); template estático
    template: "Rentabilidade agregada dos imóveis vs CDI do período."
    fallback: "Rendimento dos imóveis comparado ao CDI."

  # ---- S7 Independência --------------------------------------------------
  projecao_3cenarios:  # fallback-only (Fase 6 — sem builder); template estático
    template: "Três cenários projetados (pessimista, base, otimista) até a meta de independência."
    fallback: "Projeção patrimonial por cenário."

  renda_passiva:  # fallback-only (Fase 6 — sem builder); placeholders não interpolam
    template: "Renda passiva atual: {renda_passiva_atual|brl}/mês. Meta: {renda_passiva_meta|brl}/mês."
    fallback: "Progresso da renda passiva rumo à meta."
    required_keys: ["renda_passiva.atual_mensal"]

  # ---- S8 Tributário -----------------------------------------------------
  impostos_pj:
    template: "Carga fiscal efetiva do ano: {aliquota_pj|pct}."
    fallback: "Composição tributária PJ."
    required_keys: ["ratios.aliquota_efetiva_ir_pct"]

  # ---- S9 Riscos ---------------------------------------------------------
  bubble_riscos:  # fallback-only (Fase 6 — sem builder); template estático
    template: "Mapa de riscos consolida probabilidade × impacto dos pontos críticos identificados."
    fallback: "Matriz de riscos priorizados."

  # ---- S10 Síntese -------------------------------------------------------
  top5_decisoes:  # fallback-only (Fase 6 — sem builder); template estático
    template: "5 decisões de maior impacto para os próximos 90 dias."
    fallback: "Próximas decisões de alto impacto."

  # ---- USA ---------------------------------------------------------------
  custos_f1f2:  # fallback-only (Fase 6 — sem builder); template estático
    template: "Custos mensais estimados para estrutura F1/F2 no projeto EUA."
    fallback: "Custos de mudança EUA."

  cenarios_cambiais:  # fallback-only (Fase 6 — sem builder); template estático
    template: "Sensibilidade do plano a variações cambiais."
    fallback: "Cenários cambiais considerados."
