# ==============================================================================
# Parecer do Planejador (E6) — manifest declarativo F5 (ADR-200)
# ==============================================================================
# Espelha o pattern de config/prompts/section_summaries.yaml (ADR-144).
# Define a projeção do E5 (analise_financeira-5_analysis.json) que vira
# exec context destilado do parecer + tools de drill-down (ADR-203).
#
# DSL declarativa pura:
#   - JSONPath subset: $.field, $.nested.field, $.array[*].field
#   - Proibido: $..*, $..[?(...)], filtros, regex em path
#   - Format hints fechados: raw | brl | pct | percent2 | int | string | iso_date
#   - Null/empty/missing policies: skip | placeholder | error
#   - SEM Jinja, SEM {{}}, SEM if/when (CTO ADR-200 §4)
#
# Coverage gate (dev/check_planner_manifest_coverage.py) cruza:
#   1. Paths daqui ↔ schema E5 (config/schemas/e5_analysis.schema.json)
#   2. aligned_with_layout ↔ section_ids em config/report_layout.yaml
#   3. Drift do E5 derivado do diff contra HEAD — warning quando o schema
#      muda e este manifest não (ADR-200 §D3.3; sem baseline em disco)
#
# Schema deste arquivo: docs/_schemas/note-planner.schema.json.
#
# Bump de `version`:
#   - manifest_version registra-se no aggregate PlannerReview (auditoria)
#   - cache Redis tem manifest_version na chave (bump invalida)
#   - ADR breaking quando DSL muda; tunning de paths/labels é editorial
# ==============================================================================

# 1.5 — A26.l1 (ADR-279 §E): catálogo de citação (citation_catalog) injeta as
# folhas monetárias citáveis no exec context; bump invalida cache Redis.
# 1.4 — ADR-290 F2: hints de valor determinístico (saude_balanco +
# independencia_financeira); bump invalida cache Redis (prompt novo).
# 1.6 — KR1 (A27): pureza monetária da prosa — persona R22 + reconciliação R17 +
# diagnostico_geral sem R$ inline (fecha number_in_prose; conforma ADR-296).
# 1.7 — A28.l6 (ADR-240): projeta $.protecao_patrimonial em riscos_protecao +
# seção no drill-down; apólices deixam de aparecer em campos_faltantes.
# 1.8 — A28.l11: guardrails pós-LLM — projeta premissas_economicas.status
# (confiança rebaixada sob premissa fallback do Monte Carlo) + dependentes
# dedicado em previdencia_irpf (path canônico $.irpf_kpis.dependentes) + hint
# TRS status='suspeito' (consome flag da A28.l2); bump invalida cache Redis.
# 1.9 — R3.3 (dogfood): concentração imobiliária cita SSOT de risco
# ($.ratios.concentracao_imobiliaria, base carteira produtiva, ADR-340), não a
# composição da tabela de classes; severidade Alta (não Crítica) em ~60%, meta
# <50%. PE-01: reserva/pgbl/irpf renderizados key_value (zeros estruturais não
# truncados). PE-04: denominador único de cobertura de renda passiva (essencial
# vs média explícito). FP-04: PGBL com limite=0 é confirmação, não "investigar
# do zero". CTO-03 (ADR-332): sanitizer de PII no boundary do parecer (nome→papel)
# antes do cache; bump invalida cache Redis.
# 2.0 — ADR-341 (A37.l1 PR-2b): contrato do exec context. Budget 16KB +
# eviction determinística por seção (eviction_priority: 1 = mais importante;
# excedeu budget → seção INTEIRA de maior número sai primeiro, com marcador
# nomeando as removidas — nunca corte no meio de seção). Blocos densos
# fluxo_caixa/consumo_consciente saem de dump scalar cru (15-17K chars
# truncados em 300) para campos declarados key_value; protecao_patrimonial e
# ratios completos viram flatten key_value (apolices_vigentes/gap_qualitativo
# e caudas de ratios deixam de ser cortados). _short vira safety-net com
# max_chars declarável por bloco. narrative_hints saem do corpo orçado
# (anexados após o cap, padrão do citation catalog). Bump invalida cache Redis.
# 2.0.1 — A37.l7 PR-2 (DE-04): shape novo de $.passive_income projetado no
# bloco "Renda passiva projetada" — o dict renda_passiva_por_fonte_brl vira
# auto-conservativo (Σ == headline, só yield recorrente); os componentes
# excluídos da TRS migram para irmãos explícitos renda_ativa_pj_excluida_brl
# (ADR-191) e ganho_capital_excluido_brl (ADR-336). Bump invalida cache Redis.
# 2.0.2 — A37.l9 (FIN-07+CTO-09 · CTO-04+PE-05): bases e denominadores
# canônicos rotulados. tabela_classes declara base "% do total investido" +
# coluna "% da carteira financeira" (pct_carteira_financeira, ex-imóveis
# físicos); projeta $.investimentos.total_financeiro/fonte. Projeta
# $.exposicao_cambial (total_brl/pct_investivel_financeiro/tier) — conceito
# DISTINTO de alocação internacional (dois números, duas bases; nunca fundir).
# Hints: peso de classe financeira cita-se da carteira financeira, nunca de
# base com imóvel físico; alíquota rotulada "efetiva (blended)". Bump invalida
# cache Redis.
# 2.0.3 — A40.l28 PR-A (ADR-369 D1): o cone de IF renomeou as chaves do payload
# (percentil → cenário nomeado; `horizonte_*` → `horizonte_simulado_*`), e nomes
# mais longos inflaram o prefixo escalar de $.if_monte_carlo de 369 → 475 chars
# no pior caso — `max_chars` sobe 380 → 490. Custo permanente de contexto num
# bloco de eviction_priority 8, aceito porque o nome antigo apontava para o lado
# oposto da legenda do gráfico. Bump invalida cache Redis (o rename já invalida
# pelo hash do E5; este bump não cobra a frota de novo).
# 2.0.4 — A40.l28 PR-B (ADR-369 D2): a probabilidade do cone passa a medir o
# prazo DECLARADO pela família, e o bloco publica a proveniência do alvo
# (`prazo_declarado_anos`/`ano_alvo_declarado`/`declarado_em`/motivo). Prefixo
# escalar 475 → 633 chars no pior caso; `max_chars` 490 → 650. As chaves
# `prob_if_ate_idade_meta`/`idade_meta_usada` saem do catálogo de citação (as
# sucessoras não contêm token monetário — medido). Bump invalida cache Redis.
# 2.1.0 — PE-3 (r7): projeta $.composicao_familiar (cadastro civil: papel +
# faixa etária em faixa_ref = 31/12 do ano-base fiscal) co-locado com
# $.irpf_kpis.dependentes em previdencia_irpf — os dois lados da família
# evictam juntos. Hint 'não existe $.composicao_familiar no E5' virou falso e
# foi substituído por hint factual dos dois domínios + o que o par sustenta.
# 2.0.6 — FP-5A (ADR-402): `previdencia_pgbl.limite_pgbl_anual` passa a carregar
# o TETO e nunca mais vale 0; o restante mora em `capacidade_restante_anual` e a
# razão de cada ausência em `motivo_ausencia`. O hint que instruía sobre
# `limite_pgbl_anual=0` apontava para um valor que deixou de existir.
# 2.0.5 — A40.l49 PR1 (ADR-296 emenda): citation_labels path→{rotulo_id,label};
# pairing do verificador deixa o root e passa a cruzar rotulo ↔ rotulo_id do
# mapa. Hints de emissão alinhados (rotulo = id da linha, não o grupo).
# 2.2.0 — A40.l83 (RV8-07): o catálogo passa a ser SEMEADO pelas folhas R$ que o
# corpo renderiza, e só depois pelas `_PRIORITY_ROOTS`. Medido no E5 real do run
# r8: as raízes visíveis e as priorizadas não tinham UMA interseção — 0 de 36
# folhas visíveis tinham rota de citação, e o catálogo colapsava em 2 raízes cuja
# cardinalidade escala com o cliente (quem tem mais dívidas nunca via
# investimentos). Semear leva a 52,8% no mesmo orçamento; com `max_bytes` 2400,
# a 86,1%. Subir bytes SEM semear compra 25% a 3,1× o orçamento.
# 2.3.0 — A40.l83 (RV8-05): projeta os seis campos de incerteza que existiam no E5
# e que o manifest (whitelist) nunca declarou — investimentos_nao_atribuidos,
# cobertura_investimentos, nao_classificado_pct, diagnostico_confianca,
# guarda_de_sinal e pl_ressalva. Medido no run r8: o modelo ressalvou 3 de 3
# lacunas declaradas e 0 de 1 não declarada, e o diagnóstico estava em
# `insuficiente` (30,7% de despesa não identificada) sem que o parecer soubesse.
# Nenhum limiar novo: os hints consomem o veredito da ADR-353 e da ADR-394 §Emenda.
# 2.4.0 — A40.l89 (#1772, [[ADR-399]] D1): bump ATÔMICO com `PROMPT_VERSION` e
# `_SCHEMA_VERSION` quando `metricas[].target`/`valor_atual`/`nome` saíram do tool
# schema e o alvo passou a ser derivado. Nenhuma linha do manifest mudou: o bump existe
# porque o cache é chaveado por `manifest_version` e o contrato do output mudou.
# Backfillado em 2026-08-28 (A40.l93) — 2.4.0 e 2.5.0 subiram sem linha aqui, e
# `manifest_version` é persistido no aggregate `PlannerReview` para AUDITORIA: duas das
# três últimas versões auditáveis não tinham significado registrado em lugar nenhum.
# 2.5.0 — A40.l80 (#1780, [[ADR-412]] §D7): o manifest para de reensinar o limiar na
# label. A do `tier` entregava "verde >=10% / amarelo 5-10% / vermelho <5%" ao lado do
# `pct` cru — régua e número juntos, e o modelo declarava conformidade sozinho. O limiar
# tem leitor único ([[ADR-399]]); repeti-lo aqui era a quarta cópia. Junto, a base do
# pct passa a ser declarada na própria label, e entram as duas folhas de atribuição
# incompleta da carteira.
# 2.6.0 — A40.l93 (R1 do §Fecho da A40.l89): `diagnostico_confianca` entra no enum de
# `get_e5_section`. MINOR pela ADR-233 ("regra adicional não-breaking"), não patch: muda
# o que o resolver consegue resolver. Precedente deste arquivo não serve de árbitro —
# 2.0.2 projetou uma seção inteira nova como PATCH e 2.5.0 foi correção de label como
# MINOR; os dois não podem estar certos sob a mesma ADR.
#
# Este bump COBRA a frota, e a diferença com o 2.0.3 é declarada: lá o rename já
# invalidava pelo hash do E5; aqui não há nada mais invalidando, então cada
# (workspace, snapshot E5) que pedir parecer dentro dos 7 dias regenera uma vez. É o
# preço de a whitelist ter contradito o manifest, e procurar caminho mais barato seria
# o defeito N2 pela outra ponta.
# 2.8.0 — A40.l94 ([[ADR-422]], RR6-01): `teto_sugerido` sai do exec context porque sai
# do payload. Ele era `despesa_recorrente × 1,15` sobre base BRUTA e o modelo o recebia
# rotulado "Teto sugerido de consumo mensal": no dogfood, R$ 45.519,51 contra despesa
# real de R$ 72.459,30/mês — o parecer ancorava conselho de contenção num teto 37%
# abaixo do gasto observado. MINOR pela mesma leitura da 2.5.0 (remoção de régua da
# label, não quebra de contrato de output). A `folga_mensal` que fica ao lado mudou de
# VALOR sem mudar de nome — passou a ser a taxa de poupança da janela —, e é por isso
# que o bump cobra a frota: parecer em cache dentro dos 7 dias citaria a folga velha.
version: "2.8.0"
output_schema: "config/schemas/parecer_planejador.schema.json"
input_schema_ref: "config/schemas/e5_analysis.schema.json"

# ------------------------------------------------------------------------------
# Persona (ADR-201) — orchestrator lê, hash registrado no aggregate
# ------------------------------------------------------------------------------
persona:
  path: "config/agents/planner_persona.md"
  required_frontmatter_fields:
    - id
    - version
    - methodology_anchors
    - persona_hash

# ------------------------------------------------------------------------------
# Hints globais (registro consultivo) — aplicáveis a todas as seções
# ------------------------------------------------------------------------------
narrative_hints_global:
  - "Sigilo §13: NUNCA cite 'Perini', 'Cerbasi', 'AUVP', 'Bruno Perini', 'Gustavo Cerbasi', 'Raul Sena' no body textual. Use ancora_metodologica (enum interno) para indicar a metodologia."
  - "NUNCA prescreva ativo específico (ticker). Parecer é orientativo metodológico, não recomendação de investimento."
  - "Quando confiança não for 'alta', evite linguagem prescritiva — descreva o quê, não o porquê especulado."
  - "Cite apenas números/categorias/fatos presentes no exec context ou retornados por tool."
  - "Citação determinística (ADR-296 · persona R22): NUNCA escreva valores em R$ na prosa — nem 'R$ 720.000', nem '720 mil reais', nem por extenso, INCLUSIVE quando o valor é premissa de um cálculo (ex. renda-base de um percentual). Descreva o conceito; o sistema renderiza o número a partir do path. Para cada valor que fundamenta um Risco/Sugestão, emita uma âncora em ancoras:[{path, rotulo}] copiada de UMA linha do catálogo 'evidencia_paths_disponiveis': path = o path daquela linha; rotulo = o rotulo_id entre colchetes da mesma linha (identificador ASCII, não o texto do chip). Escolha a linha pelo CONCEITO da frase (path e rotulo vêm da MESMA linha). Máximo 3 âncoras por item. Se o conceito não está no catálogo, NÃO ancore — declare em campos_faltantes_pediria_se_iterasse."
  - "Convenção numérica de percentual (ADR-209): TODOS os campos *_pct, pct_*, percentual_* são valores ABSOLUTOS (44.7 = 44,7%; nunca 4470% nem 0,447%). Valores > 100 são válidos quando semanticamente possível (cobertura_despesa_essencial_pct: 350.0 = renda passiva cobre 3,5× a despesa). Valores < 1 são válidos (valor_pct: 0.5 = 0,5% a.a.). Exceção: ratios.rentabilidade_pct, ratios.aliquota_efetiva_ir_pct, irpf_kpis.aliquota_sobre_tributavel_pct, irpf_kpis.aliquota_sobre_total_pct vêm como STRING ('22.50' ou 'N/D') — faça cast antes de operar; trate 'N/D' como indisponibilidade."
  - "Tipagem de impacto (ADR-220): em impacto_estimado.tipo, declare a natureza do valor: 'patrimonio_alvo' (estoque-alvo necessário, ex. 25× despesa anual para IF), 'fluxo_anual' (renda anual desejada ou despesa anual evitada), 'economia_anual_irpf' (PGBL, dedutíveis), 'gap_protecao' (capital de seguro faltante), 'outro' (não-monetário ou casos especiais). Para sugestões com tema_canonico='Renda passiva', emita SEMPRE pelo menos uma sugestão com tipo='patrimonio_alvo' calculado pela regra metodológica (estoque, não fluxo). Opcionalmente, emita também uma sugestão-irmã com tipo='fluxo_anual' descrevendo a renda projetada. NUNCA marque o fluxo anual como 'patrimonio_alvo' — isso confunde estoque com fluxo no produto."

# ==============================================================================
# CONTEXT SECTIONS — projeção do E5 → exec context destilado
# ==============================================================================
# Ordem importa (espelha a ordem do relatório). NÃO incluímos:
#   - S_parecer: é OUTPUT, não input (não pode auto-referenciar)
#   - narrativas do E5: LLM-on-LLM amplifica erro (DE-I.8)
#   - APP_A..E: apêndices não recebem SuggestionCallout
# ==============================================================================
context_sections:

  # --------------------------------------------------------------------------
  # 1) Patrimônio (S1) — composição + saúde estrutural
  # --------------------------------------------------------------------------
  # eviction_priority (ADR-341 D2): 1 = mais importante (última a sair do corpo
  # orçado). Ranking de domínio: síntese/score > reserva+dívidas (red lines
  # RL1/RL2) > fluxo > patrimônio > previdência/IRPF > proteção > ratios >
  # IF > detalhe de carteira > plano de ação (referência).
  - id: "patrimonio"
    title: "Patrimônio e Composição"
    aligned_with_layout: "S1"
    eviction_priority: 4
    blocks:
      - format: "key_value"
        title: "Visão geral"
        fields:
          - path: "$.patrimonio.bruto"
            label: "Bruto"
            format: "brl"
            on_null: "placeholder"
          - path: "$.patrimonio.liquido"
            label: "Líquido"
            format: "brl"
            on_null: "placeholder"
      # A37.l9: base declarada por coluna — pct = % do TOTAL INVESTIDO
      # (financeiro + imóveis de investimento; fonte IRPF 31/12);
      # pct_carteira_financeira = % da CARTEIRA FINANCEIRA (ex-imóveis
      # físicos; "—" na linha Imóveis Investimento, fora da base).
      - format: "table"
        title: "Alocação por classe (base: total investido — inclui imóveis de investimento; fonte IRPF 31/12)"
        path: "$.investimentos.tabela_classes[*]"
        columns:
          - {path: "categoria", label: "Classe", format: "raw"}
          - {path: "valor", label: "Valor", format: "brl"}
          - {path: "pct", label: "% do total investido", format: "percent2"}
          - {path: "pct_carteira_financeira", label: "% da carteira financeira", format: "percent2"}
        max_rows: 10
      - format: "key_value"
        title: "Bases da tabela de classes (decomposição A37.l9)"
        fields:
          - {path: "$.investimentos.total", label: "Total investido (financeiro + imóveis de investimento)", format: "brl"}
          - {path: "$.investimentos.total_financeiro", label: "Carteira financeira da tabela (ex-imóveis físicos)", format: "brl"}
          - {path: "$.investimentos.total_imoveis_investimento", label: "Imóveis de investimento na tabela", format: "brl"}
          - {path: "$.investimentos.fonte", label: "Fonte da tabela (irpf_bens = foto 31/12; difere do patrimonio)", format: "string"}
      # A37.l9 (CTO-04/PE-05): exposição cambial ≠ alocação internacional.
      # A40.l80 · [[ADR-412]] §D7: o manifest PARA de reensinar o limiar na label. A
      # label do `tier` entregava "verde >=10% / amarelo 5-10% / vermelho <5%" ao lado
      # do `pct` cru — o modelo recebia régua e número e declarava conformidade
      # sozinho, fabricando "faixa verde" que o campo recusa (o `tier` é constante
      # `indeterminado` desde o #1568). O limiar tem LEITOR ÚNICO ([[ADR-399]]:
      # `kpi_target_catalog`); repeti-lo aqui era a quarta cópia, que é exatamente o
      # que aquele módulo existe para impedir. E a base do pct passa a ser declarada
      # na própria label, como o hint "rótulo de base obrigatório" (A37.l9) já exige
      # de todo percentual: ela é a carteira CHEIA e inclui a fatia sem dono.
      - format: "key_value"
        title: "Exposição cambial (posições em moeda estrangeira — caixa FX + ativos com lastro internacional)"
        fields:
          - {path: "$.exposicao_cambial.total_brl", label: "Exposição cambial APURADA (só caixa em ME; lastro de carteira fica fora)", format: "brl"}
          - {path: "$.exposicao_cambial.pct_investivel_financeiro", label: "% da carteira financeira cheia (INCLUI a fatia sem dono atribuído)", format: "percent2"}
          - {path: "$.exposicao_cambial.tier", label: "Tier apurado pelo motor (rótulo, não limiar)", format: "string"}
      # A40.l83 · RV8-05: o manifest é WHITELIST — o que não está declarado não entra.
      # Os seis campos de incerteza construídos ao longo da A40 existiam no E5 e nenhum
      # era projetado. Medido no run r8: o modelo ressalvou 3 de 3 lacunas que o payload
      # declarou e 0 de 1 da que ele não declarou — o defeito é de PROJEÇÃO, não de
      # prompt, e consertar o prompt seria consertar o lado errado. Nenhum limiar novo
      # é inventado aqui: `diagnostico_confianca.nivel` é o veredito da [[ADR-353]] e
      # `guarda_de_sinal.motivo_supressao` é o da [[ADR-394]] §Emenda (sobrevivente
      # negativo suprime a prescrição). NÃO confundir com o `motivo_supressao` de
      # `$.goals.alocacao_alvo.derived`, que é da [[ADR-400]] e é outro campo.
      # O parecer passa a RECEBÊ-LOS.
      - format: "key_value"
        title: "Cobertura e incerteza do retrato (o que os números NÃO cobrem)"
        fields:
          - {path: "$.patrimonio.investimentos_nao_atribuidos", label: "Investimentos sem dono atribuído", format: "brl"}
          - {path: "$.patrimonio.atribuicao_investimentos.pct_carteira_financeira", label: "% da carteira financeira sem dono atribuído", format: "percent2"}
          - {path: "$.patrimonio.atribuicao_investimentos.motivo", label: "Motivo de atribuição incompleta (null = fatia órfã abaixo do piso)", format: "string"}
          - {path: "$.patrimonio.pl_ressalva", label: "Patrimônio líquido sob ressalva", format: "raw"}
          - {path: "$.investimentos.nao_classificado_pct", label: "% da carteira que nenhum degrau classificou", format: "percent2"}
          - {path: "$.diagnostico_confianca.nivel", label: "Confiança do diagnóstico — veredito ordinal do motor (ADR-353)", format: "string"}
          - {path: "$.diagnostico_confianca.share_nao_identificado_pct", label: "% de despesa não identificada", format: "percent2"}
          - {path: "$.patrimonio.guarda_de_sinal.modo", label: "Guarda de sinal — modo", format: "string"}
          - {path: "$.patrimonio.guarda_de_sinal.cobertura_completa", label: "Guarda de sinal — cobertura completa", format: "raw"}
          - {path: "$.patrimonio.guarda_de_sinal.motivo_supressao", label: "Motivo de supressão da prescrição (null = nada suprimido)", format: "string"}
      # Sem a coluna `membro`: a postura de PII deste manifest é PAPEL, não identidade
      # (ver $.composicao_familiar, que projeta papel + faixa etária e nenhum nome). O
      # que sustenta a ressalva é status/fonte/frescor, não quem é o titular.
      - format: "table"
        title: "Cobertura de investimentos por titular (fonte e frescor do dado que sustenta o retrato)"
        path: "$.patrimonio.cobertura_investimentos[*]"
        columns:
          - {path: "status", label: "Status", format: "raw"}
          - {path: "fonte", label: "Fonte", format: "raw"}
          - {path: "frescor", label: "Frescor (ano do dado)", format: "raw"}
          - {path: "motivo", label: "Motivo", format: "raw"}
        max_rows: 8
    narrative_hints:
      - "Leia $.diagnostico_confianca.nivel antes de prescrever: 'insuficiente' torna a prescrição provisória, com ressalva no item; 'parcial' exige ressalva onde a base pesa. É veredito do motor (ADR-353) — não recalcule."
      - "guarda_de_sinal.motivo_supressao não-nulo = prescrição já suprimida a montante (ADR-394): declare o motivo, não reintroduza. Com investimentos_nao_atribuidos>0 ou nao_classificado_pct>0, todo % de carteira declara a incompletude."
      - "Concentração imobiliária = RISCO: cite $.ratios.concentracao_imobiliaria (base carteira produtiva, SSOT ADR-340), NÃO o pct de tabela_classes[imóveis] (COMPOSIÇÃO, base total investido). Dois números legítimos; risco usa o de risco."
      - "Severidade da concentração (ADR-340): ≥50% é ALTA/atenção; crítica só ≥75%. Em ~60% escreva 'Alta', nunca 'Crítica'. Meta: reduzir abaixo de 50% da carteira produtiva via aportes (não '≤40%')."
      - "Rótulo de base obrigatório (A37.l9): todo percentual citado declara a base. Peso de classe financeira (Internacional/RF/Ações/FIIs) sai da coluna '% da carteira financeira' — nunca rotule 'carteira financeira' número de base com imóvel."
      - "Internacional ≠ cambial (A37.l9): alocação internacional = classe Internacional ÷ carteira financeira; exposição cambial = posições em moeda estrangeira ÷ investível financeiro. Dois conceitos, duas bases — cite separados, nunca funda."
      - "Diferencie residência (não gera renda) de imóveis de investimento — não comente residência como investimento."
      - "classification=nu_proprietario (ADR-235): nu-propriedade com usufruto vitalício — ativo ilíquido por contrato civil. Não recomende venda como liquidez; consolidação só com extinção do usufruto (não infira prazo)."

  # --------------------------------------------------------------------------
  # 2) Fluxo de caixa (S2) — dinâmica do período
  # --------------------------------------------------------------------------
  # ADR-341 D3: o dump scalar cru de $.fluxo_caixa (~15K chars) e
  # $.consumo_consciente (~17K) truncava em 300 chars — quem decide o que o
  # LLM vê é o manifest. Campos declarados abaixo; detalhe transacional
  # (charts, tabela_receitas, itens de gasto pontual) fica no drill-down.
  - id: "fluxo_caixa"
    title: "Fluxo de Caixa"
    aligned_with_layout: "S2"
    eviction_priority: 3
    blocks:
      - format: "key_value"
        title: "Fluxo do período completo"
        fields:
          - {path: "$.fluxo_caixa.janela", label: "Janela", format: "string"}
          - {path: "$.fluxo_caixa.janela_meses", label: "Meses na janela", format: "int"}
          - {path: "$.fluxo_caixa.receita_total", label: "Receita total", format: "brl"}
          - {path: "$.fluxo_caixa.receita_recorrente", label: "Receita recorrente", format: "brl"}
          - {path: "$.fluxo_caixa.receita_one_time", label: "Receita one-time", format: "brl"}
          - {path: "$.fluxo_caixa.receita_recorrente_mensal", label: "Receita recorrente mensal", format: "brl"}
          - {path: "$.fluxo_caixa.despesa_total", label: "Despesa total", format: "brl"}
          - {path: "$.fluxo_caixa.despesa_mensal_media", label: "Despesa mensal média", format: "brl"}
          - {path: "$.fluxo_caixa.despesa_mensal_essencial", label: "Despesa mensal essencial", format: "brl"}
          - {path: "$.fluxo_caixa.fluxo_liquido", label: "Fluxo líquido", format: "brl"}
          # Receita por natureza (ADR-330): re-bucketização derivada; soma == receita_total.
          - {path: "$.fluxo_caixa.receita_por_natureza.receita_pj", label: "Receita PJ (pró-labore + lucros)", format: "brl"}
          - {path: "$.fluxo_caixa.receita_por_natureza.receita_clt", label: "Receita CLT", format: "brl"}
          - {path: "$.fluxo_caixa.receita_por_natureza.receita_aluguel", label: "Receita de aluguel", format: "brl"}
          - {path: "$.fluxo_caixa.receita_por_natureza.receita_outras", label: "Receita outras (resíduo)", format: "brl"}
      - format: "key_value"
        title: "Janela 12m (base canônica de mensalização — ADR-306)"
        fields:
          - {path: "$.fluxo_caixa.janela_12m.periodo", label: "Período", format: "string"}
          - {path: "$.fluxo_caixa.janela_12m.n_meses", label: "Meses", format: "int"}
          - {path: "$.fluxo_caixa.janela_12m.receita_recorrente_mensal", label: "Receita recorrente mensal (12m)", format: "brl"}
          - {path: "$.fluxo_caixa.janela_12m.despesa_mensal_media", label: "Despesa mensal média (12m)", format: "brl"}
          - {path: "$.fluxo_caixa.janela_12m.despesa_mensal_essencial", label: "Despesa mensal essencial (12m)", format: "brl"}
          - {path: "$.fluxo_caixa.janela_12m.despesa_consumo", label: "Despesa de consumo (12m, ex-aporte — ADR-333)", format: "brl"}
          - {path: "$.fluxo_caixa.janela_12m.transferencia_patrimonial", label: "Transferência patrimonial/aporte (12m)", format: "brl"}
          - {path: "$.fluxo_caixa.janela_12m.fluxo_liquido", label: "Fluxo líquido (12m)", format: "brl"}
          - {path: "$.fluxo_caixa.janela_12m.taxa_poupanca_recorrente", label: "Taxa de poupança recorrente (12m, %)", format: "percent2"}
          - {path: "$.fluxo_caixa.janela_12m.taxa_poupanca_total", label: "Taxa de poupança total (12m, %)", format: "percent2"}
      - format: "key_value"
        title: "Despesas por categoria (12m)"
        fields:
          - {path: "$.fluxo_caixa.janela_12m.despesas_por_categoria", label: "despesas_por_categoria", format: "raw"}
      - format: "key_value"
        title: "Consumo consciente (diagnóstico de gastos pontuais)"
        fields:
          - {path: "$.consumo_consciente.analise", label: "Análise", format: "string"}
          - {path: "$.consumo_consciente.total_pontuais", label: "Total de gastos pontuais (período)", format: "brl"}
          - {path: "$.consumo_consciente.total_pontuais_janela", label: "Total de gastos pontuais (janela)", format: "brl"}
          - {path: "$.consumo_consciente.equivalente_meses_poupanca", label: "Pontuais da janela em meses de poupança", format: "raw"}
          - {path: "$.consumo_consciente.folga_mensal", label: "Folga mensal", format: "brl"}
          - {path: "$.consumo_consciente.folga_pct", label: "Folga (% da renda recorrente)", format: "percent2"}
          - {path: "$.consumo_consciente.janela", label: "Janela do diagnóstico", format: "string"}
          - {path: "$.consumo_consciente.janela_meses", label: "Meses na janela do diagnóstico", format: "int"}
    narrative_hints:
      - "Ancore na taxa de poupança e no sinal comportamental dominante (consumo consciente)."
      - "Se houver desvio relevante de categoria (despesa fora de teto), mencione qual — despesas_por_categoria (12m) acima traz a base."
      - "Itens individuais de gasto pontual e o detalhe mensal (charts) NÃO estão no contexto — get_e5_section('consumo_consciente') ou ('fluxo_caixa') traz o bloco completo se precisar."

  # --------------------------------------------------------------------------
  # 3) Investimentos (S3) — alocação atual + ranking
  # --------------------------------------------------------------------------
  - id: "investimentos"
    title: "Investimentos — Carteira Financeira"
    aligned_with_layout: "S3"
    eviction_priority: 9
    blocks:
      - format: "table"
        title: "Top ativos (até 15)"
        path: "$.investimentos.top_ativos[*]"
        columns:
          - {path: "posicao", label: "#", format: "int"}
          - {path: "classe", label: "Classe", format: "raw"}
          - {path: "nome", label: "Ativo", format: "raw"}
          - {path: "membro", label: "Membro", format: "raw"}
          - {path: "valor", label: "Valor", format: "brl"}
          - {path: "pct_carteira", label: "% carteira", format: "percent2"}
        max_rows: 15
      - format: "scalar"
        path: "$.investimentos.n_imoveis_total"
        label: "Imóveis cadastrados (residência + investimento)"
        value_format: "int"
        on_null: "skip"
    narrative_hints:
      - "Ancore no gap entre atual e alvo da família — qual classe está sub ou sobrealocada."
      - "Não recomende ativo específico. Comente o comportamento da carteira."

  # --------------------------------------------------------------------------
  # 4) Reserva de emergência + endividamento (entra junto com S1 mas é bloco
  #    estrutural separado no E5)
  # --------------------------------------------------------------------------
  - id: "saude_balanco"
    title: "Saúde de Balanço — Reserva e Dívidas"
    aligned_with_layout: "S1"
    eviction_priority: 2
    blocks:
      # PE-01: key_value achata o dict folha-a-folha — reserva.total_liquida e os
      # níveis não são mais cortados pelo _short(300) do dump raw.
      - format: "key_value"
        title: "Reserva de emergência (E5)"
        fields:
          - path: "$.reserva_emergencia"
            label: "reserva_emergencia"
            format: "raw"
      - format: "key_value"
        title: "Endividamento (E5)"
        fields:
          - path: "$.endividamento"
            label: "endividamento"
            format: "raw"
    narrative_hints:
      - "Reserva < 6 meses → risco severidade Alta no mínimo."
      - "Endividamento > 30% do bruto → risco severidade Crítica."
      # ADR-290 F2 — valor determinístico: o LLM recalculava/arredondava a
      # reserva entre runs (R$ 224k..540k no dogfood); o escalar exato já
      # existe no payload.
      - "Ancore a reserva via ancoras (NÃO escreva o R$ na prosa): path na folha ($.reserva_emergencia.nivel_6_meses, nivel_12_meses, total_liquida), rotulo='reserva_emergencia' — nunca o bloco-pai."

  # --------------------------------------------------------------------------
  # 5) Ratios + rentabilidade (S1/S3 — leitura cruzada)
  # --------------------------------------------------------------------------
  - id: "ratios"
    title: "Indicadores e Rentabilidade"
    aligned_with_layout: "S3"
    eviction_priority: 7
    blocks:
      - format: "scalar"
        path: "$.ratios.rentabilidade"
        label: "Rentabilidade (TRS efetiva + contexto — ADR-191)"
        value_format: "raw"
        on_null: "skip"
        max_chars: 800
      - format: "scalar"
        path: "$.ratios.concentracao_imobiliaria"
        label: "Concentração imobiliária — RISCO (SSOT carteira produtiva, ADR-340)"
        value_format: "percent2"
        on_null: "skip"
      # ADR-341 D3: flatten key_value — o dump raw truncado em 300 chars comia
      # a cauda (aliquotas, janela). Folha "N/D" é ausência (A37.l4), pulada.
      - format: "key_value"
        title: "Bloco ratios completo"
        fields:
          - path: "$.ratios"
            label: "ratios"
            format: "raw"
    narrative_hints:
      - "Concentração como risco: cite o número do bloco escalar acima ($.ratios.concentracao_imobiliaria), não o pct de composição. É percentual — escreva na prosa (ex.: '~60%'); não precisa âncora (catálogo é só monetário)."
      - "Alíquota com base (A37.l9): ratios.aliquota_efetiva_ir_pct é EFETIVA (blended) — IR total ÷ renda total (PF+PJ). Rotule 'efetiva (blended)' ao citar; não confunda com marginal nem com irpf_kpis.aliquota_sobre_tributavel/total_pct."
      - "Cobertura de renda passiva (PE-04): use a base ESSENCIAL (ratios.rentabilidade.cobertura_despesa_essencial_pct), não a despesa média. Rotule explicitamente 'da despesa essencial' — uma cobertura só, consistente."
      - "Se status='sem_irpf' ou 'gerador_zero', NÃO compare com meta — sinalize a indisponibilidade."
      # A28.l11 (consome o flag de sanidade da TRS emitido pela A28.l2 em
      # ratios_calculator — número fora do plausível nunca vira conselho).
      - "Se rentabilidade.status='suspeito', o número da TRS falhou o teste de sanidade — NÃO construa recomendação sobre rentabilidade nem compare com meta; sinalize apenas a inconsistência do dado."

  # --------------------------------------------------------------------------
  # 6) Independência financeira (S7) — projeção + Monte Carlo + cenários cônjuge
  # --------------------------------------------------------------------------
  - id: "independencia_financeira"
    title: "Independência Financeira — Projeção"
    aligned_with_layout: "S7"
    eviction_priority: 8
    blocks:
      - format: "scalar"
        path: "$.if_monte_carlo"
        label: "Projeção IF (Monte Carlo)"
        value_format: "raw"
        on_null: "skip"
        # ADR-361: os 6 campos de cenário+censura e as 2 probabilidades não
        # cabem no cap default de 300 (medido: 320 com cone, 369 com o cone
        # suprimido, onde `motivo_sem_cone` é string longa). Sem este knob a
        # correção de honestidade entraria cortando dado de domínio do contexto
        # do LLM.
        # ADR-369 D1 (A40.l28 PR-A) — remedido nos cinco estados observáveis
        # após o rename: 429 (cone cheio), 426, 422, 475 (cone suprimido), 434.
        # Remedir, não estimar: a estimativa do co-design (+97) não contava os
        # renames de `horizonte_*`, e o valor real foi +106.
        # ADR-369 D2 (PR-B) — remedido de novo nos SETE estados (os cinco acima
        # mais os dois de ausência de prazo): 567, 564, 560, 613, 572, 582 e
        # **633** no pior, que é cone suprimido COM prazo vencido — os dois
        # motivos longos no mesmo payload, combinação que nenhuma estimativa
        # tinha considerado. 650 = pior medido + folga. O bloco foi de 369 para
        # 633 chars (+72%) num `eviction_priority: 8`: é o custo permanente de
        # contexto de nomear o dono da data, aceito porque o número anterior
        # media o modelo contra si mesmo.
        max_chars: 650
      - format: "scalar"
        path: "$.cenarios_conjuge"
        label: "Cenário 'Sem renda do cônjuge' (ADR-166)"
        value_format: "raw"
        on_null: "skip"
      - format: "scalar"
        path: "$.passive_income"
        label: "Renda passiva projetada"
        value_format: "raw"
        on_null: "skip"
      # A28.l11 — status das premissas do Monte Carlo (ADR-219 D5): 'parcial' =
      # pelo menos uma classe sem premissa vigente (projeção corre sob fallback).
      - format: "scalar"
        path: "$.premissas_economicas.status"
        label: "Status das premissas econômicas do Monte Carlo (completo | parcial=fallback)"
        value_format: "string"
        on_null: "skip"
    narrative_hints:
      - "Ao citar prazo, mencione que é projeção sob premissa de retorno real do payload — não invente a taxa."
      # A28.l11 camada pré-LLM (higiene); a garantia determinística vive no
      # orchestrator (parecer_pos_llm_guardrails — rebaixa, nunca bloqueia).
      - "Premissas em fallback: se o status das premissas econômicas for 'parcial', NENHUM risco/sugestão ancorado em $.if_monte_carlo.* pode ter confianca 'alta' — use no máximo 'media' e mencione que a projeção corre sob premissa de fallback."
      - "Cenários cônjuge ausentes (objeto vazio) = workspace solteiro ou casal sem meta IF; não force narrativa."
      # ADR-290 F2 — valor determinístico (par do hint de saude_balanco).
      - "Ancore patrimônio-alvo/renda passiva via ancoras (NÃO escreva o R$ na prosa): path na folha ($.passive_income.*, $.if_monte_carlo.*), rotulo = o rotulo_id da linha do catálogo (não o root da seção)."

  # --------------------------------------------------------------------------
  # 7) Previdência + IRPF (S8 / S_IRPF_RENDA / S_IRPF_OTIMIZACAO)
  # --------------------------------------------------------------------------
  - id: "previdencia_irpf"
    title: "Previdência e Eficiência Fiscal"
    aligned_with_layout: "S8"
    eviction_priority: 5
    blocks:
      # PE-01/FP-04: key_value achata — teto, capacidade restante, motivo_ausencia,
      # status e nota do PGBL + os KPIs de IRPF no fim do bloco não são mais
      # truncados pelo _short(300).
      - format: "key_value"
        title: "Análise PGBL"
        fields:
          - path: "$.previdencia_pgbl"
            label: "previdencia_pgbl"
            format: "raw"
      - format: "key_value"
        title: "KPIs IRPF (alíquota efetiva, deduções, dependentes)"
        fields:
          - path: "$.irpf_kpis"
            label: "irpf_kpis"
            format: "raw"
      # A28.l11 — campo dedicado (não dump raw truncável): ataca a raiz do
      # dogfood 72883bde, onde o LLM pediu $.composicao_familiar.dependentes
      # com o dado presente aqui.
      - format: "scalar"
        path: "$.irpf_kpis.dependentes"
        label: "Dependentes IRPF (count + por_relacao) — path canônico"
        value_format: "raw"
        on_null: "skip"
      # PE-3 (r7): o lado CIVIL da mesma família. Co-locado de propósito — os
      # dois evictam juntos (ADR-341 D2) e nunca sobra um sem o outro, que é o
      # estado que produzia risco Crítico com confiança alta de um lado e
      # oportunidade fiscal com confiança baixa do outro, sem reconciliar.
      - format: "scalar"
        path: "$.composicao_familiar"
        label: "Composição familiar (civil: papel + faixa etária em faixa_ref)"
        value_format: "raw"
        on_null: "skip"
        max_chars: 260
    narrative_hints:
      - "Não opine sobre qual regime tributário escolher — descreva o atual e o gap em relação ao desenho-alvo."
      - "PGBL (FP-04 · ADR-402): campo null de previdencia_pgbl tem razão em motivo_ausencia — leia-a antes de opinar. NÃO proponha 'investigar PGBL do zero' nem aporte PGBL como oportunidade nova."
      - "PGBL: modelo_simplificado = dedução desabilitada pelo MODELO da declaração, não teto consumido. capacidade_restante_anual=0 = teto atingido. regime_fiscal_incompleto retém só a prescrição; teto e restante seguem válidos."
      - "Dependentes, dois domínios: $.composicao_familiar é o cadastro CIVIL do domicílio (papel + faixa etária em faixa_ref = 31/12 do ano-base do IRPF); $.irpf_kpis.dependentes é a contagem FISCAL do ano-base. Os dois podem ser verdadeiros."
      - "Par civil × fiscal: faixa 0-17 ou 18-21 com contagem fiscal zero sustenta subdeclaração (Lei 9.250/95 art. 35). Faixa 22-24 depende de matrícula, que não está no payload: não-conclusivo. Faixa 25-59, 60+ e desconhecida: não-conclusivo."
      - "Papel ascendente não é conclusivo em nenhuma faixa: o critério é teto de rendimento, não idade (art. 35, VII), e declarar obriga a somar os rendimentos dele. Nada no payload sustenta afirmação de superdeclaração."
      - "Pendência regulatória (FBAR/8938 atrasada, contador sem definição) → risco severidade Alta."

  # --------------------------------------------------------------------------
  # 8) Riscos e sucessão (S9)
  # --------------------------------------------------------------------------
  - id: "riscos_protecao"
    # `id` é identidade e NÃO muda; `title` é o vocabulário com que o parecer
    # nomeia a S9 e acompanha o retítulo do layout (A40.l7).
    title: "Riscos e Sucessão"
    aligned_with_layout: "S9"
    eviction_priority: 6
    blocks:
      - format: "scalar"
        path: "$.alertas"
        label: "Alertas estruturais (array)"
        value_format: "raw"
        on_null: "skip"
        max_chars: 800
      # A28.l6 (ADR-240 D8): apólices reais de extract_comprovantes_bens —
      # prêmio anual, % renda (Cerbasi), gaps qualitativos (vida/saúde) e
      # resumos LGPD-safe das apólices por vigência.
      # ADR-341 D3: flatten key_value — o dump raw de ~1.050 chars truncado em
      # 300 cortava apolices_vigentes (começava no char 322) e gap_qualitativo.
      # Identificadores (apolice_numero) redigidos pelo sanitizer (D6, PR-2a).
      - format: "key_value"
        title: "Proteção patrimonial (apólices vigentes, prêmio anual, % renda, gaps vida/saúde)"
        fields:
          - path: "$.protecao_patrimonial"
            label: "protecao_patrimonial"
            format: "raw"
    narrative_hints:
      - "Não prescreva apólice ou seguradora — descreva o gap."
      - "Sem linguagem alarmista. Severidade comunica o peso."
      - "gap_qualitativo com flag=true (vida/saúde) é sinal de AUSÊNCIA de evidência de cobertura — não afirme que o cliente 'não tem' seguro; afirme que não há evidência nos documentos."

  # --------------------------------------------------------------------------
  # 9) Síntese determinística (S10) + comportamento — leitura de conjunto
  # --------------------------------------------------------------------------
  - id: "sintese"
    title: "Síntese e Comportamento"
    aligned_with_layout: "S10"
    eviction_priority: 1
    blocks:
      - format: "key_value"
        title: "Score"
        fields:
          - path: "$.score.valor"
            label: "Valor (0-10)"
            format: "raw"
          - path: "$.score.classificacao"
            label: "Classificação"
            format: "string"
      - format: "scalar"
        path: "$.pontos_fortes"
        label: "Pontos fortes determinísticos (array — referência, não duplique)"
        value_format: "raw"
        on_null: "skip"
      - format: "scalar"
        path: "$.pontos_urgentes"
        label: "Pontos urgentes determinísticos (array — referência)"
        value_format: "raw"
        on_null: "skip"
      - format: "scalar"
        path: "$.equilibrio_cerbasi"
        label: "Equilíbrio presente-futuro (ancora cerbasi)"
        value_format: "raw"
        on_null: "skip"
      - format: "scalar"
        path: "$.diagnostico_comportamental"
        label: "Diagnóstico comportamental (array)"
        value_format: "raw"
        on_null: "skip"
    narrative_hints:
      - "Não duplique pontos_fortes determinísticos no output — re-priorize sob ótica metodológica e cite só os 3-6 mais relevantes."
      - "Score baixo (< 5) força ao menos 1 risco severidade Crítica no output."

  # --------------------------------------------------------------------------
  # 10) Plano de ação (S11 / plano_de_acao) — referência ao operating system
  #     já em produção (Suggestion → Task → Decision)
  # --------------------------------------------------------------------------
  - id: "plano_acao_atual"
    title: "Plano de Ação Atual"
    aligned_with_layout: "plano_de_acao"
    eviction_priority: 10
    blocks:
      - format: "scalar"
        path: "$.tarefas"
        label: "Tarefas (array — operating system Suggestion/Task)"
        value_format: "raw"
        on_null: "skip"
      - format: "scalar"
        path: "$.tarefas_status"
        label: "Status agregado das tarefas"
        value_format: "raw"
        on_null: "skip"
      - format: "scalar"
        path: "$.goals"
        label: "Metas registradas"
        value_format: "raw"
        on_null: "skip"
    narrative_hints:
      - "Sugestões P0 devem alimentar Suggestion(origin='llm') com dedup_key estável — evite repetir sugestão já viva no plano de ação."

# ==============================================================================
# DRILL-DOWN TOOLS (ADR-203)
# ==============================================================================
tools:

  - name: "get_e5_section"
    description: |
      Lê uma chave top-level do E5 quando o contexto destilado for insuficiente.
      Use quando precisar de uma seção inteira (ex.: 'irpf_kpis' completo).
      Retorna {"found": true, "value": <objeto>} ou {"found": false, "reason": "..."}.
    args_schema:
      section:
        type: "string"
        enum:
          - "periodo_dados"
          - "data_analise"
          - "score"
          - "patrimonio"
          - "fluxo_caixa"
          - "ratios"
          - "goals"
          - "orcamento_prospectivo"
          - "reserva_emergencia"
          - "endividamento"
          - "previdencia_pgbl"
          - "pontos_fortes"
          - "pontos_urgentes"
          - "equilibrio_cerbasi"
          - "tarefas"
          - "tarefas_status"
          - "alertas"
          - "consumo_consciente"
          - "diagnostico_comportamental"
          # Sibling do anterior, e o produtor é o mesmo objeto: `.itens()` e
          # `.confianca()` de `DiagnosticoComportamentalAnalyzer`. Ficar de fora era
          # CONTRADIÇÃO do manifest, não recato: a seção já é injetada no exec context
          # (`$.diagnostico_confianca.nivel` + `.share_nao_identificado_pct`) e um
          # `narrative_hint` manda lê-la antes de prescrever. A whitelist governa só o
          # re-ler sob demanda — e, como o parecer é chamada SINGLE-SHOT (`LLMService
          # .call` não tem parâmetro `tools`), ela é whitelist de resolver server-side,
          # não superfície do modelo. Delta de folhas: ZERO — o produtor devolve dict
          # literal de duas chaves, as duas já projetadas. Seguro também no catálogo de
          # citação por PREDICADO, não por estrutura: `nivel` é string e
          # `share_nao_identificado_pct` contém "pct", que curto-circuita
          # `_is_money_key`. Quem renomear esse campo para algo sem "pct" move o
          # catálogo.
          - "diagnostico_confianca"
          - "programa_milhas"
          - "irpf_kpis"
          - "passive_income"
          - "if_monte_carlo"
          - "cenarios_conjuge"
          - "investimentos"
          - "protecao_patrimonial"
          - "exposicao_cambial"
    cache_in_session: true

  - name: "get_e5_jsonpath"
    description: |
      Lê path arbitrário do E5 quando precisar de granularidade abaixo de seção.
      Subset JSONPath: $.field, $.nested.field, $.array[*].field. Whitelist
      derivada do schema E5 — paths fora retornam {"found": false,
      "reason": "path_not_whitelisted"}.
    args_schema:
      path:
        type: "string"
        pattern: "^\\$\\.[A-Za-z_0-9.\\[\\]*]+$"
    cache_in_session: true

# ==============================================================================
# GUARDRAILS (ADR-203 §D2/§D3)
# ==============================================================================
max_tool_iterations: 6
max_total_input_tokens: 50000
max_exec_context_bytes: 16384  # ~16KB hard limit do CORPO (pré tool calls; hints e
# catálogo de citação ficam fora, com orçamento próprio). ADR-341 D1: dimensionado
# para o corpo medido do dogfood (15,6KB) com folga (~+US$0,01–0,02/parecer). O
# budget NÃO é a garantia de completude — a garantia é a eviction por seção (D2):
# excedeu → seções inteiras de menor prioridade saem, com marcador nomeando-as.
# Citação verificada E5→E6 (ADR-279 §E · F4): warn loga violação sem bloquear;
# strict marca needs_review. Override operacional: env MATHOMS_PARECER_EVIDENCIA_MODE.
# Flip warn→strict (A26.l2): segurança satisfeita por construção (per-item,
# ADR-295); budget de UX ≤15% precisa de ≥20 gerações reais antes do merge.
evidencia_verification_mode: "strict"

# Catálogo de citação (A26.l1 · ADR-279 §E): injeta no exec context a lista
# fechada das folhas monetárias não-nulas do E5 — o LLM cita de uma lista em vez
# de adivinhar JSONPath (telemetria 1.5.0: 79% das falhas eram whitelist_miss).
# Bloco computado por parecer_citation_catalog.py; aqui só a intenção declarativa.
# emit:false reproduz o exec context pré-A26 byte-a-byte.
# A40.l83: `max_bytes` é o ORÇAMENTO; `max_entries` deixou de ser controle de custo
# (a semente do corpo pode passar de 30 folhas e ser clipada antes do corte por
# bytes). Um knob só decide o custo. 2600 é joelho RE-MEDIDO no E5 real do run r8
# após a projeção dos campos de incerteza (RV8-05) — o joelho ANDA quando o
# manifest projeta mais dinheiro visível: era 2400 com 36 folhas visíveis, é 2600
# com 37. 1600→52,8% · 2600→86,5%, e nada acima compra ancorabilidade.
citation_catalog:
  emit: true
  format: "flat_path_list"
  monetary_only: true
  max_entries: 60
  max_bytes: 2600

# A40.l49 — rótulo do chip por folha, não por bloco. rotulo_id é o que o LLM
# copia; label é o texto do chip (finalize). Path ausente daqui = fail-open.
citation_labels:
  "$.passive_income.renda_passiva_anual_brl":
    rotulo_id: renda_passiva_anual
    label: "Renda passiva anual"
  "$.passive_income.renda_passiva_mensal_brl":
    rotulo_id: renda_passiva_mensal
    label: "Renda passiva mensal"
  "$.passive_income.renda_ativa_pj_excluida_brl":
    rotulo_id: renda_ativa_pj_excluida
    label: "Renda ativa PJ excluída"
  "$.passive_income.ganho_capital_excluido_brl":
    rotulo_id: ganho_capital_excluido
    label: "Ganho de capital (excluído)"
  "$.passive_income.patrimonio_gerador_brl":
    rotulo_id: patrimonio_gerador
    label: "Patrimônio gerador"
  "$.reserva_emergencia.total_liquida":
    rotulo_id: reserva_emergencia
    label: "Reserva de emergência"
  "$.patrimonio.bruto":
    rotulo_id: patrimonio
    label: "Patrimônio"
  "$.patrimonio.composicao.imoveis_residencia":
    rotulo_id: patrimonio
    label: "Imóveis residenciais"
  "$.if_monte_carlo.prob_sucesso_pct":
    rotulo_id: if_monte_carlo
    label: "Independência financeira"

# ==============================================================================
# HARD CAPS (ADR-202 §D5)
# ==============================================================================
# Referência declarativa. Source-of-truth autoritativa é o output schema
# (config/schemas/parecer_planejador.schema.json). Orchestrator valida ambos.
# ==============================================================================
hard_caps:
  riscos: 12
  sugestoes_por_horizonte: 5
  metricas: 10
  p0_total: 2

# ==============================================================================
# GATING FREEMIUM (ADR-208)
# ==============================================================================
# Referência declarativa. Lógica de filtragem é aplicada pelo orchestrator em
# to_tier_filtered_dto() ANTES de serializar (D1 ADR-208) — backend filtra,
# nunca o frontend.
# ==============================================================================
gating:
  free:
    diagnostico_geral: true
    pontos_fortes_count: 3
    riscos_count: 1
    riscos_filter: "severidade_maxima"
    sugestoes: false
    metricas: false
    notas_metodologicas: false
    teaser_riscos_oculto: true  # CTA "+14 riscos no Premium"
  premium:
    all: true
