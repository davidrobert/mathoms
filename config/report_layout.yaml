# ==============================================================================
# Report Layout Configuration — Relatório Financeiro Família Ferreira Campos
# ==============================================================================
# Este arquivo controla quais seções, cards e charts aparecem no relatório,
# em que ordem, e com que estilo visual.
#
# REGRAS:
#   - A ORDEM dos itens nas listas define a ordem no relatório
#   - enabled: true/false liga ou desliga o elemento
#   - Cards são LIVRES para migrar entre seções (basta mover o bloco YAML)
#   - variant: estilo visual do card (highlight|feature|success|warn|critical|
#              primary|neutral|top-danger|top-accent)
#   - size: largura no grid (full = 100% | half = 50%)
#
# VARIANTES DISPONÍVEIS (ref: report_spec.md v5.3):
#   highlight  — destaque principal (fundo accent)
#   feature    — card informativo padrão
#   success    — indicador positivo (verde)
#   warn       — alerta moderado (amarelo/laranja)
#   critical   — alerta grave (vermelho)
#   primary    — informação neutra com destaque
#   neutral    — card discreto, sem cor forte
#   top-danger — borda superior vermelha
#   top-accent — borda superior accent
#
# Para aplicar: o codegen (dev/codegen_report_layout.py) gera tipos para
# o renderer React (frontend/src/generated/report-layout.ts) e backend
# (backend/app/generated/report_layout.py) a partir deste arquivo.
# ==============================================================================

version: "1.2"

# ==============================================================================
# CAPA (ADR-117 · Fase 5)
# ==============================================================================
# Hero renderizado acima do top-nav no modo estratégico.
# Meta cards usam value_key do snapshot E5 ou são computados pelo shell
# (label_key + value_key=null ⇒ shell computa, ex.: "Gerado em").
# ==============================================================================
cover:
  enabled: true
  badge: "Relatório Premium"
  # title_key/subtitle_key null ⇒ shell usa displayTitle + period formatado
  meta:
    - label_key: "Período analisado"
    - label_key: "Gerado em"
    - label_key: "Documentos"
    - label_key: "Versão"

# ==============================================================================
# NAVEGAÇÃO STICKY (ADR-117 · Fase 5)
# ==============================================================================
# Grupos de links do top-nav por modo. Consumido por ReportTopNav;
# IntersectionObserver do shell marca data-active no link da seção visível.
# ==============================================================================
navigation:
  estrategico:
    - label: "Visão geral"
      links:
        - {section_id: "S1", num: "1"}
        - {section_id: "S2", num: "2"}
        - {section_id: "S3", num: "3"}
    - label: "Detalhes"
      links:
        - {section_id: "S4", num: "4"}
        - {section_id: "S7", num: "7"}
        - {section_id: "S8", num: "8"}
        - {section_id: "S9", num: "9"}
    - label: "Síntese"
      links:
        - {section_id: "S10", num: "10"}
    - label: "Apêndices"
      links:
        - {section_id: "APP_A", num: "A", is_appendix: true}
        - {section_id: "APP_B", num: "B", is_appendix: true}
        - {section_id: "APP_C", num: "C", is_appendix: true}
        - {section_id: "APP_D", num: "D", is_appendix: true}
        - {section_id: "APP_E", num: "E", is_appendix: true}
  tatico:
    - links:
        - {section_id: "T1", num: "T1"}
        - {section_id: "T2", num: "T2"}
        - {section_id: "T3", num: "T3"}
        - {section_id: "T4", num: "T4"}
        - {section_id: "T5", num: "T5"}
        - {section_id: "T6", num: "T6"}
  # TEMP: modo USA oculto da UI — restaurar removendo este bloco e revertendo
  # `enabled: false` em U1–U4 abaixo + filtros em ModeToggle/ReportActions/ReportModeContext.
  # usa:
  #   - links:
  #       - {section_id: "U1", num: "U1"}
  #       - {section_id: "U2", num: "U2"}
  #       - {section_id: "U3", num: "U3"}
  #       - {section_id: "U4", num: "U4"}

# ==============================================================================
# FLAGS GLOBAIS (ADR-117 · Fase 5)
# ==============================================================================
footer: true
export_toolbar: true

# ==============================================================================
# MODO ESTRATÉGICO (S1-S4, S7-S10 + Apêndices A-E)
# ==============================================================================
estrategico:

  sections:

    # --------------------------------------------------------------------------
    # S1 — Patrimônio
    # --------------------------------------------------------------------------
    - id: "S1"
      title: "Patrimônio — Estrutura e Composição"
      enabled: true
      summary: true
      charts:
        - id: "patrimonio_doughnut"
          enabled: true
          conclusion: true
          context: true
        - id: "waterfall_if"
          enabled: true
          conclusion: true
        - id: "score_gauge"
          enabled: true
          conclusion: true
      cards:
        - id: "patrimonio_categorias"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "receitas_fonte"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "reserva_emergencia"
          enabled: true
          variant: "warn"
          size: "half"
        - id: "endividamento"
          enabled: true
          variant: "feature"
          size: "half"
      # Report Premium UI v2.1 — placeholders deferred até v2.D.1+v2.8.
      # Ver docs/agent_prompts/track_report_v2.md §3 v2.1.
      comparisons:
        - id: "comparisons_s1"
          enabled: false
          deferred_until: "v2.D.1 SnapshotChangelogBuilder"
      changelog:
        - id: "changelog_s1"
          enabled: false
          deferred_until: "v2.D.1 SnapshotChangelogBuilder"

    # --------------------------------------------------------------------------
    # S2 — Fluxo de Caixa
    # --------------------------------------------------------------------------
    - id: "S2"
      title: "Fluxo de Caixa — Receitas e Despesas"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "fluxo_mensal"
          enabled: true
          conclusion: true
          period_toggle: true
        - id: "receita_bar"
          enabled: true
          conclusion: true
          period_toggle: true
        - id: "despesas_doughnut"
          enabled: true
          conclusion: true
          period_toggle: true
        - id: "receita_despesa_mensal"
          enabled: true
          conclusion: true
          period_toggle: true
        - id: "viagens"
          enabled: true
          conclusion: true
      cards:
        - id: "orcamento_prospectivo"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "consumo_consciente"
          enabled: true
          variant: "success"
          size: "full"
        - id: "diagnostico_comportamental"
          enabled: true
          variant: "primary"
          size: "half"
        - id: "equilibrio_cerbasi"
          enabled: true
          variant: "highlight"
          size: "half"
        - id: "milhas"
          enabled: false
          variant: "feature"
          size: "half"
      # Report Premium UI v2.1 — placeholders deferred até v2.D.1+v2.8.
      comparisons:
        - id: "comparisons_s2"
          enabled: false
          deferred_until: "v2.D.1 SnapshotChangelogBuilder"
      changelog:
        - id: "changelog_s2"
          enabled: false
          deferred_until: "v2.D.1 SnapshotChangelogBuilder"

    # --------------------------------------------------------------------------
    # S3 — Investimentos
    # --------------------------------------------------------------------------
    - id: "S3"
      title: "Investimentos — Carteira Financeira"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "alocacao_atual"
          enabled: true
          row: "alocacao"
          conclusion: true
        - id: "alocacao_alvo"
          enabled: true
          row: "alocacao"
          conclusion: true
        - id: "top15_ativos"
          enabled: true
          conclusion: true
        - id: "mariana_cenarios"
          enabled: true
          conclusion: true
        # S3.viagens listado em chart_canvas_map mas ausente da seção
        # até esta fase (GAPS.md Tabela D #14). Inserido com enabled:false
        # — ligará quando o card correspondente for migrado (Fase 7+).
        - id: "viagens"
          enabled: false
          conclusion: true
      cards:
        - id: "investimentos_classe"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "kpi_rentabilidade"
          enabled: true
          variant: "feature"
          size: "half"
        - id: "estrategia_aporte"
          enabled: true
          variant: "highlight"
          size: "full"
        - id: "contrafluxo"
          enabled: true
          variant: "primary"
          size: "half"
      # Report Premium UI v2.1 — placeholders deferred até v2.D.1+v2.8.
      comparisons:
        - id: "comparisons_s3"
          enabled: false
          deferred_until: "v2.D.1 SnapshotChangelogBuilder"
      changelog:
        - id: "changelog_s3"
          enabled: false
          deferred_until: "v2.D.1 SnapshotChangelogBuilder"

    # --------------------------------------------------------------------------
    # S4 — Real Estate
    # --------------------------------------------------------------------------
    - id: "S4"
      title: "Real Estate — Imóveis e Renda Passiva"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "yield_imoveis"
          enabled: true
          conclusion: true
      cards: []

    # --------------------------------------------------------------------------
    # S7 — Independência Financeira
    # --------------------------------------------------------------------------
    - id: "S7"
      title: "Independência Financeira — Projeção de Longo Prazo"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "projecao_3cenarios"
          enabled: true
          conclusion: true
        - id: "renda_passiva"
          enabled: true
          conclusion: true
      cards:
        - id: "previdencia_pgbl"
          enabled: true
          variant: "feature"
          size: "full"

    # --------------------------------------------------------------------------
    # S8 — Tributário / Previdência
    # --------------------------------------------------------------------------
    - id: "S8"
      title: "Previdência — PGBL e Fiscalidade"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "impostos_pj"
          enabled: true
          conclusion: true
          period_toggle: true
      cards: []

    # --------------------------------------------------------------------------
    # S9 — Riscos e Proteção
    # --------------------------------------------------------------------------
    - id: "S9"
      title: "Riscos e Proteção — Seguros Críticos"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "bubble_riscos"
          enabled: true
          conclusion: true
      cards: []

    # --------------------------------------------------------------------------
    # S10 — Síntese Estratégica
    # --------------------------------------------------------------------------
    - id: "S10"
      title: "Síntese Estratégica — Tarefas e Score"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "top5_decisoes"
          enabled: true
          conclusion: true
      cards:
        - id: "pontos_fortes"
          enabled: true
          variant: "success"
          size: "half"
          top_border: "accent"
        - id: "pontos_urgentes"
          enabled: true
          variant: "critical"
          size: "half"
          top_border: "danger"
        - id: "equilibrio_cerbasi_ref"
          enabled: false
          variant: "highlight"
          size: "full"

  # ----------------------------------------------------------------------------
  # Apêndices (A-E)
  # ----------------------------------------------------------------------------
  appendices:
    - id: "APP_A"
      title: "Definições e Siglas"
      enabled: true
      # APP_A já migrado em ApendiceASection.tsx — cards[] vazio (uso hand-coded)
    - id: "APP_B"
      title: "Premissas Econômicas"
      # Fase 10 entregou ApendiceBSection (ADR-117/122).
      enabled: true
      cards:
        - {id: "premissas_economicas", enabled: true, variant: "feature", size: "full"}
        - {id: "metodologias", enabled: true, variant: "neutral", size: "full"}
    - id: "APP_C"
      title: "Cenários de Sensibilidade"
      enabled: true
      charts:
        - {id: "cenarios_cambiais", enabled: false, conclusion: true}
      cards:
        - {id: "sensibilidade_ativos", enabled: true, variant: "feature", size: "full"}
    - id: "APP_D"
      title: "Referências e Recursos"
      enabled: true
      cards:
        - {id: "fontes_dados", enabled: true, variant: "neutral", size: "half"}
        - {id: "metodologia_links", enabled: true, variant: "neutral", size: "half"}
    - id: "APP_E"
      title: "Próximos Ciclos e Roadmap"
      enabled: true
      cards:
        - {id: "proximos_ciclos", enabled: true, variant: "highlight", size: "full"}
        - {id: "disclaimers", enabled: true, variant: "neutral", size: "full"}

