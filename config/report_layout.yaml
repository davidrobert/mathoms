  score_gauge: "chart-score-gauge"
  top15_ativos: "chart-top15-ativos"
  projecao_3cenarios: "chart-projecao-3cenarios"
  renda_passiva: "chart-renda-passiva"
  impostos_pj: "chart-impostos-pj"
