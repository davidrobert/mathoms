# ==============================================================================
# DARK MODE — cores CSS (usadas por e6_regen.py)
# ==============================================================================
dark_mode:
  # Variáveis CSS raiz
  css_vars:
    color-bg: "#0F172A"
    color-surface: "#1E293B"
    color-text: "#E2E8F0"
    color-text-muted: "#94A3B8"
    color-border: "#334155"
    color-primary: "#2E86AB"
    color-light: "#1E3A5F"

  # Cores específicas de componentes
  table:
    row_even: "#1A2332"
    row_hover: "#243447"
    th_bg: "#1E3A5F"
    th_color: "#E2E8F0"
    td_total: "#1A2332"
    td_border: "#334155"

  alerts:
    danger_bg: "#2D1B1B"
    danger_color: "#FCA5A5"
    warning_bg: "#2D2410"
    warning_color: "#FCD34D"
    success_bg: "#1A2D1A"
    success_color: "#86EFAC"
    info_bg: "#1A2440"
    info_color: "#93C5FD"

  badges:
    green_bg: "#16533480"
    green_color: "#86EFAC"
    red_bg: "#991B1B80"
    red_color: "#FCA5A5"
    yellow_bg: "#92400E80"
    yellow_color: "#FCD34D"
    blue_bg: "#1E40AF80"
    blue_color: "#93C5FD"

  kpi:
    blue: "#60A5FA"
    green: "#4ADE80"
    red: "#F87171"

  headings_color: "#F1F5F9"
  strong_color: "#F1F5F9"
  section_summary_bg: "#1A2440"
  section_summary_color: "#CBD5E1"
  chart_conclusion_bg: "#1A2440"
  chart_conclusion_border: "#2E86AB"
  chart_context_color: "#94A3B8"
  export_toolbar_bg: "linear-gradient(135deg, #0B1929, #132337)"
  progress_bar_bg: "#334155"
  compare_col2_bg: "#2D1B1B"
  compare_col3_bg: "#1A2D1A"

  # Cores para Chart.js no modo dark/light (usadas pelo theme JS)
  chart_theme:
    dark:
      text_color: "#94A3B8"
      grid_color: "#334155"
    light:
      text_color: "#64748B"
      grid_color: "#E2E8F0"

  # Versão fallback (quando manual_operacao.md não tem Versão:)
  version_fallback: "v5.3"
