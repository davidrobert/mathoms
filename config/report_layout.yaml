# ==============================================================================
# Report Layout Configuration — Relatório Financeiro Família Ferreira Campos
# ==============================================================================
# Este arquivo controla quais seções, cards e charts aparecem no relatório,
# em que ordem, e com que estilo visual.
#
# REGRAS:
#   - A ORDEM dos itens nas listas define a ordem no relatório
#   - enabled: true/false liga ou desliga o elemento
#   - Cards são LIVRES para migrar entre seções (basta mover o bloco YAML)
#   - variant: estilo visual do card (highlight|feature|success|warn|critical|
#              primary|neutral|top-danger|top-accent)
#   - size: largura no grid (full = 100% | half = 50%)
#
# VARIANTES DISPONÍVEIS (ref: report_spec.md v5.3):
#   highlight  — destaque principal (fundo accent)
#   feature    — card informativo padrão
#   success    — indicador positivo (verde)
#   warn       — alerta moderado (amarelo/laranja)
#   critical   — alerta grave (vermelho)
#   primary    — informação neutra com destaque
#   neutral    — card discreto, sem cor forte
#   top-danger — borda superior vermelha
#   top-accent — borda superior accent
#
# Para aplicar: e6_render.py lê este arquivo e itera pelas seções/cards
# ao invés de usar a sequência hardcoded.
# ==============================================================================

version: "1.1"

# ==============================================================================
# MODO ESTRATÉGICO (S1-S10 + Apêndices A-E)
# ==============================================================================
estrategico:

  sections:

    # --------------------------------------------------------------------------
    # S1 — Patrimônio
    # --------------------------------------------------------------------------
    - id: "S1"
      title: "Patrimônio — Estrutura e Composição"
      enabled: true
      charts:
        - id: "patrimonio_doughnut"
          enabled: true
        - id: "waterfall_if"
          enabled: true
      cards:
        - id: "patrimonio_categorias"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "receitas_fonte"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "reserva_emergencia"
          enabled: true
          variant: "warn"
          size: "half"
        - id: "endividamento"
          enabled: true
          variant: "feature"
          size: "half"

    # --------------------------------------------------------------------------
    # S2 — Fluxo de Caixa
    # --------------------------------------------------------------------------
    - id: "S2"
      title: "Fluxo de Caixa — Receitas e Despesas"
      enabled: true
      charts:
        - id: "fluxo_mensal"
          enabled: true
        - id: "receita_bar"
          enabled: true
        - id: "despesas_doughnut"
          enabled: true
        - id: "receita_despesa_mensal"
          enabled: true
        - id: "score_gauge"
          enabled: true
      cards:
        - id: "orcamento_prospectivo"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "consumo_consciente"
          enabled: true
          variant: "success"
          size: "full"
        - id: "diagnostico_comportamental"
          enabled: true
          variant: "primary"
          size: "full"
        - id: "milhas"
          enabled: true
          variant: "feature"
          size: "half"

    # --------------------------------------------------------------------------
    # S3 — Investimentos
    # --------------------------------------------------------------------------
    - id: "S3"
      title: "Investimentos — Carteira Financeira"
      enabled: true
      charts:
        - id: "alocacao_atual"
          enabled: true
        - id: "alocacao_alvo"
          enabled: true
        - id: "top15_ativos"
          enabled: true
        - id: "mariana_cenarios"
          enabled: true
        - id: "viagens"
          enabled: true
      cards:
        - id: "investimentos_classe"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "kpi_rentabilidade"
          enabled: true
          variant: "feature"
          size: "half"
        - id: "estrategia_aporte"
          enabled: true
          variant: "highlight"
          size: "full"
        - id: "contrafluxo"
          enabled: true
          variant: "primary"
          size: "half"

    # --------------------------------------------------------------------------
    # S4 — Real Estate
    # --------------------------------------------------------------------------
    - id: "S4"
      title: "Real Estate — Imóveis e Renda Passiva"
      enabled: true
      charts:
        - id: "yield_imoveis"
          enabled: true
      cards: []

    # --------------------------------------------------------------------------
    # S5 — Mudança EUA (F1/F2)
    # --------------------------------------------------------------------------
    - id: "S5"
      title: "Mudança EUA — Estrutura F1/F2 e Custos"
      enabled: true
      charts:
        - id: "custos_f1f2"
          enabled: true
      cards: []

    # --------------------------------------------------------------------------
    # S6 — Green Card
    # --------------------------------------------------------------------------
    - id: "S6"
      title: "Green Card — EB2-NIW e Compliance"
      enabled: true
      charts:
        - id: "cenarios_cambiais"
          enabled: true
      cards: []

    # --------------------------------------------------------------------------
    # S7 — Independência Financeira
    # --------------------------------------------------------------------------
    - id: "S7"
      title: "Independência Financeira — Meta 2035"
      enabled: true
      charts:
        - id: "projecao_3cenarios"
          enabled: true
        - id: "renda_passiva"
          enabled: true
      cards:
        - id: "previdencia_pgbl"
          enabled: true
          variant: "feature"
          size: "full"

    # --------------------------------------------------------------------------
    # S8 — Tributário / Previdência
    # --------------------------------------------------------------------------
    - id: "S8"
      title: "Previdência — PGBL e Fiscalidade"
      enabled: true
      charts:
        - id: "impostos_pj"
          enabled: true
      cards: []

    # --------------------------------------------------------------------------
    # S9 — Riscos e Proteção
    # --------------------------------------------------------------------------
    - id: "S9"
      title: "Riscos e Proteção — Seguros Críticos"
      enabled: true
      charts:
        - id: "bubble_riscos"
          enabled: true
      cards: []

    # --------------------------------------------------------------------------
    # S10 — Síntese Estratégica
    # --------------------------------------------------------------------------
    - id: "S10"
      title: "Síntese Estratégica — Tarefas e Score"
      enabled: true
      charts:
        - id: "top5_decisoes"
          enabled: true
      cards:
        - id: "pontos_fortes"
          enabled: true
          variant: "success"
          size: "half"
        - id: "pontos_urgentes"
          enabled: true
          variant: "critical"
          size: "half"
        - id: "equilibrio_cerbasi"
          enabled: true
          variant: "highlight"
          size: "full"

  # ----------------------------------------------------------------------------
  # Apêndices (A-E)
  # ----------------------------------------------------------------------------
  appendices:
    - id: "APP_A"
      title: "Definições e Siglas"
      enabled: true
    - id: "APP_B"
      title: "Premissas Econômicas"
      enabled: true
    - id: "APP_C"
      title: "Cenários de Sensibilidade"
      enabled: true
    - id: "APP_D"
      title: "Referências e Recursos"
      enabled: true
    - id: "APP_E"
      title: "Próximos Ciclos e Roadmap"
      enabled: true

# ==============================================================================
# MODO TÁTICO (T1-T6 + KPIs)
# ==============================================================================
tatico:

  # KPIs do painel tático (barra superior)
  kpis:
    - id: "patrimonio_delta"
      label: "Patrimônio Δ"
      enabled: true
    - id: "aportes_check"
      label: "Aportes ✓"
      enabled: true
    - id: "despesas_alerta"
      label: "Despesas Alerta"
      enabled: true
    - id: "tarefas_pct"
      label: "Tarefas %"
      enabled: true
    - id: "alerta_1"
      label: "Alerta 1"
      enabled: true
    - id: "alerta_2"
      label: "Alerta 2"
      enabled: true

  # Dashboards táticos
  sections:
    - id: "T1"
      title: "Fluxo"
      description: "Despesas vs tetos — tabela interativa com barras de progresso"
      enabled: true
    - id: "T2"
      title: "Aportes"
      description: "Destinos de investimento, delta tracking por bloco"
      enabled: true
    - id: "T3"
      title: "Tarefas"
      description: "Checklist com filtro (pendente/feito/vencido)"
      enabled: true
    - id: "T4"
      title: "Alertas"
      description: "Avisos-chave do dashboard"
      enabled: true
    - id: "T5"
      title: "Próximos Passos"
      description: "Timeline de 15 dias com badges de status"
      enabled: true
    - id: "T6"
      title: "Notas"
      description: "Notas operacionais livres"
      enabled: true

# ==============================================================================
# REGISTRY DE CARDS DISPONÍVEIS
# ==============================================================================
# Referência: todos os card builders existentes no e6_render.py
# Use os IDs abaixo nas seções acima. Cada ID mapeia para um builder function.
#
# ID                          | Builder Function                        | Seção Original
# ----------------------------|-----------------------------------------|---------------
# patrimonio_categorias       | build_patrimonio_categorias_card()      | S1
# receitas_fonte              | build_receitas_fonte_card()             | S1
# reserva_emergencia          | build_reserva_emergencia_card()         | S1
# endividamento               | build_endividamento_card()              | S1
# orcamento_prospectivo       | build_orcamento_prospectivo_card()      | S2
# consumo_consciente          | build_consumo_consciente_card()         | S2
# diagnostico_comportamental  | build_diagnostico_comportamental_card() | S2
# milhas                      | build_milhas_card()                     | S2
# investimentos_classe        | build_investimentos_classe_card()       | S3
# kpi_rentabilidade           | (inline HTML block)                     | S3
# estrategia_aporte           | build_estrategia_aporte_card()          | S3
# contrafluxo                 | (inline HTML block)                     | S3
# previdencia_pgbl            | build_previdencia_pgbl_card()           | S7
# pontos_fortes               | build_pontos_fortes_card()              | S10
# pontos_urgentes             | build_pontos_urgentes_card()            | S10
# equilibrio_cerbasi          | build_equilibrio_cerbasi_card()         | S10
#
# CHARTS DISPONÍVEIS (20 total):
# patrimonio_doughnut, waterfall_if, fluxo_mensal, receita_bar,
# despesas_doughnut, receita_despesa_mensal, score_gauge,
# alocacao_atual, alocacao_alvo, top15_ativos, mariana_cenarios,
# viagens, yield_imoveis, custos_f1f2, cenarios_cambiais,
# projecao_3cenarios, renda_passiva, impostos_pj, bubble_riscos,
# top5_decisoes

