# ==============================================================================
# MAPEAMENTO: chart key → título amigável para exibição
# ==============================================================================
chart_titles:
  patrimonio_doughnut: "Composição Patrimonial"
  waterfall_if: "Caminho para Independência Financeira"
  receita_bar: "Receita por Fonte"
  despesas_doughnut: "Despesas por Categoria"
  fluxo_mensal: "Fluxo de Caixa Mensal"
  receita_despesa_mensal: "Receita vs Despesa — Mês a Mês"
  score_gauge: "Score Financeiro"
  top15_ativos: "Top 15 Ativos Financeiros"
  projecao_3cenarios: "Projeção Patrimonial — 3 Cenários"
  renda_passiva: "Renda Passiva — Progresso até a Meta"
  impostos_pj: "Tributário PJ — Cascata Fiscal"
  bubble_riscos: "Mapa de Riscos"
  top5_decisoes: "Top 5 Decisões de Impacto"
  cenarios_conjuge: "Cenários de Estresse — Sem renda do cônjuge"
  viagens: "Orçamento de Viagens"
  renda_evolucao_multi_anos: "Evolução da Renda — Multi-anos"
  aliquota_efetiva_dual_gauge: "Alíquota Efetiva — RFB e Renda Total"

# ==============================================================================
# MAPEAMENTO: seção → charts (número da seção → lista de chart keys)
# ==============================================================================
section_charts:
  1: ["patrimonio_doughnut", "waterfall_if"]
  2: ["fluxo_mensal", "receita_bar", "despesas_doughnut", "receita_despesa_mensal", "score_gauge"]
  3: ["top15_ativos", "cenarios_conjuge", "viagens"]
  7: ["projecao_3cenarios", "renda_passiva"]
  8: ["impostos_pj"]
  9: ["bubble_riscos"]
  10: ["top5_decisoes"]

# ==============================================================================
# DARK MODE — cores CSS (consumidas pelo design system / tokens.css)
# ==============================================================================
dark_mode:
  # Variáveis CSS raiz
  css_vars:
    color-bg: "#0F172A"
    color-surface: "#1E293B"
    color-text: "#E2E8F0"
    color-text-muted: "#94A3B8"
    color-border: "#334155"
    color-primary: "#2E86AB"
    color-light: "#1E3A5F"

  # Cores específicas de componentes
  table:
    row_even: "#1A2332"
    row_hover: "#243447"
    th_bg: "#1E3A5F"
    th_color: "#E2E8F0"
    td_total: "#1A2332"
    td_border: "#334155"

  alerts:
    danger_bg: "#2D1B1B"
    danger_color: "#FCA5A5"
    warning_bg: "#2D2410"
    warning_color: "#FCD34D"
    success_bg: "#1A2D1A"
    success_color: "#86EFAC"
    info_bg: "#1A2440"
    info_color: "#93C5FD"

  badges:
    green_bg: "#16533480"
    green_color: "#86EFAC"
    red_bg: "#991B1B80"
    red_color: "#FCA5A5"
    yellow_bg: "#92400E80"
    yellow_color: "#FCD34D"
    blue_bg: "#1E40AF80"
    blue_color: "#93C5FD"

  kpi:
    blue: "#60A5FA"
    green: "#4ADE80"
    red: "#F87171"

  headings_color: "#F1F5F9"
  strong_color: "#F1F5F9"
  section_summary_bg: "#1A2440"
  section_summary_color: "#CBD5E1"
  chart_conclusion_bg: "#1A2440"
  chart_conclusion_border: "#2E86AB"
  chart_context_color: "#94A3B8"
  export_toolbar_bg: "linear-gradient(135deg, #0B1929, #132337)"
  progress_bar_bg: "#334155"
  compare_col2_bg: "#2D1B1B"
  compare_col3_bg: "#1A2D1A"

  # Cores para Chart.js no modo dark/light (usadas pelo theme JS)
  chart_theme:
    dark:
      text_color: "#94A3B8"
      grid_color: "#334155"
    light:
      text_color: "#64748B"
      grid_color: "#E2E8F0"

version_fallback: "v5.3"
