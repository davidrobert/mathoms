# ==============================================================================
# Report Layout Configuration — Relatório Financeiro Família Ferreira Campos
# ==============================================================================
# Este arquivo controla quais seções, cards e charts aparecem no relatório,
# em que ordem, e com que estilo visual.
#
# REGRAS:
#   - A ORDEM dos itens nas listas define a ordem no relatório
#   - enabled: true/false liga ou desliga o elemento
#   - Cards são LIVRES para migrar entre seções (basta mover o bloco YAML)
#   - variant: estilo visual do card (highlight|feature|success|warn|critical|
#              primary|neutral|top-danger|top-accent)
#   - size: largura no grid (full = 100% | half = 50%)
#
# VARIANTES DISPONÍVEIS (ref: report_spec.md v5.3):
#   highlight  — destaque principal (fundo accent)
#   feature    — card informativo padrão
#   success    — indicador positivo (verde)
#   warn       — alerta moderado (amarelo/laranja)
#   critical   — alerta grave (vermelho)
#   primary    — informação neutra com destaque
#   neutral    — card discreto, sem cor forte
#   top-danger — borda superior vermelha
#   top-accent — borda superior accent
#
# Para aplicar: o codegen (dev/codegen_report_layout.py) gera tipos para
# o renderer React (frontend/src/generated/report-layout.ts) e backend
# (backend/app/generated/report_layout.py) a partir deste arquivo.
#
# TRÊS NÚMEROS DE VERSÃO COEXISTEM (não confundir):
#   1. `version` (abaixo, "1.2")          — schema do PRÓPRIO YAML; bump
#                                            quando shape do layout muda
#                                            (campos novos, breaks de codegen).
#   2. `version_fallback` (no fim, "v5.3") — fallback do meta-card "Versão"
#                                            da capa; ReportShell prefere
#                                            `pkg.version` (package.json).
#                                            Mantido por segurança ofline.
#   3. `report_version` em config/pipeline.json ("6.1") — identificador
#                                            do TEMPLATE de relatório que o
#                                            E5 emite no JSON (não relacionado
#                                            ao layout YAML). Bump quando
#                                            mudam seções/charts produzidos.
# ==============================================================================

version: "1.2"

# ==============================================================================
# CAPA (ADR-117 · Fase 5)
# ==============================================================================
# Hero renderizado acima do top-nav no modo estratégico.
# Meta cards usam value_key do snapshot E5 ou são computados pelo shell
# (label_key + value_key=null ⇒ shell computa, ex.: "Gerado em").
# ==============================================================================
cover:
  enabled: true
  badge: "Relatório Premium"
  # title_key/subtitle_key null ⇒ shell usa displayTitle + period formatado.
  # v2.F.3 (2026-04-26): badge dinâmico se workspace_family_surname presente
  # ("Relatório · Família X"); meta agora mostra Família como primeiro card
  # (condicional ao surname); rótulo Versão renderiza "Mathoms v{N}" via
  # NEXT_PUBLIC_APP_VERSION; "Documentos" foi removido (não é insight do cover).
  meta:
    - label_key: "Família"
      conditional_on: "workspace_family_surname"
    - label_key: "Período"
    - label_key: "Gerado em"
    - label_key: "Versão"

# ==============================================================================
# NAVEGAÇÃO STICKY (ADR-117 · Fase 5)
# ==============================================================================
# Grupos de links do top-nav por modo. Consumido por ReportTopNav;
# IntersectionObserver do shell marca data-active no link da seção visível.
# ==============================================================================
navigation:
  estrategico:
    - label: "Visão geral"
      links:
        - {section_id: "S1", num: "1"}
        - {section_id: "S2", num: "2"}
        # S_PROTECAO inserido pós-S2 (ordem AUVP, ADR-240 D1). Numeração 2.5
        # — temporária até reordenação S3↔S4 (débito P2.1).
        - {section_id: "S_PROTECAO", num: "2.5"}
        - {section_id: "S3", num: "3"}
    - label: "Detalhes"
      links:
        - {section_id: "S4", num: "4"}
        - {section_id: "S7", num: "7"}
        - {section_id: "S8", num: "8"}
        - {section_id: "S_IRPF_RENDA", num: "8.1"}
        - {section_id: "S_IRPF_OTIMIZACAO", num: "8.2"}
        - {section_id: "S9", num: "9"}
    - label: "Síntese"
      links:
        - {section_id: "S10", num: "10"}
        - {section_id: "S_parecer", num: "10.1"}
        - {section_id: "plano_de_acao", num: "11"}
    - label: "Apêndices"
      links:
        - {section_id: "APP_A", num: "A", is_appendix: true}
        - {section_id: "APP_B", num: "B", is_appendix: true}
        - {section_id: "APP_C", num: "C", is_appendix: true}
        - {section_id: "APP_D", num: "D", is_appendix: true}
        - {section_id: "APP_E", num: "E", is_appendix: true}

# ==============================================================================
# FLAGS GLOBAIS (ADR-117 · Fase 5)
# ==============================================================================
footer: true
export_toolbar: true

# ==============================================================================
# MODO ESTRATÉGICO (S1-S4, S7-S10 + Apêndices A-E)
# ==============================================================================
estrategico:

  sections:

    # --------------------------------------------------------------------------
    # S1 — Patrimônio
    # --------------------------------------------------------------------------
    - id: "S1"
      title: "Patrimônio — Estrutura e Composição"
      enabled: true
      summary: true
      charts:
        - id: "patrimonio_doughnut"
          enabled: true
          conclusion: true
          context: true
        - id: "waterfall_if"
          enabled: true
          conclusion: true
        - id: "score_gauge"
          enabled: true
          conclusion: true
      cards:
        - id: "patrimonio_categorias"
          enabled: true
          variant: "feature"
          size: "full"
        # A33.l2 P4 (ADR-238 D5, co-design product-designer 2026-07-07):
        # posição por instituição/moeda 31/12 (informes financeiro PF + extrato).
        # Hide-when-empty: componente retorna null sem posições de informe.
        - id: "posicao_informe_31_12"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "exposicao_cambial"  # Bloco G plan/RESIDENCIA_E_USO (co-design 2026-05-18)
          enabled: true
          variant: "feature"
          size: "half"
        - id: "receitas_fonte"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "reserva_emergencia"
          enabled: true
          variant: "warn"
          size: "half"
        - id: "endividamento"
          enabled: true
          variant: "feature"
          size: "half"
      # Report Premium UI v2.8 — comparisons + changelog ativos via SnapshotChangelogBuilder (ADR-148).
      comparisons:
        - id: "comparisons_s1"
          enabled: true
      changelog:
        - id: "changelog_s1"
          enabled: true

    # --------------------------------------------------------------------------
    # S2 — Fluxo de Caixa
    # --------------------------------------------------------------------------
    - id: "S2"
      title: "Fluxo de Caixa — Receitas e Despesas"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "fluxo_mensal"
          enabled: true
          conclusion: true
          period_toggle: true
        - id: "receita_bar"
          enabled: true
          conclusion: true
          period_toggle: true
        - id: "despesas_doughnut"
          enabled: true
          conclusion: true
          period_toggle: true
        - id: "receita_despesa_mensal"
          enabled: true
          conclusion: true
          period_toggle: true
        - id: "viagens"
          enabled: true
          conclusion: true
      cards:
        - id: "orcamento_prospectivo"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "consumo_consciente"
          enabled: true
          variant: "success"
          size: "full"
        - id: "diagnostico_comportamental"
          enabled: true
          variant: "primary"
          size: "half"
        - id: "equilibrio_cerbasi"
          enabled: true
          variant: "highlight"
          size: "half"
        - id: "milhas"
          enabled: false
          variant: "feature"
          size: "half"
      # Report Premium UI v2.8 — comparisons + changelog ativos via SnapshotChangelogBuilder (ADR-148).
      comparisons:
        - id: "comparisons_s2"
          enabled: true
      changelog:
        - id: "changelog_s2"
          enabled: true

    # --------------------------------------------------------------------------
    # S_PROTECAO — Proteção Patrimonial (4º pilar AUVP) — A19 L1 P2 · ADR-240
    # --------------------------------------------------------------------------
    # Posicionamento AUVP: S2 (Reserva) → S_PROTECAO (Proteção) → S4 (Patrimônio)
    # → S3 (Investimentos). Reordenação S3↔S4 é débito P2.1 (visual review
    # exige snapshots novos; mantemos ordem atual para não quebrar diff de PDF).
    # Cards e charts em enabled:false até P3 (componente React) ligar.
    - id: "S_PROTECAO"
      title: "Proteção Patrimonial — Pilar AUVP"
      enabled: false  # P3 liga quando S_ProtecaoSection.tsx existir
      summary: true
      divider_before: true
      charts:
        - id: "protecao_premio_decomp"  # KPI G hero — pizza por tipo (auto/residencial/vida-V2/saude-V2/ap-V2)
          enabled: false
          conclusion: true
      cards:
        - id: "protecao_kpi_hero"  # KPI G (Σ prêmios + decomposição) + KPI B (% renda Cerbasi)
          enabled: false
          variant: "highlight"
          size: "full"
        - id: "protecao_bens"  # Subgrupo Bens — tabela LMI + FIPE + gap C por veículo
          enabled: false
          variant: "feature"
          size: "full"
        - id: "protecao_gap_qualitativo"  # KPI F — chips vida/saúde (V2 placeholders escondidos quando flag=false)
          enabled: false
          variant: "warn"
          size: "half"
        - id: "protecao_apolices"  # Lista de apólices vigentes/vencendo/vencidas + multi-corretor metadata
          enabled: false
          variant: "neutral"
          size: "full"

    # --------------------------------------------------------------------------
    # S3 — Investimentos
    # --------------------------------------------------------------------------
    - id: "S3"
      title: "Investimentos — Carteira Financeira"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "top15_ativos"
          enabled: true
          conclusion: true
        - id: "cenarios_conjuge"
          enabled: true
          conclusion: true
        # S3.viagens listado em chart_canvas_map mas ausente da seção
        # até esta fase (GAPS.md Tabela D #14). Inserido com enabled:false
        # — ligará quando o card correspondente for migrado (Fase 7+).
        - id: "viagens"
          enabled: false
          conclusion: true
      cards:
        - id: "alocacao_atual_vs_alvo"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "kpi_rentabilidade"
          enabled: true
          variant: "feature"
          size: "half"
        # A33.l4 (ADR-238 §L4) — renda de proventos por ativo dos informes
        # proventos_acoes: yield sobre custo (primário) + yield sobre valor
        # atual 31/12 (secundário). Oculto quando o workspace não tem informe.
        - id: "proventos_yield"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "estrategia_aporte"
          enabled: true
          variant: "highlight"
          size: "full"
        - id: "contrafluxo"
          enabled: true
          variant: "primary"
          size: "half"
      # Report Premium UI v2.8 — comparisons + changelog ativos via SnapshotChangelogBuilder (ADR-148).
      comparisons:
        - id: "comparisons_s3"
          enabled: true
      changelog:
        - id: "changelog_s3"
          enabled: true

    # --------------------------------------------------------------------------
    # S4 — Real Estate
    # --------------------------------------------------------------------------
    # ADR-216 Onda 6 — cutover: chart yield_imoveis removido em favor de
    # `real_estate_yield` (card determinístico com cap rate líquido, benchmarks
    # CDI/NTN-B/IFIX, tabela por imóvel). S4RealEstateSection retorna null
    # quando workspace não tem property_identity (esconde a seção).
    - id: "S4"
      title: "Real Estate — Imóveis e Renda Passiva"
      enabled: true
      summary: true
      divider_before: true
      charts: []
      cards:
        - id: "real_estate_yield"
          enabled: true
          variant: "feature"
          size: "full"

    # --------------------------------------------------------------------------
    # NOTA — IDs S5 e S6 não existem por design (reservados/queimados; não
    # reciclar). Modo USA (que abrigava U1/U2 ex-S5/S6) foi removido em
    # ADR-168 (A8.4 PR4) — modo opcional sem cliente real é lastro.
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # S7 — Independência Financeira
    # --------------------------------------------------------------------------
    - id: "S7"
      title: "Independência Financeira — Projeção de Longo Prazo"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "projecao_3cenarios"
          enabled: true
          conclusion: true
        - id: "renda_passiva"
          enabled: true
          conclusion: true
      cards:
        - id: "previdencia_pgbl"
          enabled: true
          variant: "feature"
          size: "full"

    # --------------------------------------------------------------------------
    # S8 — Tributário / Previdência
    # --------------------------------------------------------------------------
    - id: "S8"
      title: "Previdência — PGBL e Fiscalidade"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "impostos_pj"
          enabled: true
          conclusion: true
          period_toggle: true
      cards: []

    # --------------------------------------------------------------------------
    # S_IRPF_RENDA — Renda anual e impostos (ADR-157 · IRPF Full Schema)
    # Consome `output.irpf_kpis` produzido por IRPFAnalyzer (E5).
    # Workspaces sem declaração IRPF: a seção inteira é omitida pelo
    # componente (IrpfRendaSection retorna null se kpis ausente).
    # --------------------------------------------------------------------------
    - id: "S_IRPF_RENDA"
      title: "Renda Anual e Impostos"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "renda_evolucao_multi_anos"
          enabled: true
          conclusion: true
        - id: "aliquota_efetiva_dual_gauge"
          enabled: true
          conclusion: true
      cards:
        - id: "renda_anual_familiar"
          enabled: true
          variant: "feature"
          size: "half"
        - id: "ir_pago_total"
          enabled: true
          variant: "feature"
          size: "half"
        - id: "split_trabalho_capital"
          enabled: true
          variant: "feature"
          size: "full"

    # --------------------------------------------------------------------------
    # S_IRPF_OTIMIZACAO — Otimização tributária (ADR-157, ADR-189, ADR-194)
    # 3 cards: PGBL Capacidade (half — 4 estados internos, ADR-189) +
    # Dependentes Declarados (half — factual, ADR-194 §6.1) +
    # Dedutíveis Aplicados por Categoria (full — 4 categorias sparse, ADR-194 §6.2).
    # Hierarquia visual (G4 product-designer): linha 1 = pareados half/half;
    # linha 2 = denso full. Copy literal congelada por G0 (financial-planner)
    # em ADR-194 §6.1 e §6.2; alterações exigem re-sign-off.
    # Variantes resolvidas internamente: PGBL por status; Dedutíveis por
    # presença de subutilização (info se há gap, neutral else). Dependentes
    # fixo neutral. Empty-states escondem via guard em IrpfOtimizacaoSection.
    # --------------------------------------------------------------------------
    - id: "S_IRPF_OTIMIZACAO"
      title: "Otimização Tributária"
      enabled: true
      summary: true
      cards:
        - id: "pgbl_capacidade"
          enabled: true
          variant: "info"
          size: "half"
        - id: "irpf_dependentes_declarados"
          enabled: true
          variant: "neutral"
          size: "half"
        - id: "irpf_dedutiveis_aplicados"
          enabled: true
          variant: "info"
          size: "full"

    # --------------------------------------------------------------------------
    # S9 — Riscos e Proteção (ADR-192 §D4 · S9-T04)
    # 4 cards + 1 chart. Bubble re-enquadrado: plota apenas riscos
    # compliance/sucessório; cobertura de seguros virou tabela em
    # `cobertura_seguros`. Hierarquia (financial-planner + product-designer):
    #   linha 1: hero_gap_protecao (full, KPI protagonista)
    #   linha 2: cobertura_seguros (full, tabela densa por categoria)
    #   linha 3: sucessao (half, warn quando há gap) + acoes_mitigacao (half)
    #   linha 4: bubble_riscos (full, mapa de probabilidade × impacto)
    # Disclaimer fiduciário canônico (ADR-192 §"Atualizações pós-revisão")
    # obrigatório em cada card de cobertura recomendada.
    # --------------------------------------------------------------------------
    - id: "S9"
      title: "Riscos e Proteção — Seguros Críticos"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "bubble_riscos"
          enabled: true
          conclusion: true
      cards:
        - id: "hero_gap_protecao"
          enabled: true
          variant: "critical"
          size: "full"
        - id: "cobertura_seguros"
          enabled: true
          variant: "feature"
          size: "full"
        - id: "sucessao"
          enabled: true
          variant: "warn"
          size: "half"
        - id: "acoes_mitigacao"
          enabled: true
          variant: "highlight"
          size: "half"

    # --------------------------------------------------------------------------
    # S10 — Síntese Estratégica
    # --------------------------------------------------------------------------
    - id: "S10"
      title: "Síntese Estratégica — Tarefas e Score"
      enabled: true
      summary: true
      divider_before: true
      charts:
        - id: "top5_decisoes"
          enabled: true
          conclusion: true
      cards:
        - id: "pontos_fortes"
          enabled: true
          variant: "success"
          size: "half"
          top_border: "accent"
        - id: "pontos_urgentes"
          enabled: true
          variant: "critical"
          size: "half"
          top_border: "danger"
        - id: "equilibrio_cerbasi_ref"
          enabled: false
          variant: "highlight"
          size: "full"

    # --------------------------------------------------------------------------
    # S_parecer — Parecer do Planejador (ADR-199 · Ato 5)
    # --------------------------------------------------------------------------
    # Renderiza output orientativo do stage `review_finances_holistic`. Único
    # consumer de PlannerReview (`pipeline_artifacts.stage = "E6-parecer"`).
    # Free vê amostra teaser; Premium destrava plano completo (ADR-208 §D2).
    # `x-planner-skip: true` é dica do destilador — não é input do parecer
    # gerado por si mesmo. `data_source: "planner_review"` sinaliza renderer
    # que esta seção lê o aggregate, não E5.
    - id: "S_parecer"
      title: "Parecer do Planejador"
      enabled: true
      summary: false
      divider_before: true
      data_source: "planner_review"
      charts: []
      cards: []

    # --------------------------------------------------------------------------
    # plano_de_acao — Decisões em Vigor no Período (A7.2a · ADR-136 · ADR-149)
    # --------------------------------------------------------------------------
    # Apêndice gerado da Decision aggregate na data do snapshot — read-only.
    # Gestão (criar/editar/superseder/executar) vive em /plano (Onda 2 da
    # Direção E). Modo Tático foi removido (ADR-149 supersede ADR-117/ADR-123).
    - id: "plano_de_acao"
      title: "Plano de Ação — Decisões em Vigor"
      enabled: true
      summary: true
      divider_before: true
      data_source: "decisions"
      charts: []
      cards: []

  # ----------------------------------------------------------------------------
  # Apêndices (A-E)
  # ----------------------------------------------------------------------------
  appendices:
    - id: "APP_A"
      title: "Definições e Siglas"
      enabled: true
      # APP_A já migrado em ApendiceASection.tsx — cards[] vazio (uso hand-coded)
    - id: "APP_B"
      title: "Premissas Econômicas"
      # Fase 10 entregou ApendiceBSection (ADR-117/122).
      enabled: true
      cards:
        - {id: "premissas_economicas", enabled: true, variant: "feature", size: "full"}
        - {id: "metodologias", enabled: true, variant: "neutral", size: "full"}
    - id: "APP_C"
      # ADR-167 (A8.4 PR3): "Cenários de Estresse" — opcional, hide-when-empty
      # com numeração estável A/B/C/D/E. Renderer omite a página inteira
      # (seção + entrada no TOC) quando `data.cenarios_conjuge` ausente.
      title: "Cenários de Estresse"
      enabled: true
      optional: true
      charts: []
      cards:
        - {id: "sensibilidade_ativos", enabled: true, variant: "feature", size: "full"}
    - id: "APP_D"
      title: "Referências e Recursos"
      enabled: true
      cards:
        - {id: "fontes_dados", enabled: true, variant: "neutral", size: "half"}
        - {id: "metodologia_links", enabled: true, variant: "neutral", size: "half"}
    - id: "APP_E"
      title: "Próximos Ciclos e Roadmap"
      enabled: true
      cards:
        - {id: "proximos_ciclos", enabled: true, variant: "highlight", size: "full"}
        - {id: "disclaimers", enabled: true, variant: "neutral", size: "full"}

# ==============================================================================
# REGISTRY DE CARDS DISPONÍVEIS
# ==============================================================================
# Referência: IDs de cards consumidos pelo renderer React.
# Use os IDs abaixo nas seções acima. Cada ID mapeia para um componente.
#
# ID                          | Builder Function                        | Seção Original
# ----------------------------|-----------------------------------------|---------------
# patrimonio_categorias       | build_patrimonio_categorias_card()      | S1
# receitas_fonte              | build_receitas_fonte_card()             | S1
# reserva_emergencia          | build_reserva_emergencia_card()         | S1
# endividamento               | build_endividamento_card()              | S1
# orcamento_prospectivo       | build_orcamento_prospectivo_card()      | S2
# consumo_consciente          | build_consumo_consciente_card()         | S2
# diagnostico_comportamental  | build_diagnostico_comportamental_card() | S2
# milhas                      | build_milhas_card()                     | S2
# alocacao_atual_vs_alvo      | <React-only: AlocacaoAtualVsAlvoCard>   | S3 (A11)
# kpi_rentabilidade           | (inline HTML block)                     | S3
# estrategia_aporte           | build_estrategia_aporte_card()          | S3
# contrafluxo                 | (inline HTML block)                     | S3
# previdencia_pgbl            | build_previdencia_pgbl_card()           | S7
# pontos_fortes               | build_pontos_fortes_card()              | S10
# pontos_urgentes             | build_pontos_urgentes_card()            | S10
# equilibrio_cerbasi          | build_equilibrio_cerbasi_card()         | S10
#
# CHARTS DISPONÍVEIS:
# patrimonio_doughnut, waterfall_if, fluxo_mensal, receita_bar,
# despesas_doughnut, receita_despesa_mensal, score_gauge,
# top15_ativos, cenarios_conjuge,
# viagens, projecao_3cenarios, renda_passiva,
# impostos_pj, bubble_riscos, top5_decisoes

