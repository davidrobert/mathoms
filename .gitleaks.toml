# gitleaks config — Sprint A11 W2-T03 ([[ADR-230]] §D3)
#
# IMPORTANTE — sintaxe SINGULAR `[allowlist]`, NÃO `[[allowlists]]` (array):
#   Com `[extend] useDefault = true`, o merge do gitleaks descarta a allowlist
#   top-level no formato array `[[allowlists]]` (plural) — só a tabela singular
#   `[allowlist]` sobrevive ao merge com o config default embutido. O formato
#   plural ficava silenciosamente INERTE (segredo sintético legítimo voltava a
#   ser flagado), e só não explodia porque o hook roda `protect --staged` (não
#   rescaneia arquivo não-alterado). Provado empiricamente com o binário pinado
#   do hook (.pre-commit-config.yaml). Não reintroduzir `[[allowlists]]` aqui
#   enquanto `useDefault = true` estiver ativo.
#
# Semântica: dentro de UMA allowlist, os critérios (`paths`, `regexes`,
#   `commits`) combinam por OR (default `condition`). Logo `paths` allowlista
#   QUALQUER segredo no path — é a forma de liberar dirs de teste/fixture
#   inteiros. CPF sintético em teste já cai nesses paths; manter regex de CPF
#   aqui seria global (liberaria CPF em código de prod) — política de CPF é do
#   hook dedicado "Anti-PII em fixtures", não do gitleaks.
#
# Allowlist policy:
#   - Paths: dirs de teste/fixture/baseline, docs/archive/, migrations
#     Alembic. Libera qualquer match dentro deles.
#   - Regexes: dev keys documentadas (não-secret em prod real).
#   - Commits: SHAs históricos com matches conhecidos (baseline).
#
# Sempre que adicionar entry: PR + justificativa + comentário inline.
# Override emergencial: ver docs/reference/runbooks/security_gates.md.

[extend]
useDefault = true

[allowlist]
description = "Allowlist global do Mathoms (paths sintéticos + dev keys documentadas)"

paths = [
    # `_archive/` foi deletado do HEAD na A34.l7 (entry removida junto —
    # allowlistar recriação seria regressão). A entry raiz de
    # EXEMPLO_DE_RELATORIO.html também saiu: o exemplo vive em
    # docs/plan/REPORT_PREMIUM/ e vira sintético na A34.l8.
    # Dirs de teste inteiros (cobrem fixtures, goldens e tests inline com
    # segredos sintéticos). Eram cobertos pela entry de CPF via OR no formato
    # plural antigo; preservados aqui explicitamente.
    '''^tests/''',
    '''^backend/tests/''',
    '''^frontend/src/test/''',
    '''^frontend/playwright-baselines/''',
    '''^dev/snapshots/''',
    '''^docs/archive/''',
    # A entry ampla '''^docs/.*\.md$''' foi removida na A34.l6 (ADR-319):
    # com gitleaks bloqueante de merge, allowlistar docs/ inteiro cegaria o
    # gate para secret colado em doc. Verificado zero finding na árvore sem
    # a entry (2026-07-08). Placeholder legítimo em doc entra como regex
    # específico abaixo, com justificativa.
    # Migrações Alembic legadas (sem secret, mas regex de chave pode disparar)
    '''^backend/alembic/versions/.*\.py$''',
]

regexes = [
    # MATHOMS_FERNET_KEY hardcoded em ci.yml/nightly.yml (key de dev;
    # rotacionada em prod via secrets — TODO cicd-onda-3)
    '''NwHpLJlLGSeC7NIS6gfVdVSYh_pObKqY4G_CwkQ1kuA=''',
    # SECRET_KEY default rejeitada em prod por model_validator (W1-T05)
    '''dev-secret-key-change-in-production''',
    # Fernet key placeholders em docs/runbooks
    '''<MATHOMS_FERNET_KEY>''',
    '''<FERNET_KEY_PLACEHOLDER>''',
    # --- Falso-positivo de `generic-api-key` sobre IDENTIFICADOR de código (#1184) ---
    # A regra casa por proximidade de keyword (`api`, `KEY`) + entropia, e o "segredo"
    # extraído é o nome do símbolo. Allowlist por SÍMBOLO, não por commit: suprimir o
    # commit inteiro esconderia segredo real que estivesse no mesmo diff, e a entrada
    # por símbolo fica visivelmente obsoleta se alguém renomear.
    # `import { declareLastroOverride as apiDeclare, fetchExposicaoCambialV2 }` — alias TS
    '''fetchExposicaoCambialV2''',
    # `global _KEY_F1F2_TITULAR, _KEY_F1F2_CONJUGE` — nome de global em Python
    '''_KEY_F1F2_CONJUGE''',
]

# Baseline de commits SHAs históricos com matches conhecidos.
# Popular via: `gitleaks detect --report-path .gitleaks-baseline.json`
# Entries adicionadas após análise de matches legítimos.
#
# Populado em 2026-08-24 pela triagem da Issue #1184, com autorização explícita do
# dono. Só entram commits cujo segredo é REAL e cujo risco residual foi confirmado
# nulo — falso-positivo de identificador vai em `regexes` acima, nunca aqui.
commits = [
    # `.env` + `backend/.env` com `FIN_FERNET_KEY`. Dev-only e JÁ ROTACIONADA: o
    # commit `90279c68` (2026-04-20) registra "A chave era só de dev (nunca usada em
    # prod)" e "Chave antiga está revogada de facto". Prefixo `FIN_` é anterior ao
    # rename do produto — zero referências no HEAD. Regressão barrada por
    # `dev/check_forbidden_paths.py`, que bloqueia `.env` no staging.
    "ae340c60a3cae397d4bdbab7e32e9cf2258d877e",
    # `Makefile:58` — chave de smoke hardcoded no target `smoke-seed`. Prática já
    # remediada no HEAD: o Makefile gera `$(ephemeral_fernet)` em runtime e escreve
    # em `$(SMOKE_DIR)/fernet.key`. Nunca tocou dado de produção (SQLite local).
    "f7b824edc880fe4a5b84a0141e9072627f2dab5f",
]
