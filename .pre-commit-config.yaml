# .pre-commit-config.yaml — hooks locais + comunitários
#
# Instalar uma vez:  pip install pre-commit && pre-commit install --install-hooks
# Instalar commit-msg hook também: pre-commit install --hook-type commit-msg
#
# Rodar manualmente em todos os arquivos: pre-commit run --all-files
#
# Os hooks locais usam os scripts em dev/ — mesma lógica do dev/commit.py,
# aplicada por git hook (pre-commit e commit-msg). Defense-in-depth:
# mesmo quem roda `git commit` direto é protegido.

repos:
  # ----------------------------------------------------------------------
  # Hooks da comunidade — higiene básica
  # ----------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]  # 1MB — PRs ficam leves; override com --no-verify se precisar
      - id: detect-private-key

  # ----------------------------------------------------------------------
  # Ruff — linter + formatter Python (A6g.6 slice 1 + A6g.6b, ADR-114)
  #
  # Config em pyproject.toml [tool.ruff]. Seleção E/F/I/W.
  # ruff-format ativado como gate bloqueante após sweep A6g.6b.
  # ----------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        # Sem --fix: gate bloqueante; dev roda `ruff check --fix .` manual.
        args: []
      - id: ruff-format
        # --check: bloqueia commits com formatação fora do padrão.
        args: [--check]

  # ----------------------------------------------------------------------
  # Hooks locais — regras específicas do Fin
  # ----------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint-frontend
        # A6g.6 slice 2, ADR-114: gate @typescript-eslint/no-explicit-any.
        # Wrapper em dev/ pula limpo se frontend/node_modules não existe
        # (dev pode não ter rodado npm install).
        name: "ESLint: frontend/src (no-explicit-any)"
        entry: bash dev/run_eslint_frontend.sh
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: forbidden-names
        # A6g.6 slice 3, ADR-114: bloqueia filenames genéricos.
        name: "Proíbe filenames genéricos (utils, helpers, manager, handler)"
        entry: python3 dev/check_forbidden_names.py
        language: system
        pass_filenames: true
        files: \.(py|ts|tsx)$

      - id: float-money
        # A6g.6 slice 3, ADR-114: bloqueia `: float` em campo monetário
        # (ADR-090). Checa apenas linhas adicionadas — legado fica.
        name: "Proíbe float em campo monetário (ADR-090)"
        entry: python3 dev/check_float_money.py
        language: system
        pass_filenames: true
        types: [python]

      - id: forbidden-paths
        name: "Bloqueia paths sensíveis (storage/, .env, *.db, …)"
        entry: python dev/check_forbidden_paths.py
        language: system
        # Roda uma vez por commit, passando todos os arquivos staged
        pass_filenames: true
        # Não queremos restringir por tipo — queremos ver TODOS os paths
        types: [file]

      - id: commit-msg-format
        name: "Valida prefixo de mensagem de commit"
        entry: python dev/validate_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: design-tokens-sync
        name: "Design tokens gerados estão em sync com tokens.json (ADR-076)"
        entry: python3 design-tokens/build.py --check
        language: system
        pass_filenames: false
        # Roda apenas quando arquivos relevantes mudam
        files: '^(design-tokens/tokens\.json|frontend/src/styles/tokens\.css|config/templates/_tokens\.css)$'

      - id: check-css-var-references
        # W1-T01 — bloqueia var(--xxx) que não existe em tokens.css/globals.css.
        # Cluster PD-001/002/005/023: tokens fantasma (semantic-danger,
        # semantic-success, semantic-warning, brand-secondary) só viraram
        # CSS válido depois das aliases em tokens.json (ADR-076).
        name: "CSS var(--xxx) references must exist in tokens.css/globals.css"
        entry: python3 dev/check_css_var_references.py
        language: system
        pass_filenames: false
        files: '^(frontend/src/.*\.(tsx|ts|css)|frontend/src/styles/tokens\.css|frontend/src/app/globals\.css|design-tokens/tokens\.json)$'

      - id: report-layout-codegen
        name: "Report layout codegen (TS/Pydantic) em sync com YAML (ADR-076)"
        entry: python3 dev/codegen_report_layout.py --check
        language: system
        pass_filenames: false
        files: '^(config/report_layout\.yaml|config/schemas/report_layout\.schema\.json|frontend/src/generated/report-layout\.ts|backend/app/generated/report_layout\.py)$'

      - id: code-style-baseline
        # ADR-114 / A6g.6 slice 5 — gate de regressão das categorias do
        # audit. Roda quando py/ts/tsx mudam (mesmo set de arquivos que
        # o audit_code_style.py varre). ~5s no repo atual.
        name: "Code style baseline (P1/P7/P8 não regridem)"
        entry: python3 dev/check_code_style_regression.py
        language: system
        pass_filenames: false
        files: \.(py|ts|tsx)$

      - id: frontend-lock-sync
        # Gate inspirado no incidente 2026-04-25 (cb0ff11) — package.json
        # commitado sem regenerar lockfile quebrou `npm ci` em CI por ~5h.
        name: "frontend/package-lock.json em sync com package.json"
        entry: python3 dev/check_frontend_lock_sync.py
        language: system
        pass_filenames: false
        files: ^frontend/(package\.json|package-lock\.json)$

      - id: main-drift-check
        name: "pre-push: bloqueia push para main se origin/main avançou"
        entry: python3 dev/check_main_drift.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: code-style-baseline-prepush
        # Defesa em profundidade: pre-commit por arquivo (acima) detecta
        # ofensores no diff atual; este pre-push roda baseline cumulativo
        # sobre a branch inteira. Cherry-pick de N commits paralelos pode
        # passar individualmente mas regredir o agregado — observado em
        # F3/F4 do DOC_REORG (ADR-182). +3-5s no push.
        name: "pre-push: code-style baseline (cumulativo, pega regressão de cherry-pick composto)"
        entry: python3 dev/check_code_style_regression.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # --------------------------------------------------------------------
      # Gates de DECISIONS.md (Sprint A7 · F0/F4/F8 do plano de correção)
      # --------------------------------------------------------------------
      - id: adr-anchors
        name: "DECISIONS.md: anchor links válidos (GitHub Slugger)"
        entry: python3 dev/check_adr_anchors.py
        language: system
        files: ^docs/DECISIONS\.md$
        pass_filenames: false

      # adr-toc removido em F2.F (DOC_REORG / ADR-182): ToC inline em
      # DECISIONS.md foi substituído por _MOC/_generated/ADR_INDEX.md
      # gerado por dev/build_doc_index.py (gate doc-index, mais acima).

      - id: adr-format
        name: "DECISIONS.md: formato Status/Data + estrutura mínima"
        entry: python3 dev/validate_adr_format.py
        language: system
        files: ^docs/DECISIONS\.md$
        pass_filenames: false

      # --------------------------------------------------------------------
      # Gate de subagent catalog (W6-T04): CLAUDE.md sincronizado com
      # `.claude/agents/*.md` (frontmatter `description`).
      # Re-gen: `python3 dev/build_subagent_catalog.py --inline`.
      # --------------------------------------------------------------------
      - id: subagent-catalog
        name: "CLAUDE.md: catálogo de subagentes sincronizado com .claude/agents/"
        entry: python3 dev/check_subagent_catalog.py
        language: system
        files: ^(CLAUDE\.md|\.claude/agents/.*\.md)$
        pass_filenames: false

      # --------------------------------------------------------------------
      # Gates da vault Obsidian-friendly (Fase 1 do plano DOC_REORG, ADR-182)
      # Acionados quando arquivos da vault mudam (notas, schemas, MOCs).
      # --------------------------------------------------------------------
      - id: doc-frontmatter
        name: "docs/: frontmatter YAML válido contra docs/_schemas/"
        entry: python3 dev/validate_frontmatter.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true

      - id: doc-filename-id
        name: "docs/: filename casa com id: do frontmatter"
        entry: python3 dev/check_doc_filename_id.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true

      - id: doc-links
        name: "docs/: wikilinks [[X]] resolvem"
        entry: python3 dev/check_doc_links.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

      - id: doc-index
        name: "docs/_MOC/_generated/ regenerado por dev/build_doc_index.py"
        entry: python3 dev/build_doc_index.py --check
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

      - id: doc-token-cost
        name: "docs/: benchmark de tokens sem regressão >5% vs latest"
        entry: python3 dev/benchmark_doc_token_cost.py --check
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
