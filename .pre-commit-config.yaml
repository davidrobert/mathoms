# .pre-commit-config.yaml — hooks locais + comunitários
#
# Instalar uma vez:  pip install pre-commit && pre-commit install --install-hooks
# Instalar commit-msg hook também: pre-commit install --hook-type commit-msg
#
# Rodar manualmente em todos os arquivos: pre-commit run --all-files
#
# Os hooks locais usam os scripts em dev/ — mesma lógica do dev/commit.py,
# aplicada por git hook (pre-commit e commit-msg). Defense-in-depth:
# mesmo quem roda `git commit` direto é protegido.

repos:
  # ----------------------------------------------------------------------
  # Hooks da comunidade — higiene básica
  # ----------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]  # 1MB — PRs ficam leves; override com --no-verify se precisar
      - id: detect-private-key

  # ----------------------------------------------------------------------
  # Ruff — linter + formatter Python (A6g.6 slice 1 + A6g.6b, ADR-114)
  #
  # Config em pyproject.toml [tool.ruff]. Seleção E/F/I/W.
  # ruff-format ativado como gate bloqueante após sweep A6g.6b.
  # ----------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        # Sem --fix: gate bloqueante; dev roda `ruff check --fix .` manual.
        args: []
      - id: ruff-format
        # --check: bloqueia commits com formatação fora do padrão.
        args: [--check]

  # ----------------------------------------------------------------------
  # Hooks locais — regras específicas do Fin
  # ----------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint-frontend
        # A6g.6 slice 2, ADR-114: gate @typescript-eslint/no-explicit-any.
        # Wrapper em dev/ pula limpo se frontend/node_modules não existe
        # (dev pode não ter rodado npm install).
        name: "ESLint: frontend/src (no-explicit-any)"
        entry: bash dev/run_eslint_frontend.sh
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: forbidden-names
        # A6g.6 slice 3, ADR-114: bloqueia filenames genéricos.
        name: "Proíbe filenames genéricos (utils, helpers, manager, handler)"
        entry: python3 dev/check_forbidden_names.py
        language: system
        pass_filenames: true
        files: \.(py|ts|tsx)$

      - id: float-money
        # A6g.6 slice 3, ADR-114: bloqueia `: float` em campo monetário
        # (ADR-090). Checa apenas linhas adicionadas — legado fica.
        name: "Proíbe float em campo monetário (ADR-090)"
        entry: python3 dev/check_float_money.py
        language: system
        pass_filenames: true
        types: [python]

      - id: forbidden-paths
        name: "Bloqueia paths sensíveis (storage/, .env, *.db, …)"
        entry: python dev/check_forbidden_paths.py
        language: system
        # Roda uma vez por commit, passando todos os arquivos staged
        pass_filenames: true
        # Não queremos restringir por tipo — queremos ver TODOS os paths
        types: [file]

      - id: commit-msg-format
        name: "Valida prefixo de mensagem de commit"
        entry: python dev/validate_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: design-tokens-sync
        name: "Design tokens gerados estão em sync com tokens.json (ADR-076)"
        entry: python3 design-tokens/build.py --check
        language: system
        pass_filenames: false
        # Roda apenas quando arquivos relevantes mudam
        files: '^(design-tokens/tokens\.json|frontend/src/styles/tokens\.css|config/templates/_tokens\.css)$'

      - id: report-layout-codegen
        name: "Report layout codegen (TS/Pydantic) em sync com YAML (ADR-076)"
        entry: python3 dev/codegen_report_layout.py --check
        language: system
        pass_filenames: false
        files: '^(config/report_layout\.yaml|config/schemas/report_layout\.schema\.json|frontend/src/generated/report-layout\.ts|backend/app/generated/report_layout\.py)$'

      - id: main-drift-check
        name: "pre-push: bloqueia push para main se origin/main avançou"
        entry: python3 dev/check_main_drift.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
