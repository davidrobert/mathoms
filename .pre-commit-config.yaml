# .pre-commit-config.yaml — hooks locais + comunitários
#
# Instalar uma vez:  pip install pre-commit && pre-commit install --install-hooks
# Instalar commit-msg hook também: pre-commit install --hook-type commit-msg
#
# Rodar manualmente em todos os arquivos: pre-commit run --all-files
#
# Os hooks locais usam os scripts em dev/ — mesma lógica do dev/commit.py,
# aplicada por git hook (pre-commit e commit-msg). Defense-in-depth:
# mesmo quem roda `git commit` direto é protegido.

repos:
  # ----------------------------------------------------------------------
  # Hooks da comunidade — higiene básica
  # ----------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]  # 1MB — PRs ficam leves; override com --no-verify se precisar
      - id: detect-private-key

  # ----------------------------------------------------------------------
  # gitleaks — varre stage atual ([[ADR-230]] §D3, Sprint A11 W2-T03).
  # Dupla camada: pre-commit (rápido, local) + CI workflow (full history,
  # defesa contra `git commit --no-verify`). Config em .gitleaks.toml.
  # rev pinado em v8.24.3 = MESMA versão do binário do CI
  # (gitleaks-action@v2.3.9 hardcoda gitleaks 8.24.3) → paridade de regras de
  # detecção local↔CI. Ao bumpar, bumpe os dois no mesmo PR (ver ADR-230 §D3).
  # ----------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # ----------------------------------------------------------------------
  # Ruff — linter + formatter Python (A6g.6 slice 1 + A6g.6b, ADR-114)
  #
  # Config em pyproject.toml [tool.ruff]. Seleção E/F/I/W.
  # ruff-format ativado como gate bloqueante após sweep A6g.6b.
  # ----------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        # Sem --fix: gate bloqueante; dev roda `ruff check --fix .` manual.
        args: []
      - id: ruff-format
        # --check: bloqueia commits com formatação fora do padrão.
        args: [--check]

  # ----------------------------------------------------------------------
  # Hooks locais — regras específicas do Fin
  # ----------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint-frontend
        # A6g.6 slice 2, ADR-114: gate @typescript-eslint/no-explicit-any.
        # Wrapper em dev/ pula limpo se frontend/node_modules não existe
        # (dev pode não ter rodado npm install).
        name: "ESLint: frontend/src (no-explicit-any)"
        entry: bash dev/run_eslint_frontend.sh
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: forbidden-names
        # A6g.6 slice 3, ADR-114: bloqueia filenames genéricos.
        name: "Proíbe filenames genéricos (utils, helpers, manager, handler)"
        entry: python3 dev/check_forbidden_names.py
        language: system
        pass_filenames: true
        files: \.(py|ts|tsx)$

      - id: float-money
        # A6g.6 slice 3, ADR-114: bloqueia `: float` em campo monetário
        # (ADR-090). Checa apenas linhas adicionadas — legado fica.
        name: "Proíbe float em campo monetário (ADR-090)"
        entry: python3 dev/check_float_money.py
        language: system
        pass_filenames: true
        types: [python]

      - id: float-money-models
        # ADR-283: full-scan de colunas SQLAlchemy `Float` em models/ (rede de
        # segurança contra regressão de persistência). Allowlist nominal no
        # próprio gate; roda sempre, independente de diff.
        name: "Proíbe coluna Float monetária em models (ADR-090/ADR-283)"
        entry: python3 dev/check_float_money.py --scan-models backend/app/models
        language: system
        pass_filenames: false
        always_run: true

      - id: forbidden-paths
        name: "Bloqueia paths sensíveis (storage/, .env, *.db, …)"
        entry: python dev/check_forbidden_paths.py
        language: system
        # Roda uma vez por commit, passando todos os arquivos staged
        pass_filenames: true
        # Não queremos restringir por tipo — queremos ver TODOS os paths
        types: [file]

      - id: residencia-keyword-dead
        # ADR-215 P6: keyword foi substituída por override DB. Adições novas
        # em arquivos não-allowlisted são regressão.
        name: "Proíbe adição de residencia_principal_keyword (ADR-215 P6)"
        entry: python3 dev/check_residencia_keyword.py
        language: system
        pass_filenames: true
        types: [file]

      - id: pipeline-sessions
        # ADR-256: stages do pipeline não abrem Session SQLAlchemy própria
        # (2 incidentes prod com mesma raiz em 4 dias — session paralela
        # contendo write-lock SQLite enquanto stage_session retém o lock
        # via autoflush). Reusam ctx.get_artifact_store().session ou
        # recebem db: Session por parâmetro kwarg-only.
        name: "Stages do pipeline não abrem Session própria (ADR-256)"
        entry: python3 dev/check_pipeline_sessions.py
        language: system
        # Roda sem args (scaneia pipeline/** todo). pass_filenames=false:
        # check do invariante é global, não por-arquivo-tocado.
        pass_filenames: false
        always_run: true
        types: [python]

      - id: extract-no-domain-imports
        # ADR-280: extração pura (scripts/e2/**, pipeline/stages/extract_*) não
        # importa domínio (category_template / *_dedup / config_store). Trava o
        # critério Extract|Transform; de-leak de regras que hoje vazam é F2.
        name: "Extração pura: proíbe imports de domínio (ADR-280)"
        entry: python3 dev/check_extract_no_domain_imports.py
        language: system
        # Invariante global (varre as raízes de extração todas), não por-arquivo.
        pass_filenames: false
        always_run: true
        types: [python]

      - id: golden-rebaseline-isolation
        # F2-DB5 (G-c · A24.l1): commit que mistura golden
        # (tests/fixtures/pipeline_golden/**) com código de produção
        # (pipeline/**, scripts/**, backend/app/**) falha — rebaseline viaja
        # em commit próprio com manifesto justificado. Name-only, por commit.
        name: "Rebaseline de golden isolado de código de produção (G-c)"
        entry: python3 dev/check_golden_rebaseline_isolation.py
        language: system
        pass_filenames: false
        always_run: true

      - id: no-leak-field-consumers
        # F2-DB8 (A24.l1): guarda contínua do de-leak — novo reader de
        # tipo_lancamento/numero_conta_norm em pipeline/** ou backend/** falha.
        # O strip+rerun com zero delta foi a prova one-shot do discovery.
        name: "Proíbe novo consumidor de campo em de-leak F2 (ADR-280)"
        entry: python3 dev/check_no_leak_field_consumers.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: classification-exhaustive
        # ADR-235 A16: bloqueia switch/match sobre `classification` sem
        # branch default — enum cresce (nu_proprietario foi o último
        # valor adicionado), reader exhaustive quebra silenciosamente.
        name: "switch/match sobre classification exige default (ADR-235)"
        entry: python3 dev/check_classification_exhaustive.py
        language: system
        pass_filenames: true
        files: \.(py|ts|tsx)$

      - id: test-health
        # Detecta anti-padrões que custam tempo de CI sem dar sinal:
        # parametrize que recomputa scan caro, soft-fail s/ env de hard-fail
        # ativo, migration test sem marker, teste descartável pós-cutover,
        # bcrypt prod-grade em test individual. Ver dev/check_test_health.py
        # e ADR-203 §Política de testes saudáveis.
        name: "Anti-padrões de teste (recomputo, soft-fail órfão, migration sem marker)"
        entry: python3 dev/check_test_health.py
        language: system
        pass_filenames: false
        files: ^(backend/tests|tests)/.*\.py$

      - id: lockfile-sync
        # ADR-254 (A20.l10): garante requirements.lock em sincronia com as
        # deps diretas de requirements.in + backend/requirements.in. Bloqueia
        # commit que edita .in sem regenerar o .lock. Regen exige container
        # linux/amd64 — ver docs/reference/runbooks/python_dependencies.md.
        name: "Lockfile Python em sincronia (requirements.in ↔ requirements.lock)"
        entry: python3 dev/check_lockfile_sync.py
        language: system
        pass_filenames: false
        files: '^(requirements\.in|backend/requirements\.in|requirements\.lock)$'

      - id: docker-sha-pin
        # ADR-249 (A20.l2): toda imagem base externa em Dockerfile/compose
        # versionado deve estar pinada por digest @sha256: do índice multi-arch
        # (reprodutibilidade dev↔CI↔prod). Dependabot re-pina; este hook impede
        # drift no próximo Dockerfile novo. Isenta stage refs, scratch e
        # imagens de build local (mathoms-*).
        name: "Docker bases pinadas por @sha256: (Dockerfile + compose)"
        entry: python3 dev/check_docker_sha_pin.py
        language: system
        files: '(^|/)Dockerfile(\.[^/]+)?$|(^|/)docker-compose[^/]*\.ya?ml$'

      - id: lint-no-real-pii
        # F6.5D.7 — bloqueia CPF real em fixtures de teste. Aceita apenas
        # placeholders (000.000.000-00, 123.456.789-09, 111.111.111-11) ou
        # CPFs gerados via tests/utils/cpf.py (anotados com `# noqa: PII-ok`).
        # Já roda no workflow CI; pre-commit local evita ciclo
        # commit→push→CI-fail→fix descobrindo só remoto.
        name: "Anti-PII em fixtures (CPF real bloqueado; placeholder ou gerador mod-11)"
        entry: python3 tests/utils/lint_no_real_pii.py
        language: system
        pass_filenames: false
        files: ^(backend/tests|tests|frontend/tests)/.*$

      - id: sigilo-terms
        # §13 sigilo metodológico (LEGAL/IP) — bloqueia atribuição pública de
        # Perini/Cerbasi/AUVP/etc. em superfície user-facing:
        #   - frontend/src/(app|components)/**/*.{ts,tsx}  (UI cliente)
        #   - docs/_marketing/**/*.md                       (drafts de copy)
        # Mathoms não tem licença das marcas; uso público viola direito de
        # marca pessoal/curso. Atribuição interna (docstrings, types, ids,
        # variant keys, dev playground, ADRs, planos) é PERMITIDA.
        name: "Bloqueia menção pública de fontes metodológicas (§13 COPY_GUIDELINES)"
        entry: python3 dev/check_sigilo_terms.py
        language: system
        pass_filenames: true
        files: ^(frontend/src/(app|components)/.*\.(ts|tsx)|docs/_marketing/.*\.md)$

      - id: commit-msg-format
        name: "Valida prefixo de mensagem de commit"
        entry: python dev/validate_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: design-tokens-sync
        name: "Design tokens gerados estão em sync com tokens.json (ADR-076)"
        entry: python3 design-tokens/build.py --check
        language: system
        pass_filenames: false
        # Roda apenas quando arquivos relevantes mudam
        files: '^(design-tokens/tokens\.json|frontend/src/styles/tokens\.css|config/templates/_tokens\.css)$'

      - id: check-css-var-references
        # W1-T01 — bloqueia var(--xxx) que não existe em tokens.css/globals.css.
        # Cluster PD-001/002/005/023: tokens fantasma (semantic-danger,
        # semantic-success, semantic-warning, brand-secondary) só viraram
        # CSS válido depois das aliases em tokens.json (ADR-076).
        name: "CSS var(--xxx) references must exist in tokens.css/globals.css"
        entry: python3 dev/check_css_var_references.py
        language: system
        pass_filenames: false
        files: '^(frontend/src/.*\.(tsx|ts|css)|frontend/src/styles/tokens\.css|frontend/src/app/globals\.css|design-tokens/tokens\.json)$'

      - id: report-layout-codegen
        name: "Report layout codegen (TS/Pydantic) em sync com YAML (ADR-076)"
        entry: python3 dev/codegen_report_layout.py --check
        language: system
        pass_filenames: false
        files: '^(config/report_layout\.yaml|config/schemas/report_layout\.schema\.json|frontend/src/generated/report-layout\.ts|backend/app/generated/report_layout\.py)$'

      - id: planner-manifest-coverage
        # ADR-200 §D3 (M1) + ADR-206 §6 (snapshot drift):
        # manifest do parecer ↔ E5 schema ↔ report_layout em sync.
        # Snapshot baseline em dev/snapshots/e5_schema_hash.txt — regen
        # com `python3 dev/check_planner_manifest_coverage.py --update-snapshot`.
        name: "Manifest do parecer planejador em sync com E5 schema + report_layout (ADR-200)"
        entry: python3 dev/check_planner_manifest_coverage.py
        language: system
        pass_filenames: false
        files: '^(config/prompts/parecer_planejador\.yaml|config/schemas/parecer_planejador\.schema\.json|config/schemas/e5_analysis\.schema\.json|config/report_layout\.yaml|docs/_schemas/note-planner\.schema\.json|dev/check_planner_manifest_coverage\.py|dev/snapshots/e5_schema_hash\.txt)$'

      - id: prompt-version-bumped
        # Sprint A11 W2-T05 · ADR-233 — exige bump de PROMPT_VERSION
        # quando arquivo de prompt LLM muda. Heurística simples
        # (arquivo mudou + tem PROMPT_VERSION sem bump → falha) — false
        # positive aceito (refactor de comment força bump). Cobre auto-
        # detecção de todos os arquivos em pipeline/llm/prompts/ e
        # pipeline/llm/schemas/ com a constante declarada.
        name: "PROMPT_VERSION bumpado quando prompt LLM muda (W2-T05 · ADR-233)"
        entry: python3 dev/check_prompt_version_bumped.py
        language: system
        pass_filenames: true
        files: ^pipeline/llm/(prompts|schemas)/.*\.py$

      - id: code-style-baseline
        # ADR-114 / A6g.6 slice 5 — gate de regressão das categorias do
        # audit. Roda quando py/ts/tsx mudam (mesmo set de arquivos que
        # o audit_code_style.py varre). ~5s no repo atual.
        name: "Code style baseline (P1/P7/P8 não regridem)"
        entry: python3 dev/check_code_style_regression.py
        language: system
        pass_filenames: false
        files: \.(py|ts|tsx)$

      - id: frontend-lock-sync
        # Gate inspirado no incidente 2026-04-25 (cb0ff11) — package.json
        # commitado sem regenerar lockfile quebrou `npm ci` em CI por ~5h.
        name: "frontend/package-lock.json em sync com package.json"
        entry: python3 dev/check_frontend_lock_sync.py
        language: system
        pass_filenames: false
        files: ^frontend/(package\.json|package-lock\.json)$

      - id: main-drift-check
        name: "pre-push: bloqueia push para main se origin/main avançou"
        entry: python3 dev/check_main_drift.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: code-style-baseline-prepush
        # Defesa em profundidade: pre-commit por arquivo (acima) detecta
        # ofensores no diff atual; este pre-push roda baseline cumulativo
        # sobre a branch inteira. Cherry-pick de N commits paralelos pode
        # passar individualmente mas regredir o agregado — observado em
        # F3/F4 do DOC_REORG (ADR-182). +3-5s no push.
        name: "pre-push: code-style baseline (cumulativo, pega regressão de cherry-pick composto)"
        entry: python3 dev/check_code_style_regression.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # --------------------------------------------------------------------
      # Gates de DECISIONS.md (Sprint A7 · F0/F4/F8 do plano de correção)
      # --------------------------------------------------------------------
      - id: adr-anchors
        name: "DECISIONS.md: anchor links válidos (GitHub Slugger)"
        entry: python3 dev/check_adr_anchors.py
        language: system
        files: ^docs/DECISIONS\.md$
        pass_filenames: false

      # adr-toc removido em F2.F (DOC_REORG / ADR-182): ToC inline em
      # DECISIONS.md foi substituído por _MOC/_generated/ADR_INDEX.md
      # gerado por dev/build_doc_index.py (gate doc-index, mais acima).

      - id: adr-format
        name: "DECISIONS.md: formato Status/Data + estrutura mínima"
        entry: python3 dev/validate_adr_format.py
        language: system
        files: ^docs/DECISIONS\.md$
        pass_filenames: false

      # --------------------------------------------------------------------
      # Gate de subagent catalog (W6-T04): CLAUDE.md sincronizado com
      # `.claude/agents/*.md` (frontmatter `description`).
      # Re-gen: `python3 dev/build_subagent_catalog.py --inline`.
      # --------------------------------------------------------------------
      - id: subagent-catalog
        name: "CLAUDE.md: catálogo de subagentes sincronizado com .claude/agents/"
        entry: python3 dev/check_subagent_catalog.py
        language: system
        files: ^(CLAUDE\.md|\.claude/agents/.*\.md)$
        pass_filenames: false

      - id: codex-agents-sync
        name: "Codex agents: .codex/agents sincronizado com .claude/agents/"
        entry: python3 dev/sync_codex_agents.py --check
        language: system
        files: ^(\.claude/agents/.*\.md|\.codex/agents/.*\.toml|dev/sync_codex_agents\.py)$
        pass_filenames: false

      # --------------------------------------------------------------------
      # Gates da vault Obsidian-friendly (Fase 1 do plano DOC_REORG, ADR-182)
      # Acionados quando arquivos da vault mudam (notas, schemas, MOCs).
      # --------------------------------------------------------------------
      - id: doc-frontmatter
        name: "docs/: frontmatter YAML válido contra docs/_schemas/"
        entry: python3 dev/validate_frontmatter.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true

      - id: doc-filename-id
        name: "docs/: filename casa com id: do frontmatter"
        entry: python3 dev/check_doc_filename_id.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true

      - id: doc-lane-plan-refs
        name: "docs/: lane.plan aponta para PLAN existente"
        entry: python3 dev/check_lane_plan_refs.py
        language: system
        files: ^docs/(sprint/.*/lanes/.*\.md|plan/.*/_README\.md)$
        pass_filenames: false

      - id: doc-links
        name: "docs/: wikilinks [[X]] resolvem"
        entry: python3 dev/check_doc_links.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

      - id: doc-markdown-links
        name: "docs/: markdown links relativos resolvem (arquivos tocados)"
        entry: python3 dev/check_doc_markdown_links.py
        language: system
        files: ^docs/.*\.md$
        # Qualquer dir `archive/` (inclui docs/agent_prompts/archive/) — docs
        # arquivados são arqueologia congelada; seus links relativos não são gate.
        exclude: (^|/)archive/
        pass_filenames: true

      - id: doc-index
        name: "docs/_MOC/_generated/ regenerado por dev/build_doc_index.py"
        entry: python3 dev/build_doc_index.py --check
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

      - id: doc-token-cost
        name: "docs/: benchmark de tokens sem regressão >5% vs latest"
        entry: python3 dev/benchmark_doc_token_cost.py --check
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
