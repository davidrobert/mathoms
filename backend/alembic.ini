[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
# F6.5E.4 — cwd-safety:
# - %(here)s expande para o diretório de alembic.ini (caminho absoluto).
# - Sufixo `../mathoms.db` aponta para a raiz do repo (alembic.ini vive em backend/),
#   fixando o DB de dev independente de onde o `alembic` é invocado.
# - Em CI/produção, sempre setar MATHOMS_DATABASE_URL via env var. env.py prioriza
#   essa var e tem guard explícito contra paths SQLite relativos.
sqlalchemy.url = sqlite:///%(here)s/../mathoms.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
