[project]
name = "mathoms-pipeline"
version = "0.2.0"
description = "Pipeline de análise e consolidação patrimonial — mathoms.ai"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pdfplumber>=0.10",
    "pikepdf>=8.0",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.30"]
# Setup canônico de dev/test: `pip install -e . -r requirements-dev.txt`
# (puxa requirements.txt + backend/requirements.txt + pytest plugins + reportlab).
# O extra [dev] abaixo é deliberadamente mínimo — não use sozinho;
# `pip install -e ".[dev]"` NÃO basta para rodar a suíte.
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Markers customizados (ADR-199 Ato 6). Sem registro explícito,
# pytest emite ``PytestUnknownMarkWarning`` que polui logs.
# - cross_provider: smoke weekly em workflow dedicado (T-24).
# - monthly_real: golden mensal com LLM real (T-27).
markers = [
    "cross_provider: smoke cross-provider weekly (ADR-199 T-24); skip em CI normal",
    "monthly_real: golden com LLM real, mensal (ADR-199 T-27); skip em CI normal",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (A6g.6 slice 1, ADR-114)
# ---------------------------------------------------------------------------
# Seleção conservadora: regras que já passam hoje em quase todo repo
# (E/F/I/W/UP) + complexidade legado-friendly via per-file-ignores.
# Regras adicionais (B bugbear, C90 mccabe, N naming) ficam para A6g.6b.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "backend/app/generated",
    "frontend/src/generated",
    "_archive",
    "_scratch",
    ".venv-lint",
    "alembic/versions",
]

[tool.ruff.lint]
# Seleção conservadora (E/F/I/W). Rules adicionais (B, UP, C90, N) podem vir
# em sweeps futuros se necessário. I001/F541 passaram a ser bloqueantes em
# A6g.6b após sweep `ruff --fix I001,F541 .` zerar os 361 offenders.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line-length já controlado pelo line-length acima
    "E402",  # module-level import not at top — comum em scripts com sys.path hack
    "E741",  # ambiguous variable name — comum em matemática (l, I)
    "E721",  # type comparison — scripts legacy usam isinstance alt
    "E701",  # multiple statements on one line (colon) — permitido em stubs
    "E702",  # multiple statements on one line (semicolon) — scripts curtos
    "E731",  # lambda assignment — aceitável em configs
    "F841",  # unused variable — comum em testes (placeholder)
    "F401",  # unused imports — regulado por editors
    "F811",  # redefinition — comum em testes com pytest fixtures
]

# ruff format ativo como gate bloqueante (A6g.6b) após sweep de 435 arquivos.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
