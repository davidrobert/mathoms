# Manifesto de rebaseline de golden (A23.l2 · guard-rail G-a/G-c).
#
# Todo value_delta MONETÁRIO num golden rebaselineado precisa de uma entrada
# aqui — `dev/golden_diff.py --manifest` falha (exit 1) para delta monetário
# não-justificado. Match é EXATO ao centavo: (golden, path, old_cents, new_cents).
# Entrada que não casa nenhum value_delta atual (stale/órfã) também falha — o
# manifesto não acumula waivers mortos.
#
# Disciplina completa (G-c, entregue em A24.l1 `dl-f2-discovery`): `adr`,
# `rationale` e `ref` são OBRIGATÓRIOS (load_manifest falha sem eles — F2-DB6);
# commit de golden+manifesto isolado de código de produção é enforçado por
# `dev/check_golden_rebaseline_isolation.py` (F2-DB5); label `golden-rebaseline`
# + 2º revisor são a camada humana.
#
# Formato de cada entrada (todos os campos obrigatórios):
#   - golden: nome do arquivo golden (igual ao --golden-id passado no CI)
#     path: dot-path do campo (ex.: patrimonio.liquido, composicao[Caixa].valor)
#     old_cents: valor antigo em cents int
#     new_cents: valor novo em cents int
#     adr: ADR que justifica a mudança (formato ADR-NNN)
#     rationale: por que o número mudou (1 linha)
#     ref: file:line da mudança de produção (G-c)
#
# Exemplo (comentado — manifesto começa VAZIO, sem rebaseline pendente):
# - golden: minimal-conta-3_reconciled.json
#   path: patrimonio.liquido
#   old_cents: 40000000
#   new_cents: 39950000
#   adr: ADR-271
#   rationale: "dedup cross-year colapsa conta conjunta; -R$500 esperado"
#   ref: pipeline/domain/services/e5_serialization.py:312
